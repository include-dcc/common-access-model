id: https://includedcc.org/common-access-model/EnumDataCategory
name: EnumDataCategory
enums:
  EnumDataCategory:
    title: Data Category
    description: Categories of data which may be collected about participants.
    reachable_from:
      source_ontology: bioregistry:edam
      source_nodes:
        - edam:topic_0003
      include_self: false
      is_direct: false
      relationship_types:
        - rdfs:subClassOf
    permissible_values:
      edam:topic_0077:
        title: Nucleic acids
        description: The processing and analysis of nucleic acid sequence, structural
          and other data.
        meaning: edam:topic_0077
      edam:topic_0078:
        title: Proteins
        description: Archival, processing and analysis of protein data, typically
          molecular sequence and structural data.
        meaning: edam:topic_0078
      edam:topic_0080:
        title: Sequence analysis
        description: The archival, processing and analysis of molecular sequences
          (monomer composition of polymers) including molecular sequence data resources,
          sequence sites, alignments, motifs and profiles.
        meaning: edam:topic_0080
      edam:topic_0081:
        title: Structure analysis
        description: The curation, processing, analysis and prediction of data about
          the structure of biological molecules, typically proteins and nucleic acids
          and other macromolecules.
        meaning: edam:topic_0081
      edam:topic_0082:
        title: Structure prediction
        description: The prediction of molecular structure, including the prediction,
          modelling, recognition or design of protein secondary or tertiary structure
          or other structural features, and the folding of nucleic acid molecules
          and the prediction or design of nucleic acid (typically RNA) sequences with
          specific conformations.
        meaning: edam:topic_0082
      edam:topic_0084:
        title: Phylogeny
        description: The study of evolutionary relationships amongst organisms.
        meaning: edam:topic_0084
      edam:topic_0085:
        title: Functional genomics
        description: The study of gene or protein functions and their interactions
          in totality in a given organism, tissue, cell etc.
        meaning: edam:topic_0085
      edam:topic_0089:
        title: Ontology and terminology
        description: The conceptualisation, categorisation and nomenclature (naming)
          of entities or phenomena within biology or bioinformatics. This includes
          formal ontologies, controlled vocabularies, structured glossary, symbols
          and terminology or other related resource.
        meaning: edam:topic_0089
      edam:topic_0091:
        title: Bioinformatics
        description: The archival, curation, processing and analysis of complex biological
          data.
        meaning: edam:topic_0091
      edam:topic_0092:
        title: Data visualisation
        description: Rendering (drawing on a computer screen) or visualisation of
          molecular sequences, structures or other biomolecular data.
        meaning: edam:topic_0092
      edam:topic_0097:
        title: Nucleic acid structure analysis
        description: The archival, curation, processing and analysis of nucleic acid
          structural information, such as whole structures, structural features and
          alignments, and associated annotation.
        meaning: edam:topic_0097
      edam:topic_0099:
        title: RNA
        description: RNA sequences and structures.
        meaning: edam:topic_0099
      edam:topic_0102:
        title: Mapping
        description: The mapping of complete (typically nucleotide) sequences. Mapping
          (in the sense of short read alignment, or more generally, just alignment)
          has application in RNA-Seq analysis (mapping of transcriptomics reads),
          variant discovery (e.g. mapping of exome capture), and re-sequencing (mapping
          of WGS reads).
        meaning: edam:topic_0102
      edam:topic_0108:
        title: Protein expression
        description: The translation of mRNA into protein and subsequent protein processing
          in the cell.
        meaning: edam:topic_0108
      edam:topic_0114:
        title: Gene structure
        description: Gene structure, regions which make an RNA product and features
          such as promoters, coding regions, gene fusion, splice sites etc.
        meaning: edam:topic_0114
      edam:topic_0121:
        title: Proteomics
        description: Proteomics is in the narrow sense (sensu stricto) the application
          of methods to separate, characterise, identify, and quantify all proteins
          (the proteome) - or a substantial set of proteins - that are present in
          a sample. Proteomics in the broad sense is the science of proteins and peptides
          on the large scale.
        meaning: edam:topic_0121
      edam:topic_0122:
        title: Structural genomics
        description: The elucidation of the three dimensional structure for all (available)
          proteins in a given organism.
        meaning: edam:topic_0122
      edam:topic_0123:
        title: Protein properties
        description: The study of the physical and biochemical properties of peptides
          and proteins, for example the hydrophobic, hydrophilic and charge properties
          of a protein.
        meaning: edam:topic_0123
      edam:topic_0128:
        title: Protein interactions
        description: Protein-protein, protein-DNA/RNA and protein-ligand interactions,
          including analysis of known interactions and prediction of putative interactions.
        meaning: edam:topic_0128
      edam:topic_0130:
        title: Protein folding, stability and design
        description: Protein stability, folding (in 3D space) and protein sequence-structure-function
          relationships. This includes for example study of inter-atomic or inter-residue
          interactions in protein (3D) structures, the effect of mutation, and the
          design of proteins with specific properties, typically by designing changes
          (via site-directed mutagenesis) to an existing protein.
        meaning: edam:topic_0130
      edam:topic_0140:
        title: Protein targeting and localisation
        description: The study of how proteins are transported within and without
          the cell, including signal peptides, protein subcellular localisation and
          export.
        meaning: edam:topic_0140
      edam:topic_0152:
        title: Carbohydrates
        description: Carbohydrates, typically including structural information.
        meaning: edam:topic_0152
      edam:topic_0153:
        title: Lipidomics
        description: Lipids and their structures.
        meaning: edam:topic_0153
      edam:topic_0154:
        title: Small molecules
        description: Small molecules of biological significance, typically archival,
          curation, processing and analysis of structural information.
        meaning: edam:topic_0154
      edam:topic_0157:
        title: Sequence composition, complexity and repeats
        description: The archival, processing and analysis of the basic character
          composition of molecular sequences, for example character or word frequency,
          ambiguity, complexity, particularly regions of low complexity, and repeats
          or the repetitive nature of molecular sequences.
        meaning: edam:topic_0157
      edam:topic_0160:
        title: Sequence sites, features and motifs
        description: The archival, detection, prediction and analysis of positional
          features such as functional and other key sites, in molecular sequences
          and the conserved patterns (motifs, profiles etc.) that may be used to describe
          them.
        meaning: edam:topic_0160
      edam:topic_0166:
        title: Protein structural motifs and surfaces
        description: Structural features or common 3D motifs within protein structures,
          including the surface of a protein structure, such as biological interfaces
          with other molecules.
        meaning: edam:topic_0166
      edam:topic_0176:
        title: Molecular dynamics
        description: The study and simulation of molecular (typically protein) conformation
          using a computational model of physical forces and computer simulation.
        meaning: edam:topic_0176
      edam:topic_0194:
        title: Phylogenomics
        description: The integrated study of evolutionary relationships and whole
          genome data, for example, in the analysis of species trees, horizontal gene
          transfer and evolutionary reconstruction.
        meaning: edam:topic_0194
      edam:topic_0196:
        title: Sequence assembly
        description: The assembly of fragments of a DNA sequence to reconstruct the
          original sequence.
        meaning: edam:topic_0196
      edam:topic_0199:
        title: Genetic variation
        description: Stable, naturally occurring mutations in a nucleotide sequence
          including alleles, naturally occurring mutations such as single base nucleotide
          substitutions, deletions and insertions, RFLPs and other polymorphisms.
        meaning: edam:topic_0199
      edam:topic_0202:
        title: Pharmacology
        description: The study of drugs and their effects or responses in living systems.
        meaning: edam:topic_0202
      edam:topic_0203:
        title: Gene expression
        description: The analysis of levels and patterns of synthesis of gene products
          (proteins and functional RNA) including interpretation in functional terms
          of gene expression data.
        meaning: edam:topic_0203
      edam:topic_0204:
        title: Gene regulation
        description: The regulation of gene expression.
        meaning: edam:topic_0204
      edam:topic_0208:
        title: Pharmacogenomics
        description: The influence of genotype on drug response, for example by correlating
          gene expression or single-nucleotide polymorphisms with drug efficacy or
          toxicity.
        meaning: edam:topic_0208
      edam:topic_0209:
        title: Medicinal chemistry
        description: The design and chemical synthesis of bioactive molecules, for
          example drugs or potential drug compounds, for medicinal purposes.
        meaning: edam:topic_0209
      edam:topic_0218:
        title: Natural language processing
        description: The processing and analysis of natural language, such as scientific
          literature in English, in order to extract data and information, or to enable
          human-computer interaction.
        meaning: edam:topic_0218
      edam:topic_0219:
        title: Data curation and archival
        description: Data curation and archival includes the preservation of data
          in a repository, archive, or a deposition database; and curation of data
          and metadata, database accessions, annotation, and data provenance.
        meaning: edam:topic_0219
      edam:topic_0593:
        title: NMR
        description: An analytical technique that exploits the magenetic properties
          of certain atomic nuclei to provide information on the structure, dynamics,
          reaction state and chemical environment of molecules.
        meaning: edam:topic_0593
      edam:topic_0601:
        title: Protein modifications
        description: Protein chemical modifications, e.g. post-translational modifications.
        meaning: edam:topic_0601
      edam:topic_0602:
        title: Molecular interactions, pathways and networks
        description: Molecular interactions, biological pathways, networks and other
          models.
        meaning: edam:topic_0602
      edam:topic_0605:
        title: Informatics
        description: The study and practice of information processing and use of computer
          information systems.
        meaning: edam:topic_0605
      edam:topic_0607:
        title: Laboratory information management
        description: Laboratory management and resources, for example, catalogues
          of biological resources for use in the lab including cell lines, viruses,
          plasmids, phages, DNA probes and primers and so on.
        meaning: edam:topic_0607
      edam:topic_0610:
        title: Ecology
        description: The ecological and environmental sciences and especially the
          application of information technology (ecoinformatics).
        meaning: edam:topic_0610
      edam:topic_0611:
        title: Electron microscopy
        description: The study of matter by studying the interference pattern from
          firing electrons at a sample, to analyse structures at resolutions higher
          than can be achieved using light.
        meaning: edam:topic_0611
      edam:topic_0621:
        title: Model organisms
        description: A specific organism, or group of organisms, used to study a particular
          aspect of biology.
        meaning: edam:topic_0621
      edam:topic_0622:
        title: Genomics
        description: Whole genomes of one or more organisms, or genomes in general,
          such as meta-information on genomes, genome projects, gene names etc.
        meaning: edam:topic_0622
      edam:topic_0623:
        title: Gene and protein families
        description: Particular gene(s), gene family or other gene group or system
          and their encoded proteins.Primarily the classification of proteins (from
          sequence or structural data) into clusters, groups, families etc., curation
          of a particular protein or protein family, or any other proteins that have
          been classified as members of a common group.
        meaning: edam:topic_0623
      edam:topic_0625:
        title: Genotype and phenotype
        description: The study of genetic constitution of a living entity, such as
          an individual, and organism, a cell and so on, typically with respect to
          a particular observable phenotypic traits, or resources concerning such
          traits, which might be an aspect of biochemistry, physiology, morphology,
          anatomy, development and so on.
        meaning: edam:topic_0625
      edam:topic_0632:
        title: Probes and primers
        description: Molecular probes (e.g. a peptide probe or DNA microarray probe)
          or PCR primers and hybridisation oligos in a nucleic acid sequence.
        meaning: edam:topic_0632
      edam:topic_0634:
        title: Pathology
        description: Diseases, including diseases in general and the genes, gene variations
          and proteins involved in one or more specific diseases.
        meaning: edam:topic_0634
      edam:topic_0637:
        title: Taxonomy
        description: Organism classification, identification and naming.
        meaning: edam:topic_0637
      edam:topic_0654:
        title: DNA
        description: DNA sequences and structure, including processes such as methylation
          and replication.
        meaning: edam:topic_0654
      edam:topic_0659:
        title: Functional, regulatory and non-coding RNA
        description: Non-coding or functional RNA sequences, including regulatory
          RNA sequences, ribosomal RNA (rRNA) and transfer RNA (tRNA).
        meaning: edam:topic_0659
      edam:topic_0736:
        title: Protein folds and structural domains
        description: Protein tertiary structural domains and folds in a protein or
          polypeptide chain.
        meaning: edam:topic_0736
      edam:topic_0749:
        title: Transcription factors and regulatory sites
        description: Proteins that bind to DNA and control transcription of DNA to
          mRNA (transcription factors) and also transcriptional regulatory sites,
          elements and regions (such as promoters, enhancers, silencers and boundary
          elements / insulators) in nucleotide sequences.
        meaning: edam:topic_0749
      edam:topic_0769:
        title: Workflows
        description: Biological or biomedical analytical workflows or pipelines.
        meaning: edam:topic_0769
      edam:topic_0780:
        title: Plant biology
        description: Plants, e.g. information on a specific plant genome including
          molecular sequences, genes and annotation.
        meaning: edam:topic_0780
      edam:topic_0781:
        title: Virology
        description: Study of viruses, e.g. sequence and structural data, interactions
          of viral proteins, or a viral genome including molecular sequences, genes
          and annotation.
        meaning: edam:topic_0781
      edam:topic_0797:
        title: Comparative genomics
        description: The study (typically comparison) of the sequence, structure or
          function of multiple genomes.
        meaning: edam:topic_0797
      edam:topic_0798:
        title: Mobile genetic elements
        description: Mobile genetic elements, such as transposons, Plasmids, Bacteriophage
          elements and Group II introns.
        meaning: edam:topic_0798
      edam:topic_0804:
        title: Immunology
        description: The application of information technology to immunology such
          as immunological processes, immunological genes, proteins and peptide ligands,
          antigens and so on.
        meaning: edam:topic_0804
      edam:topic_0820:
        title: Membrane and lipoproteins
        description: Lipoproteins (protein-lipid assemblies), and proteins or region
          of a protein that spans or are associated with a membrane.
        meaning: edam:topic_0820
      edam:topic_0821:
        title: Enzymes
        description: Proteins that catalyze chemical reaction, the kinetics of enzyme-catalysed
          reactions, enzyme nomenclature etc.
        meaning: edam:topic_0821
      edam:topic_1317:
        title: Structural biology
        description: The molecular structure of biological molecules, particularly
          macromolecules such as proteins and nucleic acids.
        meaning: edam:topic_1317
      edam:topic_1775:
        title: Function analysis
        description: The study of gene and protein function including the prediction
          of functional properties of a protein.
        meaning: edam:topic_1775
      edam:topic_2229:
        title: Cell biology
        description: Cells, such as key genes and proteins involved in the cell cycle.
        meaning: edam:topic_2229
      edam:topic_2258:
        title: Cheminformatics
        description: The application of information technology to chemistry in biological
          research environment.
        meaning: edam:topic_2258
      edam:topic_2259:
        title: Systems biology
        description: The holistic modelling and analysis of complex biological systems
          and the interactions therein.
        meaning: edam:topic_2259
      edam:topic_2269:
        title: Statistics and probability
        description: The application of statistical methods to biological problems.
        meaning: edam:topic_2269
      edam:topic_2275:
        title: Molecular modelling
        description: The construction, analysis, evaluation, refinement etc. of models
          of a molecules properties or behaviour, including the modelling the structure
          of proteins in complex with small molecules or other macromolecules (docking).
        meaning: edam:topic_2275
      edam:topic_2533:
        title: DNA mutation
        description: DNA mutation.
        meaning: edam:topic_2533
      edam:topic_2640:
        title: Oncology
        description: The study of cancer, for example, genes and proteins implicated
          in cancer.
        meaning: edam:topic_2640
      edam:topic_2814:
        title: Protein structure analysis
        description: Protein secondary or tertiary structural data and/or associated
          annotation.
        meaning: edam:topic_2814
      edam:topic_2815:
        title: Human biology
        description: The study of human beings in general, including the human genome
          and proteome.
        meaning: edam:topic_2815
      edam:topic_2828:
        title: X-ray diffraction
        description: The study of matter and their structure by means of the diffraction
          of X-rays, typically the diffraction pattern caused by the regularly spaced
          atoms of a crystalline sample.
        meaning: edam:topic_2828
      edam:topic_2830:
        title: Immunoproteins and antigens
        description: Immunity-related proteins and their ligands.
        meaning: edam:topic_2830
      edam:topic_2840:
        title: Toxicology
        description: Toxins and the adverse effects of these chemical substances on
          living organisms.
        meaning: edam:topic_2840
      edam:topic_2885:
        title: DNA polymorphism
        description: DNA polymorphism.
        meaning: edam:topic_2885
      edam:topic_3047:
        title: Molecular biology
        description: The molecular basis of biological activity, particularly the
          macromolecules (e.g. proteins and nucleic acids) that are essential to life.
        meaning: edam:topic_3047
      edam:topic_3050:
        title: Biodiversity
        description: The degree of variation of life forms within a given ecosystem,
          biome or an entire planet.
        meaning: edam:topic_3050
      edam:topic_3053:
        title: Genetics
        description: The study of genes, genetic variation and heredity in living
          organisms.
        meaning: edam:topic_3053
      edam:topic_3055:
        title: Quantitative genetics
        description: The genes and genetic mechanisms such as Mendelian inheritance
          that underly continuous phenotypic traits (such as height or weight).
        meaning: edam:topic_3055
      edam:topic_3056:
        title: Population genetics
        description: The distribution of allele frequencies in a population of organisms
          and its change subject to evolutionary processes including natural selection,
          genetic drift, mutation and gene flow.
        meaning: edam:topic_3056
      edam:topic_3063:
        title: Medical informatics
        description: The application of information technology to health, disease
          and biomedicine.
        meaning: edam:topic_3063
      edam:topic_3064:
        title: Developmental biology
        description: How organisms grow and develop.
        meaning: edam:topic_3064
      edam:topic_3065:
        title: Embryology
        description: The development of organisms between the one-cell stage (typically
          the zygote) and the end of the embryonic stage.
        meaning: edam:topic_3065
      edam:topic_3067:
        title: Anatomy
        description: The form and function of the structures of living organisms.
        meaning: edam:topic_3067
      edam:topic_3068:
        title: Literature and language
        description: The scientific literature, language processing, reference information,
          and documentation.
        meaning: edam:topic_3068
      edam:topic_3070:
        title: Biology
        description: The study of life and living organisms, including their morphology,
          biochemistry, physiology, development, evolution, and so on.
        meaning: edam:topic_3070
      edam:topic_3071:
        title: Data management
        description: Data management comprises the practices and principles of taking
          care of data, other than analysing them. This includes for example taking
          care of the associated metadata, data formats, storage, preservation/archiving,
          access, and legal aspects related to using and sharing data.
        meaning: edam:topic_3071
      edam:topic_3077:
        title: Data acquisition
        description: The acquisition of data, typically measurements of physical systems
          using any type of sampling system, or by another other means.
        meaning: edam:topic_3077
      edam:topic_3120:
        title: Protein variants
        description: Protein sequence variants produced e.g. from alternative splicing,
          alternative promoter usage, alternative initiation and ribosomal frameshifting.
        meaning: edam:topic_3120
      edam:topic_3125:
        title: DNA binding sites
        description: Nucleic acids binding to some other molecule.
        meaning: edam:topic_3125
      edam:topic_3127:
        title: DNA replication and recombination
        description: DNA replication or recombination.
        meaning: edam:topic_3127
      edam:topic_3168:
        title: Sequencing
        description: The determination of complete (typically nucleotide) sequences,
          including those of genomes (full genome sequencing, de novo sequencing and
          resequencing), amplicons and transcriptomes.
        meaning: edam:topic_3168
      edam:topic_3169:
        title: ChIP-seq
        description: The analysis of protein-DNA interactions where chromatin immunoprecipitation
          (ChIP) is used in combination with massively parallel DNA sequencing to
          identify the binding sites of DNA-associated proteins.
        meaning: edam:topic_3169
      edam:topic_3170:
        title: RNA-Seq
        description: A topic concerning high-throughput sequencing of cDNA to measure
          the RNA content (transcriptome) of a sample, for example, to investigate
          how different alleles of a gene are expressed, detect post-transcriptional
          mutations or identify gene fusions.
        meaning: edam:topic_3170
      edam:topic_3172:
        title: Metabolomics
        description: The systematic study of metabolites, the chemical processes they
          are involved, and the chemical fingerprints of specific cellular processes
          in a whole cell, tissue, organ or organism.
        meaning: edam:topic_3172
      edam:topic_3173:
        title: Epigenomics
        description: The study of the epigenetic modifications of a whole cell, tissue,
          organism etc.
        meaning: edam:topic_3173
      edam:topic_3174:
        title: Metagenomics
        description: The study of genetic material recovered from environmental samples,
          and associated environmental data.
        meaning: edam:topic_3174
      edam:topic_3175:
        title: Structural variation
        description: Variation in chromosome structure including microscopic and submicroscopic
          types of variation such as deletions, duplications, copy-number variants,
          insertions, inversions and translocations.
        meaning: edam:topic_3175
      edam:topic_3176:
        title: DNA packaging
        description: DNA-histone complexes (chromatin), organisation of chromatin
          into nucleosomes and packaging into higher-order structures.
        meaning: edam:topic_3176
      edam:topic_3179:
        title: ChIP-on-chip
        description: Experimental techniques that combine chromatin immunoprecipitation
          ('ChIP') with microarray ('chip'). ChIP-on-chip is used for high-throughput
          study protein-DNA interactions.
        meaning: edam:topic_3179
      edam:topic_3277:
        title: Sample collections
        description: Biological samples and specimens.
        meaning: edam:topic_3277
      edam:topic_3292:
        title: Biochemistry
        description: Chemical substances and physico-chemical processes and that occur
          within living organisms.
        meaning: edam:topic_3292
      edam:topic_3293:
        title: Phylogenetics
        description: The study of evolutionary relationships amongst organisms from
          analysis of genetic information (typically gene or protein sequences).
        meaning: edam:topic_3293
      edam:topic_3295:
        title: Epigenetics
        description: Topic concerning the study of heritable changes, for example
          in gene expression or phenotype, caused by mechanisms other than changes
          in the DNA sequence.
        meaning: edam:topic_3295
      edam:topic_3297:
        title: Biotechnology
        description: The exploitation of biological process, structure and function
          for industrial purposes, for example the genetic manipulation of microorganisms
          for the antibody production.
        meaning: edam:topic_3297
      edam:topic_3298:
        title: Phenomics
        description: Phenomes, or the study of the change in phenotype (the physical
          and biochemical traits of organisms) in response to genetic and environmental
          factors.
        meaning: edam:topic_3298
      edam:topic_3299:
        title: Evolutionary biology
        description: The evolutionary processes, from the genetic to environmental
          scale, that produced life in all its diversity.
        meaning: edam:topic_3299
      edam:topic_3300:
        title: Physiology
        description: The functions of living organisms and their constituent parts.
        meaning: edam:topic_3300
      edam:topic_3301:
        title: Microbiology
        description: The biology of microorganisms.
        meaning: edam:topic_3301
      edam:topic_3302:
        title: Parasitology
        description: The biology of parasites.
        meaning: edam:topic_3302
      edam:topic_3303:
        title: Medicine
        description: Research in support of healing by diagnosis, treatment, and prevention
          of disease.
        meaning: edam:topic_3303
      edam:topic_3304:
        title: Neurobiology
        description: The study of the nervous system and brain; its anatomy, physiology
          and function.
        meaning: edam:topic_3304
      edam:topic_3305:
        title: Public health and epidemiology
        description: Topic concerning the the patterns, cause, and effect of disease
          within populations.
        meaning: edam:topic_3305
      edam:topic_3306:
        title: Biophysics
        description: The use of physics to study biological system.
        meaning: edam:topic_3306
      edam:topic_3307:
        title: Computational biology
        description: The development and application of theory, analytical methods,
          mathematical models and computational simulation of biological systems.
        meaning: edam:topic_3307
      edam:topic_3308:
        title: Transcriptomics
        description: The analysis of transcriptomes, or a set of all the RNA molecules
          in a specific cell, tissue etc.
        meaning: edam:topic_3308
      edam:topic_3314:
        title: Chemistry
        description: The composition and properties of matter, reactions, and the
          use of reactions to create new substances.
        meaning: edam:topic_3314
      edam:topic_3315:
        title: Mathematics
        description: The study of numbers (quantity) and other topics including structure,
          space, and change.
        meaning: edam:topic_3315
      edam:topic_3316:
        title: Computer science
        description: The theory and practical use of computer systems.
        meaning: edam:topic_3316
      edam:topic_3318:
        title: Physics
        description: The study of matter, space and time, and related concepts such
          as energy and force.
        meaning: edam:topic_3318
      edam:topic_3320:
        title: RNA splicing
        description: RNA splicing; post-transcription RNA modification involving the
          removal of introns and joining of exons.
        meaning: edam:topic_3320
      edam:topic_3321:
        title: Molecular genetics
        description: The structure and function of genes at a molecular level.
        meaning: edam:topic_3321
      edam:topic_3322:
        title: Respiratory medicine
        description: The study of respiratory system.
        meaning: edam:topic_3322
      edam:topic_3324:
        title: Infectious disease
        description: The branch of medicine that deals with the prevention, diagnosis
          and management of transmissible disease with clinically evident illness
          resulting from infection with pathogenic biological agents (viruses, bacteria,
          fungi, protozoa, parasites and prions).
        meaning: edam:topic_3324
      edam:topic_3325:
        title: Rare diseases
        description: The study of rare diseases.
        meaning: edam:topic_3325
      edam:topic_3332:
        title: Computational chemistry
        description: Topic concerning the development and application of theory, analytical
          methods, mathematical models and computational simulation of chemical systems.
        meaning: edam:topic_3332
      edam:topic_3334:
        title: Neurology
        description: The branch of medicine that deals with the anatomy, functions
          and disorders of the nervous system.
        meaning: edam:topic_3334
      edam:topic_3335:
        title: Cardiology
        description: The diseases and abnormalities of the heart and circulatory system.
        meaning: edam:topic_3335
      edam:topic_3336:
        title: Drug discovery
        description: The discovery and design of drugs or potential drug compounds.
        meaning: edam:topic_3336
      edam:topic_3337:
        title: Biobank
        description: Repositories of biological samples, typically human, for basic
          biological and clinical research.
        meaning: edam:topic_3337
      edam:topic_3338:
        title: Mouse clinic
        description: Laboratory study of mice, for example, phenotyping, and mutagenesis
          of mouse cell lines.
        meaning: edam:topic_3338
      edam:topic_3339:
        title: Microbial collection
        description: Collections of microbial cells including bacteria, yeasts and
          moulds.
        meaning: edam:topic_3339
      edam:topic_3340:
        title: Cell culture collection
        description: Collections of cells grown under laboratory conditions, specifically,
          cells from multi-cellular eukaryotes and especially animal cells.
        meaning: edam:topic_3340
      edam:topic_3341:
        title: Clone library
        description: Collections of DNA, including both collections of cloned molecules,
          and populations of micro-organisms that store and propagate cloned DNA.
        meaning: edam:topic_3341
      edam:topic_3342:
        title: Translational medicine
        description: '''translating'' the output of basic and biomedical research
          into better diagnostic tools, medicines, medical procedures, policies and
          advice.'
        meaning: edam:topic_3342
      edam:topic_3343:
        title: Compound libraries and screening
        description: Collections of chemicals, typically for use in high-throughput
          screening experiments.
        meaning: edam:topic_3343
      edam:topic_3344:
        title: Biomedical science
        description: Topic concerning biological science that is (typically) performed
          in the context of medicine.
        meaning: edam:topic_3344
      edam:topic_3345:
        title: Data identity and mapping
        description: Topic concerning the identity of biological entities, or reports
          on such entities, and the mapping of entities and records in different databases.
        meaning: edam:topic_3345
      edam:topic_3360:
        title: Biomarkers
        description: Objective indicators of biological state often used to assess
          health, and determinate treatment.
        meaning: edam:topic_3360
      edam:topic_3365:
        title: Data architecture, analysis and design
        description: The development of policies, models and standards that cover
          data acquisition, storage and integration, such that it can be put to use,
          typically through a process of systematically applying statistical and /
          or logical techniques to describe, illustrate, summarise or evaluate data.
        meaning: edam:topic_3365
      edam:topic_3366:
        title: Data integration and warehousing
        description: The combination and integration of data from different sources,
          for example into a central repository or warehouse, to provide users with
          a unified view of these data.
        meaning: edam:topic_3366
      edam:topic_3368:
        title: Biomaterials
        description: Any matter, surface or construct that interacts with a biological
          system.
        meaning: edam:topic_3368
      edam:topic_3369:
        title: Chemical biology
        description: The use of synthetic chemistry to study and manipulate biological
          systems.
        meaning: edam:topic_3369
      edam:topic_3370:
        title: Analytical chemistry
        description: The study of the separation, identification, and quantification
          of the chemical components of natural and artificial materials.
        meaning: edam:topic_3370
      edam:topic_3371:
        title: Synthetic chemistry
        description: The use of chemistry to create new compounds.
        meaning: edam:topic_3371
      edam:topic_3372:
        title: Software engineering
        description: The process that leads from an original formulation of a computing
          problem to executable programs.
        meaning: edam:topic_3372
      edam:topic_3373:
        title: Drug development
        description: The process of bringing a new drug to market once a lead compounds
          has been identified through drug discovery.
        meaning: edam:topic_3373
      edam:topic_3374:
        title: Biotherapeutics
        description: The process of formulating and administering a pharmaceutical
          compound to achieve a therapeutic effect.
        meaning: edam:topic_3374
      edam:topic_3375:
        title: Drug metabolism
        description: The study of how a drug interacts with the body.
        meaning: edam:topic_3375
      edam:topic_3376:
        title: Medicines research and development
        description: The discovery, development and approval of medicines.
        meaning: edam:topic_3376
      edam:topic_3377:
        title: Safety sciences
        description: The safety (or lack) of drugs and other medical interventions.
        meaning: edam:topic_3377
      edam:topic_3378:
        title: Pharmacovigilance
        description: The detection, assessment, understanding and prevention of adverse
          effects of medicines.
        meaning: edam:topic_3378
      edam:topic_3379:
        title: Preclinical and clinical studies
        description: The testing of new medicines, vaccines or procedures on animals
          (preclinical) and humans (clinical) prior to their approval by regulatory
          authorities.
        meaning: edam:topic_3379
      edam:topic_3382:
        title: Imaging
        description: The visual representation of an object.
        meaning: edam:topic_3382
      edam:topic_3383:
        title: Bioimaging
        description: The use of imaging techniques to understand biology.
        meaning: edam:topic_3383
      edam:topic_3384:
        title: Medical imaging
        description: The use of imaging techniques for clinical purposes for medical
          research.
        meaning: edam:topic_3384
      edam:topic_3385:
        title: Light microscopy
        description: The use of optical instruments to magnify the image of an object.
        meaning: edam:topic_3385
      edam:topic_3386:
        title: Laboratory animal science
        description: The use of animals and alternatives in experimental research.
        meaning: edam:topic_3386
      edam:topic_3387:
        title: Marine biology
        description: The study of organisms in the ocean or brackish waters.
        meaning: edam:topic_3387
      edam:topic_3388:
        title: Molecular medicine
        description: The identification of molecular and genetic causes of disease
          and the development of interventions to correct them.
        meaning: edam:topic_3388
      edam:topic_3390:
        title: Nutritional science
        description: The study of the effects of food components on the metabolism,
          health, performance and disease resistance of humans and animals. It also
          includes the study of human behaviours related to food choices.
        meaning: edam:topic_3390
      edam:topic_3391:
        title: Omics
        description: The collective characterisation and quantification of pools of
          biological molecules that translate into the structure, function, and dynamics
          of an organism or organisms.
        meaning: edam:topic_3391
      edam:topic_3393:
        title: Quality affairs
        description: The processes that need to be in place to ensure the quality
          of products for human or animal use.
        meaning: edam:topic_3393
      edam:topic_3394:
        title: Regulatory affairs
        description: The protection of public health by controlling the safety and
          efficacy of products in areas including pharmaceuticals, veterinary medicine,
          medical devices, pesticides, agrochemicals, cosmetics, and complementary
          medicines.
        meaning: edam:topic_3394
      edam:topic_3395:
        title: Regenerative medicine
        description: Biomedical approaches to clinical interventions that involve
          the use of stem cells.
        meaning: edam:topic_3395
      edam:topic_3396:
        title: Systems medicine
        description: An interdisciplinary field of study that looks at the dynamic
          systems of the human body as part of an integrted whole, incorporating biochemical,
          physiological, and environmental interactions that sustain life.
        meaning: edam:topic_3396
      edam:topic_3397:
        title: Veterinary medicine
        description: Topic concerning the branch of medicine that deals with the prevention,
          diagnosis, and treatment of disease, disorder and injury in animals.
        meaning: edam:topic_3397
      edam:topic_3398:
        title: Bioengineering
        description: The application of biological concepts and methods to the analytical
          and synthetic methodologies of engineering.
        meaning: edam:topic_3398
      edam:topic_3399:
        title: Geriatric medicine
        description: The branch of medicine dealing with the diagnosis, treatment
          and prevention of disease in older people, and the problems specific to
          aging.
        meaning: edam:topic_3399
      edam:topic_3400:
        title: Allergy, clinical immunology and immunotherapeutics
        description: Health issues related to the immune system and their prevention,
          diagnosis and management.
        meaning: edam:topic_3400
      edam:topic_3401:
        title: Pain medicine
        description: The prevention of pain and the evaluation, treatment and rehabilitation
          of persons in pain.
        meaning: edam:topic_3401
      edam:topic_3402:
        title: Anaesthesiology
        description: Anaesthesia and anaesthetics.
        meaning: edam:topic_3402
      edam:topic_3403:
        title: Critical care medicine
        description: The multidisciplinary that cares for patients with acute, life-threatening
          illness or injury.
        meaning: edam:topic_3403
      edam:topic_3404:
        title: Dermatology
        description: The branch of medicine that deals with prevention, diagnosis
          and treatment of disorders of the skin, scalp, hair and nails.
        meaning: edam:topic_3404
      edam:topic_3405:
        title: Dentistry
        description: The study, diagnosis, prevention and treatments of disorders
          of the oral cavity, maxillofacial area and adjacent structures.
        meaning: edam:topic_3405
      edam:topic_3406:
        title: Ear, nose and throat medicine
        description: The branch of medicine that deals with the prevention, diagnosis,
          and treatment of disorders of the ear, nose and throat.
        meaning: edam:topic_3406
      edam:topic_3407:
        title: Endocrinology and metabolism
        description: The branch of medicine dealing with diseases of endocrine organs,
          hormone systems, their target organs, and disorders of the pathways of glucose
          and lipid metabolism.
        meaning: edam:topic_3407
      edam:topic_3408:
        title: Haematology
        description: The branch of medicine that deals with the blood, blood-forming
          organs and blood diseases.
        meaning: edam:topic_3408
      edam:topic_3409:
        title: Gastroenterology
        description: The branch of medicine that deals with disorders of the oesophagus,
          stomach, duodenum, jejenum, ileum, large intestine, sigmoid colon and rectum.
        meaning: edam:topic_3409
      edam:topic_3410:
        title: Gender medicine
        description: The study of the biological and physiological differences between
          males and females and how they effect differences in disease presentation
          and management.
        meaning: edam:topic_3410
      edam:topic_3411:
        title: Gynaecology and obstetrics
        description: The branch of medicine that deals with the health of the female
          reproductive system, pregnancy and birth.
        meaning: edam:topic_3411
      edam:topic_3412:
        title: Hepatic and biliary medicine
        description: The branch of medicine that deals with the liver, gallbladder,
          bile ducts and bile.
        meaning: edam:topic_3412
      edam:topic_3414:
        title: Trauma medicine
        description: The branch of medicine that treats body wounds or shock produced
          by sudden physical injury, as from violence or accident.
        meaning: edam:topic_3414
      edam:topic_3415:
        title: Medical toxicology
        description: The branch of medicine that deals with the diagnosis, management
          and prevention of poisoning and other adverse health effects caused by medications,
          occupational and environmental toxins, and biological agents.
        meaning: edam:topic_3415
      edam:topic_3416:
        title: Musculoskeletal medicine
        description: The branch of medicine that deals with the prevention, diagnosis,
          and treatment of disorders of the muscle, bone and connective tissue. It
          incorporates aspects of orthopaedics, rheumatology, rehabilitation medicine
          and pain medicine.
        meaning: edam:topic_3416
      edam:topic_3417:
        title: Ophthalmology
        description: The branch of medicine that deals with disorders of the eye,
          including eyelid, optic nerve/visual pathways and occular muscles.
        meaning: edam:topic_3417
      edam:topic_3418:
        title: Paediatrics
        description: The branch of medicine that deals with the medical care of infants,
          children and adolescents.
        meaning: edam:topic_3418
      edam:topic_3419:
        title: Psychiatry
        description: The branch of medicine that deals with the management of mental
          illness, emotional disturbance and abnormal behaviour.
        meaning: edam:topic_3419
      edam:topic_3420:
        title: Reproductive health
        description: The health of the reproductive processes, functions and systems
          at all stages of life.
        meaning: edam:topic_3420
      edam:topic_3421:
        title: Surgery
        description: The use of operative, manual and instrumental techniques on a
          patient to investigate and/or treat a pathological condition or help improve
          bodily function or appearance.
        meaning: edam:topic_3421
      edam:topic_3422:
        title: Urology and nephrology
        description: The branches of medicine and physiology focussing on the function
          and disorders of the urinary system in males and females, the reproductive
          system in males, and the kidney.
        meaning: edam:topic_3422
      edam:topic_3423:
        title: Complementary medicine
        description: Medical therapies that fall beyond the scope of conventional
          medicine but may be used alongside it in the treatment of disease and ill
          health.
        meaning: edam:topic_3423
      edam:topic_3444:
        title: MRI
        description: Techniques that uses magnetic fields and radiowaves to form images,
          typically to investigate the anatomy and physiology of the human body.
        meaning: edam:topic_3444
      edam:topic_3448:
        title: Neutron diffraction
        description: The study of matter by studying the diffraction pattern from
          firing neutrons at a sample, typically to determine atomic and/or magnetic
          structure.
        meaning: edam:topic_3448
      edam:topic_3452:
        title: Tomography
        description: Imaging in sections (sectioning), through the use of a wave-generating
          device (tomograph) that generates an image (a tomogram).
        meaning: edam:topic_3452
      edam:topic_3473:
        title: Data mining
        description: The discovery of patterns in large data sets and the extraction
          and trasnsformation of those patterns into a useful format.
        meaning: edam:topic_3473
      edam:topic_3474:
        title: Machine learning
        description: A topic concerning the application of artificial intelligence
          methods to algorithms, in order to create methods that can learn from data
          in order to generate an output, rather than relying on explicitly encoded
          information only.
        meaning: edam:topic_3474
      edam:topic_3489:
        title: Database management
        description: The general handling of data stored in digital archives such
          as databases, databanks, web portals, and other data resources.
        meaning: edam:topic_3489
      edam:topic_3500:
        title: Zoology
        description: Animals, e.g. information on a specific animal genome including
          molecular sequences, genes and annotation.
        meaning: edam:topic_3500
      edam:topic_3510:
        title: Protein sites, features and motifs
        description: The biology, archival, detection, prediction and analysis of
          positional features such as functional and other key sites, in protein sequences
          and the conserved patterns (motifs, profiles etc.) that may be used to describe
          them.
        meaning: edam:topic_3510
      edam:topic_3511:
        title: Nucleic acid sites, features and motifs
        description: The biology, archival, detection, prediction and analysis of
          positional features such as functional and other key sites, in nucleic acid
          sequences and the conserved patterns (motifs, profiles etc.) that may be
          used to describe them.
        meaning: edam:topic_3511
      edam:topic_3512:
        title: Gene transcripts
        description: Transcription of DNA into RNA and features of a messenger RNA
          (mRNA) molecules including precursor RNA, primary (unprocessed) transcript
          and fully processed molecules.
        meaning: edam:topic_3512
      edam:topic_3516:
        title: Genotyping experiment
        description: Genotype experiment including case control, population, and family
          studies. These might use array based methods and re-sequencing methods.
        meaning: edam:topic_3516
      edam:topic_3517:
        title: GWAS study
        description: Genome-wide association study experiments.
        meaning: edam:topic_3517
      edam:topic_3518:
        title: Microarray experiment
        description: Microarray experiments including conditions, protocol, sample:data
          relationships etc.
        meaning: edam:topic_3518
      edam:topic_3519:
        title: PCR experiment
        description: PCR experiments, e.g. quantitative real-time PCR.
        meaning: edam:topic_3519
      edam:topic_3520:
        title: Proteomics experiment
        description: Proteomics experiments.
        meaning: edam:topic_3520
      edam:topic_3523:
        title: RNAi experiment
        description: Experiment in which the expression of a specific gene is post-transcriptionally
          knocked down or silenced by means of a small RNA (sRNA) causing the degradation
          of the gene transcript (mRNA), and thus preventing the production of the
          corresponding protein.
        meaning: edam:topic_3523
      edam:topic_3524:
        title: Simulation experiment
        description: Biological computational model experiments (simulation), for
          example the minimum information required in order to permit its correct
          interpretation and reproduction.
        meaning: edam:topic_3524
      edam:topic_3534:
        title: Protein binding sites
        description: Binding sites in proteins, including cleavage sites (for a proteolytic
          enzyme or agent), key residues involved in protein folding, catalytic residues
          (active site) of an enzyme, ligand-binding (non-catalytic) residues of a
          protein, such as sites that bind metal, prosthetic groups or lipids, RNA
          and DNA-binding proteins and binding sites etc.
        meaning: edam:topic_3534
      edam:topic_3538:
        title: Protein disordered structure
        description: Disordered structure in a protein.
        meaning: edam:topic_3538
      edam:topic_3542:
        title: Protein secondary structure
        description: Secondary structure (predicted or real) of a protein, including
          super-secondary structure.
        meaning: edam:topic_3542
      edam:topic_3569:
        title: Applied mathematics
        description: The application of mathematics to specific problems in science,
          typically by the formulation and analysis of mathematical models.
        meaning: edam:topic_3569
      edam:topic_3570:
        title: Pure mathematics
        description: The study of abstract mathematical concepts.
        meaning: edam:topic_3570
      edam:topic_3571:
        title: Data governance
        description: Data governance is the control of data entry and maintenance
          to ensure the data meets defined standards, qualities, or constraints.
        meaning: edam:topic_3571
      edam:topic_3572:
        title: Data quality management
        description: The quality, integrity, and cleaning up of data.
        meaning: edam:topic_3572
      edam:topic_3573:
        title: Freshwater biology
        description: The study of organisms in freshwater ecosystems.
        meaning: edam:topic_3573
      edam:topic_3574:
        title: Human genetics
        description: The study of inheritance in human beings.
        meaning: edam:topic_3574
      edam:topic_3575:
        title: Tropical medicine
        description: Health problems that are prevalent in tropical and subtropical
          regions.
        meaning: edam:topic_3575
      edam:topic_3576:
        title: Medical biotechnology
        description: Biotechnology applied to the medical sciences and the development
          of medicines.
        meaning: edam:topic_3576
      edam:topic_3577:
        title: Personalised medicine
        description: An approach to medicine whereby decisions, practices and are
          tailored to the individual patient based on their predicted response or
          risk of disease.
        meaning: edam:topic_3577
      edam:topic_3656:
        title: Immunoprecipitation experiment
        description: Experimental techniques to purify a protein-DNA crosslinked complex.
          Usually sequencing follows e.g. in the techniques ChIP-chip, ChIP-seq and
          MeDIP-seq.
        meaning: edam:topic_3656
      edam:topic_3673:
        title: Whole genome sequencing
        description: Laboratory technique to sequence the complete DNA sequence of
          an organism's genome at a single time.
        meaning: edam:topic_3673
      edam:topic_3674:
        title: Methylated DNA immunoprecipitation
        description: Laboratory technique to sequence the methylated regions in DNA.
        meaning: edam:topic_3674
      edam:topic_3676:
        title: Exome sequencing
        description: Laboratory technique to sequence all the protein-coding regions
          in a genome, i.e., the exome.
        meaning: edam:topic_3676
      edam:topic_3678:
        title: Experimental design and studies
        description: The design of an experiment intended to test a hypothesis, and
          describe or explain empirical data obtained under various experimental conditions.
        meaning: edam:topic_3678
      edam:topic_3679:
        title: Animal study
        description: The design of an experiment involving non-human animals.
        meaning: edam:topic_3679
      edam:topic_3697:
        title: Microbial ecology
        description: The ecology of microorganisms including their relationship with
          one another and their environment.
        meaning: edam:topic_3697
      edam:topic_3794:
        title: RNA immunoprecipitation
        description: An antibody-based technique used to map in vivo RNA-protein interactions.
        meaning: edam:topic_3794
      edam:topic_3796:
        title: Population genomics
        description: Large-scale study (typically comparison) of DNA sequences of
          populations.
        meaning: edam:topic_3796
      edam:topic_3810:
        title: Agricultural science
        description: Multidisciplinary study, research and development within the
          field of agriculture.
        meaning: edam:topic_3810
      edam:topic_3837:
        title: Metagenomic sequencing
        description: Approach which samples, in parallel, all genes in all organisms
          present in a given sample, e.g. to provide insight into biodiversity and
          function.
        meaning: edam:topic_3837
      edam:topic_3855:
        title: Environmental sciences
        description: Study of the environment, the interactions between its physical,
          chemical, and biological components and it's effect on life. Also how humans
          impact upon the environment, and how we can manage and utilise natural resources.
        meaning: edam:topic_3855
      edam:topic_3892:
        title: Biomolecular simulation
        description: The study and simulation of molecular conformations using a computational
          model and computer simulations.
        meaning: edam:topic_3892
      edam:topic_3895:
        title: Synthetic biology
        description: The application of multi-disciplinary science and technology
          for the construction of artificial biological systems for diverse applications.
        meaning: edam:topic_3895
      edam:topic_3912:
        title: Genetic engineering
        description: The application of biotechnology to directly manipulate an organism's
          genes.
        meaning: edam:topic_3912
      edam:topic_3922:
        title: Proteogenomics
        description: A field of biological research focused on the discovery and identification
          of peptides, typically by comparing mass spectra against a protein database.
        meaning: edam:topic_3922
      edam:topic_3923:
        title: Genome resequencing
        description: Laboratory experiment to identify the differences between a specific
          genome (of an individual) and a reference genome (developed typically from
          many thousands of individuals). WGS re-sequencing is used as golden standard
          to detect variations compared to a given reference genome, including small
          variants (SNP and InDels) as well as larger genome re-organisations (CNVs,
          translocations, etc.).
        meaning: edam:topic_3923
      edam:topic_3930:
        title: Immunogenetics
        description: A biomedical field that bridges immunology and genetics, to study
          the genetic basis of the immune system.
        meaning: edam:topic_3930
      edam:topic_3931:
        title: Chemometrics
        description: Interdisciplinary science focused on extracting information from
          chemical systems by data analytical approaches, for example multivariate
          statistics, applied mathematics, and computer science.
        meaning: edam:topic_3931
      edam:topic_3934:
        title: Cytometry
        description: Cytometry is the measurement of the characteristics of cells.
        meaning: edam:topic_3934
      edam:topic_3939:
        title: Metabolic engineering
        description: Biotechnology approach that seeks to optimize cellular genetic
          and regulatory processes in order to increase the cells' production of a
          certain substance.
        meaning: edam:topic_3939
      edam:topic_3940:
        title: Chromosome conformation capture
        description: Molecular biology methods used to analyze the spatial organization
          of chromatin in a cell.
        meaning: edam:topic_3940
      edam:topic_3941:
        title: Metatranscriptomics
        description: The study of microbe gene expression within natural environments
          (i.e. the metatranscriptome).
        meaning: edam:topic_3941
      edam:topic_3943:
        title: Paleogenomics
        description: The reconstruction and analysis of genomic information in extinct
          species.
        meaning: edam:topic_3943
      edam:topic_3944:
        title: Cladistics
        description: The biological classification of organisms by categorizing them
          in groups ("clades") based on their most recent common ancestor.
        meaning: edam:topic_3944
      edam:topic_3945:
        title: Molecular evolution
        description: The study of the process and mechanism of change of biomolecules
          such as DNA, RNA, and proteins across generations.
        meaning: edam:topic_3945
      edam:topic_3948:
        title: Immunoinformatics
        description: Immunoinformatics is the field of computational biology that
          deals with the study of immunoloogical questions. Immunoinformatics is at
          the interface between immunology and computer science. It takes advantage
          of computational, statistical, mathematical approaches and enhances the
          understanding of immunological knowledge.
        meaning: edam:topic_3948
      edam:topic_3954:
        title: Echography
        description: A diagnostic imaging technique based on the application of ultrasound.
        meaning: edam:topic_3954
      edam:topic_3955:
        title: Fluxomics
        description: Experimental approaches to determine the rates of metabolic reactions
          - the metabolic fluxes - within a biological entity.
        meaning: edam:topic_3955
      edam:topic_3957:
        title: Protein interaction experiment
        description: An experiment for studying protein-protein interactions.
        meaning: edam:topic_3957
      edam:topic_3958:
        title: Copy number variation
        description: A DNA structural variation, specifically a duplication or deletion
          event, resulting in sections of the genome to be repeated, or the number
          of repeats in the genome to vary between individuals.
        meaning: edam:topic_3958
      edam:topic_3959:
        title: Cytogenetics
        description: The branch of genetics concerned with the relationships between
          chromosomes and cellular behaviour, especially during mitosis and meiosis.
        meaning: edam:topic_3959
      edam:topic_3966:
        title: Vaccinology
        description: The design of vaccines to protect against a particular pathogen,
          including antigens, delivery systems, and adjuvants to elicit a predictable
          immune response against specific epitopes.
        meaning: edam:topic_3966
      edam:topic_3967:
        title: Immunomics
        description: The study of immune system as a whole, its regulation and response
          to pathogens using genome-wide approaches.
        meaning: edam:topic_3967
      edam:topic_3974:
        title: Epistasis
        description: 'Epistasis can be defined as the ability of the genotype at one
          locus to supersede the phenotypic effect of a mutation at another locus.
          This interaction between genes can occur at different level: gene expression,
          protein levels, etc...'
        meaning: edam:topic_3974
      edam:topic_4010:
        title: Open science
        description: Open science encompasses the practices of making scientific research
          transparent and participatory, and its outputs publicly accessible.
        meaning: edam:topic_4010
      edam:topic_4011:
        title: Data rescue
        description: Data rescue denotes digitalisation, formatting, archival, and
          publication of data that were not available in accessible or usable form.
          Examples are data from private archives, data inside publications, or in
          paper records stored privately or publicly.
        meaning: edam:topic_4011
      edam:topic_4012:
        title: FAIR data
        description: FAIR data is scientific data that meets the principles of being
          findable, accessible, interoperable, and reusable.
        meaning: edam:topic_4012
      edam:topic_4013:
        title: Antimicrobial resistance
        description: Microbial mechanisms for protecting microorganisms against antimicrobial
          agents.
        meaning: edam:topic_4013
      edam:topic_4014:
        title: Electroencephalography
        description: The monitoring method for measuring electrical activity in the
          brain.
        meaning: edam:topic_4014
      edam:topic_4016:
        title: Electrocardiography
        description: The monitoring method for measuring electrical activity in the
          heart.
        meaning: edam:topic_4016
      edam:topic_4017:
        title: Cryogenic electron microscopy
        description: A method for studying biomolecules and other structures at very
          low (cryogenic) temperature using electron microscopy.
        meaning: edam:topic_4017
      edam:topic_4019:
        title: Biosciences
        description: Biosciences, or life sciences, include fields of study related
          to life, living beings, and biomolecules.
        meaning: edam:topic_4019
      edam:topic_4020:
        title: Carbon cycle
        description: The carbon cycle is the biogeochemical pathway of carbon moving
          through the different parts of the Earth (such as ocean, atmosphere, soil),
          or eventually another planet.
        meaning: edam:topic_4020
      edam:topic_4021:
        title: Multiomics
        description: Multiomics concerns integration of data from multiple omics (e.g.
          transcriptomics, proteomics, epigenomics).
        meaning: edam:topic_4021
      edam:topic_4027:
        title: Ribosome Profiling
        description: With ribosome profiling, ribosome-protected mRNA fragments are
          analyzed with RNA-seq techniques leading to a genome-wide measurement of
          the translation landscape.
        meaning: edam:topic_4027
      edam:topic_4028:
        title: Single-cell sequencing
        description: Combined with NGS (Next Generation Sequencing) technologies,
          single-cell sequencing allows the study of genetic information (DNA, RNA,
          epigenome...) at a single cell level. It is often used for differential
          analysis and gene expression profiling.
        meaning: edam:topic_4028
      edam:topic_4029:
        title: Acoustics
        description: The study of mechanical waves in liquids, solids, and gases.
        meaning: edam:topic_4029
      edam:topic_4030:
        title: Microfluidics
        description: Interdisplinary study of behavior, precise control, and manipulation
          of low (microlitre) volume fluids in constrained space.
        meaning: edam:topic_4030
      edam:topic_4037:
        title: Genomic imprinting
        description: Genomic imprinting is a gene regulation mechanism by which a
          subset of genes are expressed from one of the two parental chromosomes only.
          Imprinted genes are organized in clusters, their silencing/activation of
          the imprinted loci involves epigenetic marks (DNA methylation, etc) and
          so-called imprinting control regions (ICR). It has been described in mammals,
          but also plants and insects.
        meaning: edam:topic_4037
      edam:topic_4038:
        title: Metabarcoding
        description: Metabarcoding is the barcoding of (environmental) DNA or RNA
          to identify multiple taxa from the same sample.
        meaning: edam:topic_4038
      edam:topic_4044:
        title: Data protection
        description: Data protection is a topic concerning data that should be protected
          from disclosure, damage, or unauthorised access, due to its sensitive nature.
        meaning: edam:topic_4044
      edam:topic_4045:
        title: Cybersecurity
        description: Cybersecurity is a topic comprising the approaches and technologies
          that enable the protection of computer systems, networks and programs from
          digital attacks. It ensures the availability, integrity, and confidentiality
          of processed and stored information.
        meaning: edam:topic_4045
      edam:topic_4046:
        title: Version control
        description: Version control is a technology for consistent management, storing,
          and sharing of evolving versions of digital artefacts, such as computer
          programs, scripts, documents, data, or media files.
        meaning: edam:topic_4046
      edam:topic_4047:
        title: Software management
        description: Software management comprises the practices and principles of
          taking care of software and software-based or software-like services, other
          than programming and maintenance. This includes for example taking care
          of the associated information and documentation, and the processes of contribution,
          validation, release/publication, or deployment.
        meaning: edam:topic_4047
      edam:topic_4051:
        title: ChIP-exo
        description: Chromatin immunoprecipitation-based exeperiment similar to ChIP-seq,
          with an additional experimental step using an exonuclease to increase the
          resolution of protein binding site identification.
        meaning: edam:topic_4051
      edam:topic_4052:
        title: Hi-C
        description: High-throughput genomic and epigenomic technique that capture
          chromatin conformation, allowing a genome-wide identification of chromatin
          interactions and structure.
        meaning: edam:topic_4052
      edam:topic_4053:
        title: ATAC-seq
        description: Assay for Transposase-Accessible Chromatin with high throughput
          sequencing. This technique is designed for the genome-wide detection of
          open chromatin regions.
        meaning: edam:topic_4053
      edam:topic_4054:
        title: miRNA silencing
        description: Experiment in which the expression of a given gene is knocked
          down by means of a micro RNA (miRNA) causing the degradation of the gene
          transcript (mRNA).
        meaning: edam:topic_4054
      edam:topic_4055:
        title: siRNA experiment
        description: Experiment in which the expression of a given gene is knocked
          down by means of a small interfering RNA (siRNA) causing the degradation
          of the gene transcript (mRNA).
        meaning: edam:topic_4055
      edam:topic_4056:
        title: Long-read sequencing
        description: Long-read sequencing is a sequencing method that produces reads
          thousands to millions of base pairs long, allowing for better resolution
          of complex regions, structural variants, and full-length transcripts.
        meaning: edam:topic_4056
      edam:topic_4057:
        title: Short-read sequencing
        description: Short-read sequencing is a high-throughput sequencing method
          that generates millions of short nucleotide fragments, typically 50–300
          base pairs in length.
        meaning: edam:topic_4057
      edam:topic_4060:
        title: Metaproteomics
        description: Metaproteomics is the profiling of proteins in a sample that
          contains material from multiple species or strains of organisms.
        meaning: edam:topic_4060
      edam:topic_4061:
        title: Bisulfite sequencing
        description: Bisulfite sequencing is a sequencing technique used to determine
          DNA methylation patterns by treating DNA with bisulfite, which converts
          unmethylated cytosines to uracils while leaving methylated cytosines unchanged.
        meaning: edam:topic_4061
      edam:topic_4062:
        title: Bulk RNA barcoding and sequencing
        description: Bulk RNA barcoding and sequencing (BRB-seq) is a highly mutliplexed
          bulk RNA-Seq technique where each RNA sample gets a barcode, and many samples
          are sequenced together.
        meaning: edam:topic_4062
      edam:topic_4063:
        title: DNase sequencing
        description: DNase sequencing is a technique used to identify regions of open
          chromatin by sequencing DNA fragments generated after treatment with DNase
          I, which preferentially cuts accessible DNA.
        meaning: edam:topic_4063
      edam:topic_4064:
        title: MicroRNA sequencing
        description: Specific sequencing of small RNAs using a variant of RNA-seq,
          with an additional fragment size selection step.
        meaning: edam:topic_4064
      edam:topic_4065:
        title: Exposomics
        description: Exposomics is the systematic and comprehensive study of the exposome
          and the associated biological responses (exposure-phenotype interaction).
          Exposome is the totality of environmental exposures, that is, the cumulative
          (e.g. life-long) totality of contacts between external factors (e.g. chemical
          agents) and a living organism, a population, or a biological taxon.
        meaning: edam:topic_4065
