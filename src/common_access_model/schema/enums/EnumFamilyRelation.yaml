---
id: https://includedcc.org/common-access-model/EnumFamilyRelation
name: EnumFamilyRelation
enums:
  EnumFamilyRelation:
    description: Definitions of family relations as provided by KIN Ontology.
    reachable_from:
      source_ontology: http://purl.org/ga4gh/kin.owl
      source_nodes:
        - KIN:001
      is_direct: false
      include_self: true
      relationship_types:
        - rdfs:subClassOf
    permissible_values:
      KIN:001:
        title: isRelativeOf
        description:
          A relation that indicates that a person is connected to another
          biologically or through a socio-legal relationship.
        meaning: KIN:001
      KIN:053:
        title: isPaternalGrandparentOf
        description: A relation between a person and a child of that person's son.
        meaning: KIN:053
      KIN:022:
        title: isAdoptiveParentOf
        description:
          A legal relation between a person and a child that is adopted
          by that person. The adopted child is given the rights, privileges, and duties
          of a biological child by the adoptive person.
        meaning: KIN:022
      KIN:027:
        title: isBiologicalMotherOf
        description:
          A relation that indicates that a person is the biological mother
          of another person.
        meaning: KIN:027
      KIN:039:
        title: hasGestationalCarrier
        description:
          A relation between the child and a woman who carried a fertilised
          egg in her womb and gave birth to a child on behalf of the mother.
        meaning: KIN:039
      KIN:038:
        title: isOvumDonorOf
        description:
          A relation between a fertile woman who donated an egg to another
          woman to help her conceive and the child.
        meaning: KIN:038
      KIN:051:
        title: isSeparatedConsanguineousPartnerOf
        description:
          A socio-legal relationship between two people who used to live
          together, share a common domestic life and are closely related biologically
          (second cousins or closer), and have now separated.
        meaning: KIN:051
      KIN:010:
        title: isMonozygoticMultipleBirthSiblingOf
        description:
          A relation between two people born at the same birth from a single
          fertilised ovum that splits.
        meaning: KIN:010
      KIN:055:
        title: isPaternalHalfSiblingOf
        description:
          A relation between two people that share the same biological
          father.
        meaning: KIN:055
      KIN:008:
        title: isFullsiblingOf
        description:
          A relation between two people that have both biological parents
          in common.
        meaning: KIN:008
      KIN:052:
        title: isMaternalGrandparentOf
        description: A relation between a person and a child of that person's daughter.
        meaning: KIN:052
      KIN:028:
        title: isBiologicalFatherOf
        description:
          A relation that indicates that a person is the biological father
          of another person.
        meaning: KIN:028
      KIN:013:
        title: isParentalSiblingOf
        description:
          A relation that indicates that a person is the sibling of a parent
          of another person.
        meaning: KIN:013
      KIN:003:
        title: isBiologicalParentOf
        description:
          A relation that indicates that a person is the biological parent
          of another person.
        meaning: KIN:003
      KIN:059:
        title: isPaternalUncleOf
        description: A relation between a man and the child of that man's brother.
        meaning: KIN:059
      KIN:005:
        title: isGestationalCarrierOf
        description:
          A relation between the woman who carried a fertilised egg in
          her womb and gave birth to a child on behalf of the mother, and the child.
        meaning: KIN:005
      KIN:023:
        title: isStepParentOf
        description:
          A relation between a person and a child, where the person is
          married to the father or mother of a child but who is not that child's own
          father or mother.
        meaning: KIN:023
      KIN:036:
        title: isGrandchildOf
        description: A relation between a person and a parent of that person's parent.
        meaning: KIN:036
      KIN:025:
        title: isStepSiblingOf
        description:
          A relation between children born of two different families who
          have been joined by marriage, defacto or otherwise, of at least one of their
          respective parents.
        meaning: KIN:025
      KIN:058:
        title: isMaternalUncleOf
        description: A relation between a man and the child of that man's sister.
        meaning: KIN:058
      KIN:004:
        title: isSpermDonorOf
        description: A relation between a man who donated his sperm and the child.
        meaning: KIN:004
      KIN:024:
        title: isSiblingFigureOf
        description:
          A relation between two people that has all or some of the characteristics
          of a sibling relationship.
        meaning: KIN:024
      KIN:009:
        title: isMultipleBirthSiblingOf
        description: A relation between two people born at the same birth.
        meaning: KIN:009
      KIN:061:
        title: isPaternalAuntOf
        description: A relation between a woman and the child of that woman's brother.
        meaning: KIN:061
      KIN:060:
        title: isMaternalAuntOf
        description: A relation between a woman and the child of that woman's sister.
        meaning: KIN:060
      KIN:029:
        title: isMitochondrialDonorOf
        description:
          A relation between a woman that has donated mitochondria and
          a child. Mitochondrial donation involves removing the nuclear DNA from a
          woman’s ovum containing faulty mitochondria and inserting it into a healthy
          donor ovum, which has had its nuclear DNA removed.
        meaning: KIN:029
      KIN:047:
        title: isGreatGrandchildOf
        description: A relation between a person and a parent of that person's grandparent.
        meaning: KIN:047
      KIN:021:
        title: isFosterParentOf
        description:
          A relation between a person and a child that temporarily enters
          into his or her family for a period of time, without becoming the child's
          legal parent.
        meaning: KIN:021
      KIN:057:
        title: isPaternalStepSiblingOf
        description:
          A relation between children born of two different families who
          have been joined by marriage, defacto or otherwise. One is a biological
          child and the other is a step child of the same man.
        meaning: KIN:057
      KIN:030:
        title: isConsanguineousPartnerOf
        description:
          A socio-legal relationship between two people who live together,
          share a common domestic life and are closely related biologically (second
          cousins or closer).
        meaning: KIN:030
      KIN:046:
        title: hasParentalSibling
        description:
          A relation that indicates that a person has a parental sibling
          relationship with another person, i.e., the other person is the sibling
          of a parent.
        meaning: KIN:046
      KIN:012:
        title: isHalfSiblingOf
        description:
          A relation between two people that have a single biological parent
          in common.
        meaning: KIN:012
      KIN:014:
        title: isCousinOf
        description:
          A relation between a person and a child of that person's uncle
          or aunt.
        meaning: KIN:014
      KIN:015:
        title: isMaternalCousinOf
        description:
          A relation between a person and a child of that person's mother's
          sibling.
        meaning: KIN:015
      KIN:050:
        title: isSeparatedPartnerOf
        description:
          A socio-legal relationship between two people who used to live
          together and share a common domestic life, but have now separated.
        meaning: KIN:050
      KIN:056:
        title: isMaternalStepSiblingOf
        description:
          A relation between children born of two different families who
          have been joined by marriage, defacto or otherwise. One is a biological
          child and the other is a step child of the same woman.
        meaning: KIN:056
      KIN:032:
        title: isBiologicalChildOf
        description:
          A relation that indicates that a person is the biological child
          of another person.
        meaning: KIN:032
      KIN:020:
        title: isParentFigureOf
        description:
          A relation between a person who is regarded as having all or
          some of the characteristics of a parent and the child.
        meaning: KIN:020
      KIN:007:
        title: isBiologicalSiblingOf
        description:
          A relation between two people that have one or both biological
          parents in common.
        meaning: KIN:007
      KIN:002:
        title: isBiologicalRelativeOf
        description:
          A relation that indicates that a person is related to another
          person biologically.
        meaning: KIN:002
      KIN:018:
        title: isGreatGrandparentOf
        description: A relation between a person and a child of that person's grandchild.
        meaning: KIN:018
      KIN:011:
        title: isPolyzygoticMultipleBirthSiblingOf
        description:
          A relation between two people born at the same birth from fertilisation
          of more than two ovums discharged in a single ovarian cycle.
        meaning: KIN:011
      KIN:006:
        title: isSurrogateOvumDonorOf
        description:
          A relation between the woman who carried her fertilised egg in
          her womb and gave birth to a child on behalf of the mother, and the child.
        meaning: KIN:006
      KIN:017:
        title: isGrandparentOf
        description: A relation between a person and a child of that person's child.
        meaning: KIN:017
      KIN:016:
        title: isPaternalCousinOf
        description:
          A relation between a person and a child of that person's father's
          sibling.
        meaning: KIN:016
      KIN:026:
        title: isPartnerOf
        description:
          A socio-legal relationship between two people who live together
          and share a common domestic life.
        meaning: KIN:026
      KIN:019:
        title: isSocialLegalRelativeOf
        description:
          A social or legal relationship between two people, for example,
          an adoptive parent.
        meaning: KIN:019
      KIN:054:
        title: isMaternalHalfSiblingOf
        description:
          A relation between two people that share the same biological
          mother.
        meaning: KIN:054
