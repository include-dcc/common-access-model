id: https://includedcc.org/common-access-model/EnumAsserterType
name: EnumAsserterType
enums:
  EnumAsserterType:
    description: Individuals or organizations making assertions.
    permissible_values:
      CAM:0000049:
        title: Healthcare Organization
        description: Assertion documented by a healthcare system.
        aliases:
        - medical_record
      CAM:0000050:
        title: Investigator
        description: Assertion documented by an investigator, eg, through an examination.
        aliases:
        - investigator_assessment
      CAM:0000051:
        title: Participant or Caregiver Report
        description: Data obtained from survey, questionnaire, etc. filled out by
          participant or caregiver
        aliases:
        - participant_or_caregiver_report
      CAM:0000052:
        title: Other
        description: Data obtained from other source, such as tissue bank
        aliases:
        - other
