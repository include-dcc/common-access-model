id: https://includedcc.org/common-access-model/EnumDataSourceType
name: EnumDataSourceType
enums:
  EnumDataSourceType:
    title: Data Source Type
    description: Approaches to ascertain information about a participant.
    permissible_values:
      CAM:0000018:
        title: Medical Record
        description: Data obtained directly from medical record
        aliases:
        - medical_record
      CAM:0000019:
        title: Assessment
        description: Data obtained by examination, interview, etc. with investigator
        aliases:
        - investigator_assessment
      CAM:0000020:
        title: Participant or Caregiver Report
        description: Data obtained from survey, questionnaire, etc. filled out by
          participant or caregiver
        aliases:
        - participant_or_caregiver_report
      CAM:0000021:
        title: Participant Self-Report
        description: Data obtained from other source, such as tissue bank
        aliases:
        - other
      CAM:0000022:
        title: Unknown
        aliases:
        - unknown
