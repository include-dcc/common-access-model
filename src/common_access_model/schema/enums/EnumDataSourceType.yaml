id: https://includedcc.org/common-access-model/EnumDataSourceType
name: EnumDataSourceType
enums:
  EnumDataSourceType:
    title: Data Source Type
    description: Approaches to ascertain information about a participant.
    reachable_from:
      source_ontology: camo
      source_nodes:
        - CAMO:0000009
      include_self: true
      is_direct: false
      relationship_types:
        - rdfs:subClassOf
    permissible_values:
      CAMO:0000014:
        title: Electronic Health Record
        description: Data obtained directly from an Electronic Health Record.
        aliases:
        - medical_record
      CAMO:0000010:
        title: Survey
        description: Data obtained from a survey or questionnaire given to a participant or their representative.
        aliases:
        - participant_or_caregiver_report
      CAMO:0000011:
        title: Research Assessment
        description: Data obtained by research staff for the study.
        aliases:
        - investigator_assessment
      CAMO:0000012:
        title: Interview
        description: Data obtained by research staff interviewing participants, representatives, or others.
      CAMO:0000013:
        title: Physical Examination
        description: Data obtained directly by research staff examining the participant.
