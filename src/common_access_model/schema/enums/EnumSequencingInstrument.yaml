      OBI:0002001:
        title: Illumina HiSeq 2000
        description: A DNA sequencer which is manufactured by the Illumina corporation,
          with two flow cells and a throughput of up to 55 Gb per day. Built upon
          sequencing by synthesis technology, the machine is optimized for generation
          of data for multiple samples in a single run.
        meaning: OBI:0002001
      OBI:0002002:
        title: Illumina HiSeq 2500
        description: A DNA sequencer which is manufactured by the Illumina corporation,
          with two flow cells and a throughput of up to 160 Gb per day. Built upon
          sequencing by synthesis technology, the machine is optimized for generation
          of data for batching multiple samples or rapid results on a few samples.
        meaning: OBI:0002002
      OBI:0002022:
        title: Illumina HiSeq 1000
        description: A DNA sequencer which is manufactured by the Illumina corporation,
          with a single flow cell and a throughput of up to 35 Gb per day. It supports
          sequencing of single, long or short insert paired end clone libraries relying
          on sequencing by synthesis technology.
        meaning: OBI:0002022
      OBI:0002048:
        title: Illumina HiSeq 3000
        description: A DNA sequencer manufactured by Illumina corporation, with a
          single flow cell and a throughput of more than 200 Gb per day.
        meaning: OBI:0002048
      OBI:0002049:
        title: Illumina HiSeq 4000
        description: A DNA sequencer manufactured by Illumina corporation, with two
          flow cell and a throughput of more than 400 Gb per day.
        meaning: OBI:0002049
      OBI:0002129:
        title: Illumina HiSeq X Ten
        description: A DNA sequencer that consists of a set of 10 HiSeq X Sequencing
          Systems.
        meaning: OBI:0002129
      OBI:0003386:
        title: Illumina HiSeq 1500
        description: A DNA sequencer which is manufactured by the Illumina corporation,
