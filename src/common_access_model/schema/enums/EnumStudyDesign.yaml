---
id: https://includedcc.org/common-access-model/EnumStudyDesign
name: EnumStudyDesign
enums:
  EnumStudyDesign:
    title: Study Design
    description: Approaches for collecting data, investigating interventions, and/or
      analyzing data.
    reachable_from:
      source_ontology: bioregistry:mesh
      source_nodes:
        - mesh:D016021
        - mesh:D052182
      include_self: false
      is_direct: false
      relationship_types:
        - rdfs:subClassOf
    permissible_values:
      mesh:D003430:
        title: Cross-Sectional Studies
        description: Studies in which the presence or absence of disease or other
          health-related variables are determined in each member of the study population
          or in a representative sample at one particular time. This contrasts with
          LONGITUDINAL STUDIES which are followed over a period of time.
        meaning: mesh:D003430
      mesh:D005500:
        title: Follow-Up Studies
        description: Studies in which individuals or populations are followed to assess
          the outcome of exposures, procedures, or effects of a characteristic, e.g.,
          occurrence of disease.
        meaning: mesh:D005500
      mesh:D008137:
        title: Longitudinal Studies
        description: Studies in which variables relating to an individual or group
          of individuals are assessed over a period of time.
        meaning: mesh:D008137
      mesh:D011446:
        title: Prospective Studies
        description: Observation of a population for a sufficient number of persons
          over a sufficient number of years to generate incidence or mortality rates
          subsequent to the selection of the study group.
        meaning: mesh:D011446
      mesh:D012189:
        title: Retrospective Studies
        description: Studies used to test etiologic hypotheses in which inferences
          about an exposure to putative causal factors are derived from data relating
          to characteristics of persons under study or to events or experiences in
          their past. The essential feature is that some of the persons under study
          have the disease or outcome of interest and their characteristics are compared
          with those of unaffected persons.
        meaning: mesh:D012189
      mesh:D015331:
        title: Cohort Studies
        description: Studies in which subsets of a defined population are identified.
          These groups may or may not be exposed to factors hypothesized to influence
          the probability of the occurrence of a particular disease or other outcome.
          Cohorts are defined populations which, as a whole, are followed in an attempt
          to determine distinguishing subgroup characteristics.
        meaning: mesh:D015331
      mesh:D015528:
        title: HIV Seroprevalence
        description: Studies of the number of cases where human immunodeficiency virus
          (HIV) is present in a specific population at a designated time. The presence
          in a given individual is determined by the finding of HIV antibodies in
          the serum (HIV SEROPOSITIVITY).
        meaning: mesh:D015528
      mesh:D016022:
        title: Case-Control Studies
        description: Comparisons that start with the identification of persons with
          the disease or outcome of interest and a control (comparison, referent)
          group without the disease or outcome of interest. The relationship of an
          attribute is examined by comparing both groups with regard to the frequency
          or levels of outcome over time.
        meaning: mesh:D016022
      mesh:D016036:
        title: Seroepidemiologic Studies
        description: EPIDEMIOLOGIC STUDIES based on the detection through serological
          testing of characteristic change in the serum level of specific ANTIBODIES.
          Latent subclinical infections and carrier states can thus be detected in
          addition to clinically overt cases.
        meaning: mesh:D016036
      mesh:D063588:
        title: National Longitudinal Study of Adolescent Health
        description: Longitudinal study of a nationally representative sample of adolescents
          in grades 7-12 in the United States during the 1994-95 school year. The
          Add Health cohort has been followed into young adulthood. (from http://www.cpc.unc.edu/projects/addhealth
          accessed 08/2012)
        meaning: mesh:D063588
      mesh:D065186:
        title: Interrupted Time Series Analysis
        description: A study that uses observations at multiple time points before
          and after an intervention (the interruption), in an attempt to detect whether
          the intervention has had an effect significantly greater than any underlying
          trend over time.
        meaning: mesh:D065186
      mesh:D065187:
        title: Controlled Before-After Studies
        description: A study in which observations are made before and after an intervention,
          both in a group that receives the intervention and in a control group that
          does not.
        meaning: mesh:D065187
      mesh:D065386:
        title: Historically Controlled Study
        description: A study that compares a group of participants receiving an intervention
          with a similar group from the past who did not.
        meaning: mesh:D065386
      mesh:D000068397:
        title: Clinical Study
        description: A work that reports on the results of a research study to evaluate
          interventions or exposures on biomedical or health-related outcomes.  The
          two main types of clinical studies are interventional studies (clinical
          trials) and observational studies. While most clinical studies concern humans,
          this publication type may be used for clinical veterinary articles meeting
          the requisites for humans.
        meaning: mesh:D000068397
      mesh:D000073843:
        title: Equivalence Trial
        description: Trial that aims to show a new treatment is no better and no worse
          than the standard treatment.
        meaning: mesh:D000073843
      mesh:D000076362:
        title: Adaptive Clinical Trial
        description: Clinical study in which a prospectively planned opportunity is
          included to modify trial designs and hypotheses based on analysis of data
          from subjects in the study.
        meaning: mesh:D000076362
      mesh:D000077522:
        title: Clinical Trial, Veterinary
        description: A work in which animal participants are assigned to receive one
          or more interventions so that researchers can evaluate the interventions
          on biomedical or health-related outcomes. The assignments are determined
          by the study protocol.
        meaning: mesh:D000077522
      mesh:D000078182:
        title: Systematic Review
        description: A review of primary literature in health and health policy that
          attempts to identify, appraise, and synthesize all the empirical evidence
          that meets specified eligibility criteria to answer a given research question.  Its
          conduct uses explicit methods aimed at minimizing bias in order to produce
          more reliable findings regarding the effects of interventions for prevention,
          treatment, and rehabilitation that can be used to inform decision making.
        meaning: mesh:D000078182
      mesh:D000078323:
        title: Observational Study, Veterinary
        description: Reports on studies of the results of a clinical study in which
          animal subjects may receive diagnostic, therapeutic, or other types of interventions,
          where the investigator does not assign participants to specific interventions.
        meaning: mesh:D000078323
      mesh:D000078325:
        title: Clinical Trial Protocol
        description: The written description of a clinical study. It contains the
          study's objectives, design, and methods including subject target and/or
          enrollment criteria. It may also present relevant scientific background
          and statistical information.
        meaning: mesh:D000078325
      mesh:D000081262:
        title: Randomized Controlled Trial, Veterinary
        description: A work that reports on a clinical trial with animal subjects
          that involves at least one test treatment and one control treatment, concurrent
          enrollment and follow-up of the test- and control-treated groups, and in
          which the treatments to be administered are selected by a random process,
          such as the use of a random-numbers table.
        meaning: mesh:D000081262
      mesh:D000098368:
        title: Human Challenge Trials
        description: Trials in which participants are intentionally challenged (whether
          or not they have been vaccinated) with exposure to an infectious disease
          organism.
        meaning: mesh:D000098368
      mesh:D000098583:
        title: Scoping Review
        description: Review to identify knowledge gaps, scope a body of literature,
          clarify concepts or to investigate research conduct.
        meaning: mesh:D000098583
      mesh:D000099094:
        title: Network Meta-Analysis
        description: Works consisting of meta-analysis of randomized trials in which
          estimates of comparative treatment effects are visualized and interpreted
          from a network of interventions that may or may not have been evaluated
          directly against each other. Common considerations in network meta-analysis
          include conceptual and statistical heterogeneity and incoherence.
        meaning: mesh:D000099094
      mesh:D002363:
        title: Case Reports
        description: Clinical presentations that may be followed by evaluative studies
          that eventually lead to a diagnosis.
        meaning: mesh:D002363
      mesh:D003160:
        title: Comparative Study
        description: Comparison of outcomes, results, responses, etc for different
          techniques, therapeutic approaches or other inputs.
        meaning: mesh:D003160
      mesh:D016426:
        title: Scientific Integrity Review
        description: Work consisting of reports by the United States Office of Research
          Integrity, identifying questionable research published in articles or books.
          Notification of the questionable data is carried in the NIH Guide for Grants
          and Contracts.
        meaning: mesh:D016426
      mesh:D016429:
        title: Clinical Conference
        description: Work that consists of a conference of physicians on their observations
          of a patient at the bedside, regarding the physical state, laboratory and
          other diagnostic findings, clinical manifestations, results of current therapy,
          etc. A clinical conference usually ends with a confirmation or correction
          of clinical findings by a pathological diagnosis performed by a pathologist.
          Clinical conference is often referred to as a clinico-pathological conference.
        meaning: mesh:D016429
      mesh:D016430:
        title: Clinical Trial
        description: A work that reports on the results of a clinical study in which
          participants are assigned to receive one or more interventions so that researchers
          can evaluate the interventions on biomedical or health-related outcomes.
          The assignments are determined by the study protocol. Participants may receive
          diagnostic, therapeutic, or other types of interventions. For clinical trials
          on  veterinary animals see CLINICAL TRIAL, VETERINARY. Clinical Trials was
          used for both humans and non-humans prior to 2019.
        meaning: mesh:D016430
      mesh:D016446:
        title: Consensus Development Conference
        description: Official statements of the findings or recommendations expressing
          the outcome of a meeting convened to evaluate current thought and research
          on a subject of interest.
        meaning: mesh:D016446
      mesh:D016447:
        title: Consensus Development Conference, NIH
        description: Official statements of the finding or recommendations expressing
          the outcome from a conference sponsored by NIH.
        meaning: mesh:D016447
      mesh:D016448:
        title: Multicenter Study
        description: A work that reports on a study executed by several cooperating
          institutions.
        meaning: mesh:D016448
      mesh:D016449:
        title: Randomized Controlled Trial
        description: A work that reports on a clinical trial that involves at least
          one test treatment and one control treatment, concurrent enrollment and
          follow-up of the test- and control-treated groups, and in which the treatments
          to be administered are selected by a random process, such as the use of
          a random-numbers table.
        meaning: mesh:D016449
      mesh:D017418:
        title: Meta-Analysis
        description: Works consisting of studies using a quantitative method of combining
          the results of independent studies (usually drawn from the published literature)
          and synthesizing summaries and conclusions which may be used to evaluate
          therapeutic effectiveness, plan new studies, etc. It is often an overview
          of clinical trials. It is usually called a meta-analysis by the author or
          sponsoring body and should be differentiated from reviews of literature.
        meaning: mesh:D017418
      mesh:D017426:
        title: Clinical Trial, Phase I
        description: Work that is the report of a pre-planned, usually controlled,
          clinical study of the safety and efficacy of diagnostic, therapeutic, or
          prophylactic drugs, devices, or techniques based on a small number of healthy
          persons and conducted over the period of about a year in either the United
          States or a foreign country.
        meaning: mesh:D017426
      mesh:D017427:
        title: Clinical Trial, Phase II
        description: Work that is a report of a pre-planned, usually controlled, clinical
          study of the safety and efficacy of diagnostic, therapeutic, or prophylactic
          drugs, devices, or techniques based on several hundred volunteers, including
          a limited number of patients, and conducted over a period of about two years
          in either the United States or a foreign country.
        meaning: mesh:D017427
      mesh:D017428:
        title: Clinical Trial, Phase III
        description: Work that is a report of a pre-planned, usually controlled, clinical
          study of the safety and efficacy of diagnostic, therapeutic, or prophylactic
          drugs, devices, or techniques after phase II trials. A large enough group
          of patients is studied and closely monitored by physicians for adverse response
          to long-term exposure, over a period of about three years in either the
          United States or a foreign country.
        meaning: mesh:D017428
      mesh:D017429:
        title: Clinical Trial, Phase IV
        description: Work that is a report of a planned post-marketing study of diagnostic,
          therapeutic, or prophylactic drugs, devices, or techniques that have been
          approved for general sale after clinical trials, phases I, II, and III.
          These studies, conducted in the United States or a foreign country, often
          garner additional data about the safety and efficacy of a product.
        meaning: mesh:D017429
      mesh:D018486:
        title: Twin Study
        description: Work consisting of reporting using a method of detecting genetic
          causes in human traits and genetic factors in behavior using sets of twins.
        meaning: mesh:D018486
      mesh:D018848:
        title: Controlled Clinical Trial
        description: A work that reports on a clinical trial involving one or more
          test treatments, at least one control treatment, specified outcome measures
          for evaluating the studied intervention, and a bias-free method for assigning
          patients to the test treatment. The treatment may be drugs, devices, or
          procedures studied for diagnostic, therapeutic, or prophylactic effectiveness.
          Control measures include placebos, active medicine, no-treatment, dosage
          forms and regimens, historical comparisons, etc. When randomization using
          mathematical techniques, such as the use of a random numbers table, is employed
          to assign patients to test or control treatments, the trial is characterized
          as a RANDOMIZED CONTROLLED TRIAL.
        meaning: mesh:D018848
      mesh:D023361:
        title: Validation Study
        description: Works consisting of research using processes by which the reliability
          and relevance of a procedure for a specific purpose are established.
        meaning: mesh:D023361
      mesh:D023362:
        title: Evaluation Study
        description: Works consisting of studies determining the effectiveness or
          utility of processes, personnel, and equipment.
        meaning: mesh:D023362
      mesh:D064888:
        title: Observational Study
        description: A work that reports on the results of a clinical study in which
          participants may receive diagnostic, therapeutic, or other types of interventions,
          but the investigator does not assign participants to specific interventions
          (as in an interventional study).
        meaning: mesh:D064888
      mesh:D065007:
        title: Pragmatic Clinical Trial
        description: Randomized clinical trials that compare interventions in clinical
          settings and which look at a range of effectiveness outcomes and impacts.
        meaning: mesh:D065007
