      OBI:0003290:
        title: mosquito membrane feeding assay
        description: An assay that evaluates host-to-mosquito transmission of a parasite
          organism by feeding a specimen of host blood infected with the parasite
          organism to a collection of mosquitoes through a mosquito membrane feeding
          device and, after a given time, dissecting the mosquitoes and counting the
          number of parasite organisms within them.
        meaning: OBI:0003290
      OBI:0003292:
