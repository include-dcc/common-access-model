---
id: https://includedcc.org/common-access-model/EnumAssayType
name: EnumAssayType
enums:
  EnumAssayType:
    description: Type of assays performed
    is_a: EnumNull
    reachable_from:
      source_ontology: bioregistry:obi
      source_nodes:
        - OBI:0000070
      include_self: true
      is_direct: false
      relationship_types:
        - rdfs:subClassOf
    permissible_values:
      OBI:0000070:
        title: assay
        description: assay
        meaning: OBI:0000070
      CHMO:0000087:
        title: fluorescence microscopy assay
        description: Any type of light microscopy assay where the specimen can be
          made to fluoresce (emit energy as visible light) by illuminating it with
          light of specific wavelengths. These specimens are called fluorophores.
        meaning: CHMO:0000087
      CHMO:0000089:
        title: confocal fluorescence microscopy assay
        description: Microscopy where the specimen can be made to fluoresce (emit
          energy as visible light) by scanning a gas (Ar or Kr) laser spot of specific
          wavelength over its surface and using a spatial pinhole to eliminate out-of-focus
          fluorescence.
        meaning: CHMO:0000089
      CHMO:0000102:
        title: light microscopy assay
        description: Microscopy where the specimen is illuminated with visible light
          and a system of lenses is used to produce an image.
        meaning: CHMO:0000102
      CHMO:0000701:
        title: liquid chromatography-tandem mass spectrometry
        description: A method where a sample mixture is first separated by liquid
          chromatography before being ionised and characterised by mass-to-charge
          ratio and relative abundance using two mass spectrometers in series.
        meaning: CHMO:0000701
      OBI:0000117:
        title: Bernoulli trial
        description: An assay where the output data is a datum with one of two values
          denoting success and failure.
        meaning: OBI:0000117
      OBI:0000182:
        title: NMR 3D molecular structure determination assay
        description: A 3D molecular structure determination assay that uses magnetic
          properties of atomic nuclei to determine the 3D structure and dynamics of
          molecules in the input sample.
        meaning: OBI:0000182
      OBI:0000185:
        title: imaging assay
        description: An assay that produces a picture of an entity.
        meaning: OBI:0000185
      OBI:0000201:
        title: radioactivity detection
        description: An assay that measures the amount of radiation in the radioactive
          spectrum (alpha, beta or gamma rays) emitted from an input material.
        meaning: OBI:0000201
      OBI:0000288:
        title: protein-protein interaction detection assay
        description: An assay that determines interactions between proteins, such
          as protein-protein binding.
        meaning: OBI:0000288
      OBI:0000291:
        title: transcription factor binding site assay
        description: An assay tthat determines DNA regions specifically recognized
          by proteins that function as transcription factors
        meaning: OBI:0000291
      OBI:0000366:
        title: metabolite profiling assay
        description: An assay that detects and identifies chemical entities resulting
          from biochemical and cellular metabolism
        meaning: OBI:0000366
      OBI:0000418:
        title: measuring glucose concentration in blood serum assay
        description: An assay that determines the concentration of glucose molecules
          in a blood serum sample
        meaning: OBI:0000418
      OBI:0000424:
        title: transcription profiling assay
        description: An assay that determines gene expression and transcription activity
          using ribonucleic acids collected from a material entity.
        meaning: OBI:0000424
      OBI:0000433:
        title: DNA sequence feature detection assay
        description: An assay with the objective to determine a sequence feature of
          DNA
        meaning: OBI:0000433
      OBI:0000435:
        title: genotyping assay
        description: An assay which generates data about a genotype from a specimen
          of genomic DNA. A variety of techniques and instruments can be used to produce
          information about sequence variation at particular genomic positions.
        meaning: OBI:0000435
      OBI:0000438:
        title: DNA sequence variation detection assay
        description: An assay that measures changes (expansion, amplification, deletion,
          mutation) in the sequence of a DNA molecule.
        meaning: OBI:0000438
      OBI:0000443:
        title: analyte assay
        description: An assay with the objective to capture information about the
          presence, concentration, or amount of an analyte in an evaluant.
        meaning: OBI:0000443
      OBI:0000445:
        title: mass measurement assay
        description: An assay that determines the mass of an evaluant
        meaning: OBI:0000445
      OBI:0000447:
        title: intracellular electrophysiology recording assay
        description: An electrophysiology assay where the recording location of the
          electrode is intracellular.
        meaning: OBI:0000447
      OBI:0000454:
        title: extracellular electrophysiology recording assay
        description: An electrophysiology assay where the recording location of the
          electrode is extracellular.
        meaning: OBI:0000454
      OBI:0000470:
        title: mass spectrometry assay
        description: An assay that identifies the amount and type of material entities
          present in a sample by fragmenting the sample and measuring the mass-to-charge
          ratio of the resulting particles.
        meaning: OBI:0000470
      OBI:0000520:
        title: clinical chemistry assay
        description: An analyte assay which uses analytical methods to produce measurements
          and data on the concentration of chemical parameters (analytes) present
          in a specimen collected from an organism in order to determine a phenotype
          of that organism.
        meaning: OBI:0000520
      OBI:0000537:
        title: copy number variation profiling assay
        description: An assay that determines lost or amplified genomic regions of
          DNA by comparing genomic DNA originating from tissues from the same or different
          individuals using specific techniques such as CGH, array CGH, SNP genotyping
        meaning: OBI:0000537
      OBI:0000615:
        title: protein expression profiling assay
        description: An assay that determines protein expression and translation activity
          using protein extracts collected from a material entity.
        meaning: OBI:0000615
      OBI:0000623:
        title: NMR spectroscopy assay
        description: An assay that exploits the magnetic properties of certain nuclei
          (those with a spin) to resonate when placed in particular magnetic field
          conditions. Instruments recording NMR spectrum and sets of analysis can
          be used to deduce identity of chemical as well as composition of complex
          chemical mixtures.
        meaning: OBI:0000623
      OBI:0000626:
        title: DNA sequencing assay
        description: A sequencing assay which determines information on the sequence
          of a DNA molecule.
        meaning: OBI:0000626
      OBI:0000630:
        title: hematology assay
        description: An assay that studies phenotypes of an organism involving its
          blood and blood producing organs using a variety of techniques and instruments
        meaning: OBI:0000630
      OBI:0000634:
        title: DNA methylation profiling assay
        description: An assay that measures the state of methylation of DNA molecules
          using genomic DNA collected from a material entity using a range of techniques
          and instrument such as DNA sequencers and often relying on treatment with
          bisulfites to ensure cytosine conversion.
        meaning: OBI:0000634
      OBI:0000661:
        title: enzyme-linked immunosorbent assay
        description: An analyte assay where binding of an enzyme linked antibody to
          a material entity that is immobilized on solid support is detected utilizing
          a chemiluminescent reaction. Depending on the setup, the enzyme-linked antibody
          could be binding directly to the analyte, or it serves as a secondary antibody
          detecting binding of the primary antibody to the analyte.
        meaning: OBI:0000661
      OBI:0000664:
        title: BrdU incorporation assay
        description: A cell proliferation assay in which cells are cultured in the
          presence of BrdU which is incorporated into newly synthesized DNA of replicating
          cells (during the S phase of the cell cycle), substituting for thymidine
          during DNA replication, which can be quantified by BrdU specific antibodies.
        meaning: OBI:0000664
      OBI:0000669:
        title: tritiated thymidine incorporation assay
        description: A cell proliferation assay in which cells are cultured in the
          presence of tritiated thymidine which is incorporated into newly synthesized
          DNA of replicating cells (during the S phase of the cell cycle). The radioactivity
          of tritiated thymidine in a cell is a proxy for cells that were actively
          replicating.
        meaning: OBI:0000669
      OBI:0000693:
        title: MeDIP-seq assay
        description: A DNA methylation profiling assay that identifies methylated
          sites in genomic DNA and determines the methylation pattern that affect
          gene transcription using immunoprecipitation of methylated genomic DNA,
          creation of a library of corresponding DNA fragments (either single or paired-end
          fragments) and subsequent sequencing using parallelized sequencing methods.
        meaning: OBI:0000693
      OBI:0000695:
        title: chain termination sequencing assay
        description: A DNA sequencing assay which rely on the use of dideoxynucleotides
          used in 4 distinct sequencing reaction on the same DNA sample. The dideoxynucleotides,
          once incorporated in the complementary DNA strand being synthesized by the
          DNA polymerase prevent any further chain elongation. The newly generated
          sequences are resolved on a polyacrylamide gel using electrophoresis and
          labels (either fluorochrome or radioactivity) are used to determine the
          nucleotide present at a given position
        meaning: OBI:0000695
      OBI:0000697:
        title: Helicos sequencing assay
        description: A DNA sequencing by synthesis assay that identifiies the sequnece
          of billions of DNA molecules immobilized to a surface using DNA polymerase
          and fluorescently labeled nucleotides added one at a time. The sequencing
          process does not require an amplification step and is typically able to
          produce reads of 25 base pair length.
        meaning: OBI:0000697
      OBI:0000699:
        title: survival assessment assay
        description: An assay that measures the occurrence of death events in one
          or more organisms over time
        meaning: OBI:0000699
      OBI:0000705:
        title: Edman degradation
        description: A sequencing assay in which the amino acid sequence of input
          peptides or proteins is determined by iteratively cleaving of the amino-terminal
          (N-terminal) residue without disrupting the peptide bonds and identifying
          it by e.g. chromatography or electropheresis.
        meaning: OBI:0000705
      OBI:0000706:
        title: SOLiD sequencing assay
        description: A DNA sequencing by ligation assay that identifies sequence information
          using primers to hybridize to the P1 adapter sequence within the library
          template, fluorescently labeled di-base probes to compete for ligation to
          the sequencing primer, multiple cycles of ligation, detection and cleavage
          to determine the eventual read length, following a series of ligation cycles,
          the extension product is removed and the template is reset with a primer
          complementary to the n-1 position for a second round of ligation cycles.
        meaning: OBI:0000706
      OBI:0000716:
        title: ChIP-seq assay
        description: An assay in which chromatin is immunoprecipitated and subsequently
          analyzed using a DNA sequencing step to identify which parts of DNA are
          part of the isolated chromatin
        meaning: OBI:0000716
      OBI:0000721:
        title: glucose tolerance test
        description: An assay that measures glucose clearance from blood over time
          by repeated glucose measurement in blood serum or plasma after the administration
          of a glucose bolus in-vivo. This assay can be used to evaluate the severity
          of insulin resistance or the efficiency of glucose clearance.
        meaning: OBI:0000721
      OBI:0000723:
        title: DNA sequencing by ligation assay
        description: A DNA sequencing assay that performs chain extension during the
          sequencing reaction step using DNA ligase
        meaning: OBI:0000723
      OBI:0000724:
        title: Solexa sequencing assay
        description: A DNA sequencing by synthesis assay that identifies sequence
          information using DNA polymerase and reversible terminator, requiring immobilization
          of genomic DNA fragments onto a surface and a specific clonal amplification
          step known as bridge PCR. Reliance on a reversible terminator allows cycles
          of DNA chain extension by DNA polymerase and imaging without the need of
          electrophoretic separation of newly synthesized DNA fragment as with Sanger
          sequencing.
        meaning: OBI:0000724
      OBI:0000730:
        title: pyrosequencing assay
        description: A DNA sequencing by synthesis assay which sequences a single
          strand of DNA by synthesizing the complementary strand along it, one base
          pair at a time, and detecting which base was actually added at each step.
          The template DNA is immobilized, and solutions of A, C, G, and T nucleotides
          are added and removed after the reaction, sequentially. Light is produced
          only when the nucleotide solution complements the first unpaired base of
          the template. The sequence of solutions which produce chemiluminescent signals
          allows the determination of the sequence of the template. ssDNA template
          is hybridized to a sequencing primer and incubated with the enzymes DNA
          polymerase, ATP sulfurylase, luciferase and apyrase, and with the substrates
          adenosine 5-prime phosphosulfate (APS) and luciferin.
        meaning: OBI:0000730
      OBI:0000734:
        title: DNA sequencing by synthesis assay
        description: A DNA sequencing assay that relies on DNA polymerase activity
          to perform chain extension during the sequencing reaction step.
        meaning: OBI:0000734
      OBI:0000743:
        title: immune response assay
        description: An assay that determines information about an immune response
        meaning: OBI:0000743
      OBI:0000748:
        title: bisulfite sequencing assay
        description: A DNA methylation profiling assay which determines the methylation
          status of genomic DNA using DNA sequencing techniques preceded by a bisulfite
          based chemical modification of genomic DNA at CpG island location.
        meaning: OBI:0000748
      OBI:0000787:
        title: human antithrombin-III in blood assay
        description: An assay that measures the amount of antithrombin III in blood.
        meaning: OBI:0000787
      OBI:0000802:
        title: prothrombin time assay
        description: An assay that measures the prothrombin ratio, which is the prothrombin
          time for a patient, divided by the result for control plasma. Most commonly
          the test is preformed using blood plasma. Blood is drawn into a test tube
          containing liquid citrate, which acts as an anticoagulant. An excess of
          calcium is added to enable the blood to clot again.Tissue factor (also known
          as factor III or thromboplastin) is added, and the time the sample takes
          to clot is measured optically as the prothrombin time, which is compared
          to a control sample.
        meaning: OBI:0000802
      OBI:0000805:
        title: antithrombin-III berichrome assay
        description: An antithrombin-III (AT-III) assay in which exogenous bovine
          thrombin and heparin are added to test plasma to form a thrombin-heparin-AT
          complex. The residual thrombin not bound then hydrolyzes the p-nitroalanine
          substrate to produce a yellow color, which is read at 405 nm. The intensity
          of color produced is inversely proportional to the AT present. A calibration
          is done with standard human plasma reagent and results for a given specimen
          are reported as a percentage relative to the standard
        meaning: OBI:0000805
      OBI:0000808:
        title: spectrolyse heparin antifactor-Xa assay
        description: An assay that quantitatively measures heparin in human plasma
          using Factor Xa and Antithrombin III in excess, where the rate of Factor
          Xa inhibition is directly proportional to the heparin concentration. The
          residual Factor Xa activity, measured with a Factor Xa-specific chromogenic
          substrate, is inversely proportional to the heparin concentration.
        meaning: OBI:0000808
      OBI:0000812:
        title: measuring neural activity in the caudate nucleus assay
        description: An assay that measures neural activity in the caudate nucleus
        meaning: OBI:0000812
      OBI:0000820:
        title: activated partial thromboplastin time assay
        description: An assay that evaluates blood coagulation by measuring the time
          required for the appearance of fibrin strands following the mixing blood
          or plasma with phospholipid platelet substitute (e.g., crude cephalins,
          soybean phosphatides). It is a test of the intrinsic pathway (factors VIII,
          IX, XI, and XII) and the common pathway (fibrinogen, prothrombin, factors
          V and X) of blood coaguation . It is used as a screening test and to monitor
          heparin therapy.
        meaning: OBI:0000820
      OBI:0000823:
        title: thrombin time assay
        description: An assay that measures the time between the addition of the thrombin
          and the clot formation in plasma.
        meaning: OBI:0000823
      OBI:0000854:
        title: western blot assay
        description: An analyte assay that detects specific peptides in an input material
          by separating it using gel electrophoresis, transfering the separated molecules
          to a membrane, and staining them with_ antibodies specific to the analyte
          molecules.
        meaning: OBI:0000854
      OBI:0000860:
        title: northern blot assay
        description: An assay that determines the presence of gene transcripts by
          hybridizing labeled RNA or DNA probes against messenger RNAs isolated from
          tissue or cell cultures, resolved on denaturing gel, transfered by a blotting
          procedure to a solid support. Detection of hybridization signals is carried
          out by immunofluorescence or radioactivity measurements using photographic
          films or digital imaging devices such as Phosphor Imager.
        meaning: OBI:0000860
      OBI:0000865:
        title: 96-well neutralization assay
        description: A serum neutralization of viral infectivity assay which is performed
          in a 96-well plate.
        meaning: OBI:0000865
      OBI:0000870:
        title: single-nucleotide-resolution nucleic acid structure mapping assay
        description: An assay that provides information about the secondary structure
          of nucleic acids using chemical or enzymatic probing to establish the extent
          of base-pairing or solvent accessiblity.
        meaning: OBI:0000870
      OBI:0000871:
        title: viral hemagglutination assay
        description: An assay that quantifies viruses by their hemagglutination activity.
        meaning: OBI:0000871
      OBI:0000872:
        title: serum neutralization of viral infectivity assay
        description: An analyte assay that measures virus-neutralizing abilities of
          different sera. Different dilutions of serum are mixed with virus and used
          to infect cells. At the lower dilutions, antibodies will block infection,
          but at higher dilutions, there will be too few antibodies to have an effect.The
          neutralization titer is expressed as the reciprocal of the highest dilution
          at which virus infection is blocked.
        meaning: OBI:0000872
      OBI:0000874:
        title: detection of specific nucleic acid polymers with complementary probes
        description: An analyte assay in which a specified input material (the evaluant)
          is examined for the presence or quantity of specified nucleic acid polymers,
          which are identified based on the use of complementary nucleic acid probes.
        meaning: OBI:0000874
      OBI:0000875:
        title: viral hemagglutination inhibition assay
        description: An assay that measures the ability of an evaluant to inhibit
          hemagglutination by a virus. Hemagglutinin is a viral protein which binds
          to sialic acid receptors on cells or to erythrocytes, causing the cells
          to clump. Loss of clumping indicates that the evaluant blocks binding of
          hemagglutinin to sialic acid receptors.
        meaning: OBI:0000875
      OBI:0000882:
        title: cell-cell killing assay
        description: A cytometry assay that monitors a cell population to track how
          many are killed by other cells.
        meaning: OBI:0000882
      OBI:0000883:
        title: in vivo cell killing assay
        description: A cell killing assay that measures if and how many target cells
          are killed within an organism.
        meaning: OBI:0000883
      OBI:0000891:
        title: cell proliferation assay
        description: A cytometry assay which measures the degreee to which input cells
          are replicating.
        meaning: OBI:0000891
      OBI:0000892:
        title: Southern blot assay
        description: An analyte assay that detects the presence of a specific sequence
          in a DNA sample, which has been digested by restriction enzymes, resolved
          by gel electrophoresis, and blotted to a solid support, followed by hybridization
          of a probe raised against a specific sequence and detected with fluorescence
          or radioactivity.
        meaning: OBI:0000892
      OBI:0000893:
        title: real time polymerase chain reaction assay
        description: An assay, based on the PCR, that amplifies and simultaneously
          quantifies a specific DNA molecule based on the use of complementary probes/primers.
          It enables both detection and quantification (as absolute number of copies
          or relative amount when normalized to DNA input or additional normalizing
          genes) of one or more specific sequences in a DNA sample.
        meaning: OBI:0000893
      OBI:0000897:
        title: DEPC structure mapping assay
        description: A single-nucleotide-resolution nucleic acid structure mapping
          assay which determines nucleic acid secondary structure at a nucleotide
          resolution scale using DEPC as reagent and chemical probe
        meaning: OBI:0000897
      OBI:0000903:
        title: in vitro cell killing assay
        description: A cell killing assay that measures if and how many target cells
          are actively killed by other cells in a cell culture.
        meaning: OBI:0000903
      OBI:0000904:
        title: reporter cell line analyte detection bioassay
        description: An analyte assay in which a cell line whose growth is known to
          be affected by the presence of a specific type of material (the anlyte)
          is cultured in the presence of an input material (the evaluant) in order
          to detect presence of the analyte in the evaluant.
        meaning: OBI:0000904
      OBI:0000910:
        title: radio immuno assay
        description: An assay in which a radioactive labeled antigen or antibody is
          used to determine the interaction between an antigen and its receptor. This
          can be used to detect the presence of an antigen of interest in an input
          sample or determine the specificity of an input antibody.
        meaning: OBI:0000910
      OBI:0000911:
        title: real time reverse-transcription polymerase chain reaction assay
        description: An assay that uses a reverse transcription step (an RNA strand
          is reverse transcribed into its DNA complement using the enzyme reverse
          transcriptase) before a PCR assay.
        meaning: OBI:0000911
      OBI:0000912:
        title: X-ray crystallography 3D molecular structure determination assay
        description: A 3D molecular structure determination assay in which the diffraction
          of pattern of X-ray beams in a crystal of purified material entities is
          used to resolve the 3-dimensional structure of the material entity of interest.
        meaning: OBI:0000912
      OBI:0000913:
        title: promoter activity detection by reporter gene assay
        description: An assay in which the activity of a promoter in a cell is monitored
          by using a reporter gene that was inserted in a genomic location under control
          of the promoter and whose expression can be easily detected based on qualities
          or functions of the gene.
        meaning: OBI:0000913
      OBI:0000916:
        title: flow cytometry assay
        description: A cytometry assay in which an input cell population is put in
          solution, is passed by a laser, and optical sensors are used to detect scattering
          of the laser light and/or fluorescence of specific markers to count and
          characterize the particles in solution.
        meaning: OBI:0000916
      OBI:0000920:
        title: cytometric bead array assay
        description: An analyte assay in which a series of beads coated with antibodies,
          antigens, or other small molecules are used to detect an analyte of interest.
        meaning: OBI:0000920
      OBI:0000923:
        title: surface plasmon resonance binding assay
        description: A binding assay that uses the detection of electromagnetic waves
          in a surface to detect material entities adsorbed to the surface, which
          change the local optical index of refraction.
        meaning: OBI:0000923
      OBI:0000944:
        title: handedness assay
        description: An assay that measures the unequal distribution of fine motor
          skill between the left and right hands typically in human subjects by means
          of some questionnaire and scoring procedure.
        meaning: OBI:0000944
      OBI:0000957:
        title: self reported handedness assessment
        description: An assay where a person makes a statement that indicates what
          handedness he has from a choice of different categories.
        meaning: OBI:0000957
      OBI:0000964:
        title: in live cell assay
        description: An assay in which a measurement is made by observing entities
          located in a live cell.
        meaning: OBI:0000964
      OBI:0000966:
        title: in live organism assay
        description: An assay in which a measurement is made by observing entities
          located in an organism.
        meaning: OBI:0000966
      OBI:0000975:
        title: cell-cell binding detection by flow cytometry assay
        description: A binding assay which uses a flow cytometer to detect pairs of
          cells that are bound to each other by staining them with different fluorescent
          labels.
        meaning: OBI:0000975
      OBI:0000978:
        title: in container assay
        description: An assay in which a measurement is made by observing entities
          located in a container.
        meaning: OBI:0000978
      OBI:0001001:
        title: Edinburgh handedness assay
        description: An assay that uses a set of questions (the Edinburgh Handedness
          inventory) to generate a score that can be used to assess the dominance
          of a person's right or left hand in everyday activities. The inventory can
          be used by an observer assessing the person, or by a person self-reporting
          hand use. The latter method tends to be less reliable due to a person over-attributing
          tasks to the dominant hand.
        meaning: OBI:0001001
      OBI:0001005:
        title: RNASE CL3 structure mapping assay
        description: A single-nucleotide-resolution ribonucleic acid structure mapping
          assay that determines nucleic acid secondary structure at a nucleotide resolution
          scale using RNAse CL3 as reagent and enzymatic probe.
        meaning: OBI:0001005
      OBI:0001006:
        title: CMCT structure mapping assay
        description: A single-nucleotide-resolution nucleic acid structure mapping
          assay which uses CMCT as reagent and chemical probe to generate data and
          information at nucleotide resolution scale contributing to the determination
          of nucleic acid secondary structure
        meaning: OBI:0001006
      OBI:0001008:
        title: MPE-Fe(II) structure mapping assay
        description: A single-nucleotide-resolution ribonucleic acid structure mapping
          assay that determines nucleic acid secondary structure at the nucleotide
          resolution scale using Fe-MP as reagent and chemical probe.
        meaning: OBI:0001008
      OBI:0001011:
        title: ENU structure mapping assay
        description: A single-nucleotide-resolution nucleic acid structure mapping
          assay that determines the secondary structure of a nucleic acid at the nucleotide
          resolution scale which uses ENU as reagent and chemical probe
        meaning: OBI:0001011
      OBI:0001012:
        title: RNASE V1 structure mapping assay
        description: A single-nucleotide-resolution ribonucleic acid structure mapping
          assay that determines nucleic acid secondary structure at a nucleotide resolution
          scale using RNAse V1 as reagent and enzymatic probe
        meaning: OBI:0001012
      OBI:0001013:
        title: kethoxal structure mapping assay
        description: A single-nucleotide-resolution nucleic acid structure mapping
          assay that determines nucleic acid secondary structure at nucleotide resolution
          scale using kethoxal as reagent and chemical probe
        meaning: OBI:0001013
      OBI:0001014:
        title: single-nucleotide-resolution nucleic acid structure mapping assay using
          enzymatic probing
        description: A single-nucleotide-resolution nucleic acid structure mapping
          assay that determines structural information about the RNA species under
          study using proteins acting as enzymatic probes.
        meaning: OBI:0001014
      OBI:0001015:
        title: DMS structure mapping assay
        description: A single-nucleotide-resolution nucleic acid structure mapping
          assay which determins nucleic acid secondary structure at a nucleotide resolution
          scale using DMS as reagent and chemical probe
        meaning: OBI:0001015
      OBI:0001016:
        title: DNASE 1 structure mapping assay
        description: A single-nucleotide-resolution deoxyribonucleic acid structure
          mapping assay which uses DNAse 1 as reagent and enzymatic probe to generate
          data and information at nucleotide resolution scale contributing to the
          determination of nucleic acid secondary structure
        meaning: OBI:0001016
      OBI:0001017:
        title: single-nucleotide-resolution nucleic acid structure mapping assay using
          chemical probing
        description: A single-nucleotide-resolution nucleic acid structure mapping
          assay that determines structural information about the RNA species under
          study using small chemical compounds acting as chemical probes.
        meaning: OBI:0001017
      OBI:0001018:
        title: Rhodium DNA structure mapping assay
        description: A single-nucleotide-resolution nucleic acid structure mapping
          assay that determines nucleic acid secondary structure at a nucleotide resolution
          scale using Rhodium as reagent and chemical probe.
        meaning: OBI:0001018
      OBI:0001019:
        title: RNA ADA I RNA structure mapping assay
        description: A single-nucleotide-resolution ribonucleic acid structure mapping
          assay that determines nucleic acid secondary structure at a nucleotide resolution
          scale using RNA adenosine deaminase I as reagent and enzymatic probe.
        meaning: OBI:0001019
      OBI:0001020:
        title: Lead structure mapping assay
        description: A single-nucleotide-resolution nucleic acid structure mapping
          assay that determines nucleic acid secondary structure at nucleotide resolution
          scale using lead as reagent and chemical probe
        meaning: OBI:0001020
      OBI:0001021:
        title: RNASE T2 structure mapping assay
        description: A single-nucleotide-resolution ribonucleic acid structure mapping
          assay that determines nucleic acid secondary structure at a nucleotide resolution
          scale using RNAse T2 as reagent and enzymatic probe
        meaning: OBI:0001021
      OBI:0001022:
        title: gene dosage assay
        description: An assay that measures changes in phenotype due to increased
          or decreased dosage of a single allele of a gene.
        meaning: OBI:0001022
      OBI:0001023:
        title: Fe-BABE RNA structure mapping assay
        description: A single-nucleotide-resolution ribonucleic acid structure mapping
          assay that determines nucleic secondary structure at a nucleotide resolution
          scale using Fe-BABE as reagent and chemical probe.
        meaning: OBI:0001023
      OBI:0001024:
        title: RNASE U2 structure mapping assay
        description: A single-nucleotide-resolution ribonucleic acid structure mapping
          assay that determines nucleic acid secondary structure at a nucleotide resolution
          scale using RNAase U2 as reagent and enzymatic probe
        meaning: OBI:0001024
      OBI:0001025:
        title: binding constant determination assay
