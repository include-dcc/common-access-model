        meaning: OBI:0003158
      OBI:0003159:
        title: low-density lipoprotein cholesterol concentration assay
        description: A low-density lipoprotein cholesterol assay that measures the
          concentration of low-density lipoprotein cholesterol in a specimen.
        meaning: OBI:0003159
      OBI:0003160:
        title: lymphocyte percentage assay
        description: A lymphocyte assay that measures the percentage of lymphocytes
