          by T cells
        description: A cytometric bead array assay that detects epitope specific perforin
          release by T cells.
        meaning: OBI:0003293
      OBI:0003294:
        title: modified acid-fast stain microscopy assay
        description: A microscopy assay that uses staining to identify acid-fast organisms
          in a specimen and does not require heating.
        meaning: OBI:0003294
      OBI:0003296:
        title: antibodies from lymphocyte secretions assay
        description: An assay that evaluates a blood specimen for antibodies currently
          being produced by lymphocytes in the specimen, by separating peripheral
          blood mononuclear cells, culturing them, and then collecting the supernatant
          containing the antibodies secreted from those cells.
        meaning: OBI:0003296
      OBI:0003297:
        title: tyramide signal amplification sequencing assay
        description: A DNA sequencing assay that uses tyramide signal amplification
          (TSA) to assess distance of DNA regions to a targeted nuclear compartment
          or protein, typically on a scale of 100-1000 nm.
        meaning: OBI:0003297
      OBI:0003298:
        title: DNA adenine methyltransferase identification assay
        description: An assay for identifying DNA binding sites for a protein by fusing
          it to Dam methylase, and expressing it so that bound DNA gets methylated.
          The methylated DNA can then be isolated and analyzed.
        meaning: OBI:0003298
      OBI:0003299:
        title: DamID-seq
        description: A DNA adenine methyltransferase identification (DamID) assay
          in which DamID-generated DNA fragments undergo high-throughput sequencing
          to determine a protein's DNA-binding site.
        meaning: OBI:0003299
      OBI:0003300:
        title: nucleolus-associated domain sequencing assay
        description: A DNA sequencing assay in which nucleoli are isolated and the
          DNA associated with them is sequenced to identify nucleoli-associating domains.
        meaning: OBI:0003300
      OBI:0003301:
        title: DNase Hi-C assay
        description: A Hi-C assay in which DNase I is used for digesting DNA fragments
          rather than a restriction enzyme, which can result in a higher resolution
          of mapped chromosome contacts.
        meaning: OBI:0003301
      OBI:0003302:
        title: micro-C assay
        description: A Hi-C assay which uses micrococcal nuclease digestion in place
          of the restriction enzyme digestion step.
        meaning: OBI:0003302
      OBI:0003303:
        title: single cell combinatorial indexing Hi-C assay
        description: A Hi-C assay performed on massively multiplexed single-cell samples.
        meaning: OBI:0003303
      OBI:0003304:
        title: single nucleus Hi-C assay
        description: A Hi-C assay performed on isolated nuclei.
        meaning: OBI:0003304
      OBI:0003305:
        title: single cell Hi-C assay
        description: A Hi-C assay performed on a single cell.
        meaning: OBI:0003305
      OBI:0003306:
        title: bulk Hi-C assay
        description: A Hi-C assay in which the sample that is sequenced is derived
          from a collection of cells, such as a tissue sample or entire cell culture,
          and therefore provides results representative of the aggregate of sample
          cells.
        meaning: OBI:0003306
      OBI:0003307:
        title: multi-contact Hi-C assay
        description: A Hi-C assay that assesses interactions between multiple DNA
          fragments rather than only pairwise interactions as in traditional Hi-C.
          The experimental procedure of cross-linking, digestion, and ligation is
          performed similarly to traditional Hi-C, but after DNA is purified a long-read
          library is produced in which many ligated fragments may be contained in
          a single molecule. The library is then sequenced on a long read sequencer.
        meaning: OBI:0003307
      OBI:0003309:
        title: transposase-mediated analysis of chromatin looping assay
        description: A DNA sequencing assay designed to detect interacting genomic
          regions. Rather than the traditional Hi-C approach of digestion and proximity
          ligation, the procedure involves transposase-mediated insertion of an oligonucleotide
          linker between the pair of interacting regions.
        meaning: OBI:0003309
      OBI:0003310:
        title: split-pool recognition of interactions and tag extension assay
        description: A sequencing assay designed to detect multi-way interactions
          between nucleic acids. The procedure involves crosslinking nuclei, and then
          splitting the lysate among wells in a 96-well or other multi-well plate.
          A different barcode is ligated to the fragments in each well, and the lysates
          are pooled together again. This sequence of splitting, tagging, and re-combining
          is repeated several times so that fragments with the same sequences of barcodes
          represent fragments that have co-associated throughout the experiment. Finally,
          a sequencing library is constructed and high-throughput sequencing is performed.
        meaning: OBI:0003310
      OBI:0003311:
        title: DNA split-pool recognition of interactions and tag extension assay
        description: A split-pool recognition of interactions and tag extension (SPRITE)
          assay that only assays interactions between regions of genomic DNA.
        meaning: OBI:0003311
      OBI:0003312:
        title: RNA-DNA split-pool recognition of interactions and tag extension assay
        description: A split-pool recognition of interactions and tag extension (SPRITE)
          assay in which RNA in the cross-linked complexes is converted to cDNA before
          the initial splitting step, allowing analysis of RNA-DNA interactions.
        meaning: OBI:0003312
      OBI:0003313:
        title: genome architecture mapping assay
        description: A DNA sequencing assay designed to analyze 3D chromatin structure
          without relying on digestion and ligation. The procedure involves cryosectioning
          samples in random orientation, and then single nuclear profiles are isolated
          by laser microdissection. Each nuclear profile then undergoes high-throughput
          sequencing, and subsequent analysis can generate a matrix of inferred proximity
          between genomic regions.
        meaning: OBI:0003313
      OBI:0003314:
        title: mapping RNA-genome interactions assay
        description: A nuclear ligation assay for probing RNA-DNA interactions in
          the nucleus. Nuclei are crosslinked, and RNA fragments are ligated to proximal
          DNA fragments via a special linker molecule. After reverse transcription,
          high-throughput sequencing is performed.
        meaning: OBI:0003314
      OBI:0003315:
        title: assay measuring epitope specific amphiregulin production by T cells
        description: A T cell epitope specific cytokine production assay that detects
          amphiregulin production by T cells.
        meaning: OBI:0003315
      OBI:0003316:
        title: ELISA measuring epitope specific amphiregulin production by T cells
        description: An enzyme-linked immunosorbent assay that detects amphiregulin
          production by T cells.
        meaning: OBI:0003316
