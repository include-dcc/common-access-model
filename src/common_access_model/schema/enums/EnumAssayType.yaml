        description: An organism detection assay of mosquito species that is on the
          basis of mosquito survival depending on the salt concentration in the water
          used to lay their eggs to differentiate between morphologically very similar
          species.
        meaning: OBI:0002742
      OBI:0002753:
        title: PRO-cap
        description: Precision nuclear run-on and sequencing to detect Pol II initiation
          sites
        meaning: OBI:0002753
      OBI:0002759:
        title: ribosomal RNA-depleted RNA sequencing assay
        description: A transcription profiling by RNA sequencing assay in which highly
          abundant ribosomal RNAs are removed from total RNA before sequencing, resulting
          in more efficient transcript/gene detection.
        meaning: OBI:0002759
      OBI:0002760:
        title: metatranscriptome profiling assay
        description: A transcription profiling by RNA sequencing assay that determines
          the RNA sequence of microbial transcripts from a microbioal community of
          mixed species from a given microbiome.
        meaning: OBI:0002760
      OBI:0002761:
        title: lipid profiling assay
        description: An analyte assay assay that detects and identifies lipids resulting
          from biochemical and cellular metabolism.
        meaning: OBI:0002761
      OBI:0002762:
        title: single-nucleus ATAC-seq
        description: An ATAC-seq assay in which single nuclei are isolated from frozen
          tissue samples, through a protocol designed to maximally preserve nucleus
          integrity during sample processing and optimize transposase-mediated fragmentation
          of chromatin in individual nuclei.
        meaning: OBI:0002762
      OBI:0002763:
        title: 16s ribosomal gene sequencing assay
        description: An amplicon sequencing assay in which the amplicon is derived
          from universal primers used to amplify the 16S ribosomal RNA gene from isolate
          bacterial genomic DNA or metagenomic DNA from a microbioal community. Resulting
          sequences are compared to reference 16S sequence databases to identify or
          classify bacteria present within a given sample.
        meaning: OBI:0002763
      OBI:0002764:
        title: single-cell ATAC-seq
        description: An ATAC assay designed to robustly map the accessible genome
          of individual cells, using sequencing integrated into a programmable microfluidics
          platform, in order to provide insights into cell-to-cell variation in accessibility
          profiles.
        meaning: OBI:0002764
      OBI:0002765:
        title: microbiome protein expression profiling assay
        description: A protein expression profiling assay of microbial proteins extracted
          from a microbioal community of mixed species from a given microbiome.
        meaning: OBI:0002765
      OBI:0002766:
        title: cytokine assay
        description: An analyte assay to study presence, concentration, or amount
          of cytokines.
        meaning: OBI:0002766
      OBI:0002767:
