      OBI:0002099:
        title: assay measuring the off rate [koff] of a T cell epitope:MHC:TCR complex
        description: A T cell epitope binding constant determination assay that measures
          the off rate.
        meaning: OBI:0002099
      OBI:0002100:
        title: assay measuring the association constant [KA] of a T cell epitope:MHC:TCR
          complex
        description: A T cell epitope binding constant determination assay that measures
          the association constant KA.
        meaning: OBI:0002100
      OBI:0002101:
        title: small-angle scattering assay determining the 3D structure of a B cell
          epitope:antibody complex
        description: A small-angle scattering 3D molecular structure determination
          assay that characterizes the 3-dimensional molecular structure of a B cell
          epitope:antibody complex
        meaning: OBI:0002101
      OBI:0002102:
        title: bio-layer interferometry assay measuring the on rate [kon] of a B cell
          epitope:antibody complex
        description: A bio-layer interferometry assay that measures the on rate of
          an antigen with an antibody.
        meaning: OBI:0002102
      OBI:0002103:
        title: bio-layer interferometry assay measuring the off rate [koff] of a B
          cell epitope:antibody complex
        description: A bio-layer interferometry assay that measures the off rate of
          an antigen with an antibody.
        meaning: OBI:0002103
      OBI:0002104:
        title: bio-layer interferometry assay measuring binding of a B cell epitope:antibody
          complex
        description: A bio-layer interferometry assay that detects the binding of
          an antigen with an antibody.
        meaning: OBI:0002104
      OBI:0002105:
        title: bio-layer interferometry assay measuring the dissociation constant
          [KD] of a B cell epitope:antibody complex
        description: A bio-layer interferometry assay that measures the dissociation
          constant [KD] of an antigen with an antibody.
        meaning: OBI:0002105
      OBI:0002106:
        title: carboxyfluorescein succinimidyl ester staining assay
        description: An assay using carboxyfluorescein succinimidyl ester staining.
        meaning: OBI:0002106
      OBI:0002107:
        title: bio-layer interferometry assay
        description: A binding assay that detects a shift in the interference pattern
          reflected from a layer of immobilized material on the biosensor tip to measure
          binding to- or dissociating from the material on the biosensor.
        meaning: OBI:0002107
      OBI:0002108:
        title: small-angle scattering 3D molecular structure determination assay
        description: A 3D molecular structure determination assay in which the scattering
          pattern of a neutron or x-ray beam targeted at a material entity is recorded
          at small angles relative to the incident beam to determine the size, shape
          and structure of the material entity examined.
        meaning: OBI:0002108
      OBI:0002111:
        title: enhanced cross-linking immunoprecipitation high-throughput sequencing
          assay
        description: An iCLIP assay that is enhanced to robustly identify protein-RNA
          interactions with high efficiency through improvements in library preparation
          of RNA fragments.
        meaning: OBI:0002111
      OBI:0002112:
        title: small RNA sequencing assay
        description: A transcription profiling by RNA sequencing assay which is targeting
          small RNA (< 200 bp) sequences such as, but not exclusive to, miRNAs using,
          for example, small RNA library preparation kits.
        meaning: OBI:0002112
      OBI:0002113:
        title: bromouridine labeling and sequencing assay
        description: A transcription profiling by RNA sequencing assay used to identify
          spans of nascent transcription in the genome through isolation of recent
          bromouridine (Bru) labelled RNAs.
        meaning: OBI:0002113
      OBI:0002114:
        title: bromouridine pulse-chase and sequencing assay
        description: A transcription profiling by RNA sequencing assay used to identify
          RNA populations of specific ages through isolation of RNAs first labelled
          with bromouridine (Bru) followed by chasing in uridine for different periods
          of time.
        meaning: OBI:0002114
      OBI:0002115:
        title: cytometry time of flight assay
        description: A cytometry assay in which the presence of molecules of interest
          on or in cells is indicated by binding of antibodies labeled with rare earth
          element tags which are detected by time-of-flight mass spectrometry.
        meaning: OBI:0002115
      OBI:0002116:
        title: high performance liquid chromatography assay
        description: An analytical chromatography assay that utilizes a high performance
          liquid chromatography instrument for separation of compounts in a solution.
        meaning: OBI:0002116
      OBI:0002117:
        title: whole genome sequencing assay
        description: A DNA sequencing assay that intends to provide information about
          the sequence of an entire genome of an organism.
        meaning: OBI:0002117
      OBI:0002118:
        title: exome sequencing assay
        description: A DNA sequencing assay that intends to provide information about
          the sequence of the protein coding components of a genome (exons).
        meaning: OBI:0002118
      OBI:0002119:
        title: microscopy assay
        description: An imaging assay that utilizes a microscope to magnify features
          of the visualized material of interest that are not visible to naked eye.
        meaning: OBI:0002119
      OBI:0002120:
        title: mixed lymphocyte reaction assay
        description: A cytometry assay where lymphocytes from two individuals are
          co-cultured with the lymphocytes from one of the allogeneic individuals
          (Responders) being labeled (with 3H Thymidine or BrdU) and the proliferation
          of the labeled cells is measured, which is thought to reflect recognition
          of histocompatibility antigens on the unlabeled cells (stimulators).
        meaning: OBI:0002120
      OBI:0002121:
        title: killer cell immunoglobulin-like receptor typing assay
        description: A genotyping assay in which the alleles of genes encoding for
          killer cell immunoglobulin-like receptors are determined.
        meaning: OBI:0002121
      OBI:0002122:
        title: major histocompatibility typing assay
        description: A genotyping assay in which the alleles of genes encoding for
          major histocompatibility complex molecules are determined.
        meaning: OBI:0002122
      OBI:0002132:
        title: pulse stable isotope labeling by amino acids in cell culture
        description: An assay that detects differences in protein abundance using
          samples that have been metabolically labeled in vivo with a stable non-radioactive
          heavy isotope containing amino acid for a short period of time. After diluting
          the pulsed cells into growth media without label, high resolution mass spectrometry-based
          proteomics is used to analyze the time-dependent decay and determine protein
          stability.
        meaning: OBI:0002132
      OBI:0002133:
        title: cytometric bead array assay measuring  epitope specific chemokine (C-C
          motif) ligand 20 production by T cells
        description: A cytometric bead array assay that detects chemokine (C-C motif)
          ligand 20 production by T cells.
        meaning: OBI:0002133
      OBI:0002134:
        title: assay measuring epitope specific chemokine (C-C motif) ligand 20 production
          by T cells
        description: A T cell epitope specific cytokine production assay that detects
          chemokine (C-C motif) ligand 20 production by T cells.
        meaning: OBI:0002134
      OBI:0002140:
        title: temperature measurement assay
        description: An assay to determine the temperature of an evaluant.
        meaning: OBI:0002140
      OBI:0002141:
        title: volume measurement assay
        description: An assay to determine the volume of an evaluant.
        meaning: OBI:0002141
      OBI:0002142:
        title: Nanostring nCounter miRNA expression assay
        description: A microRNA profiling assay using digital molecular barcoding
          technology to quantify target microRNA molecules without the need for amplification.
        meaning: OBI:0002142
      OBI:0002143:
        title: bromouride labeling and sequencing after UV exposure
        description: A transcription profiling by RNA sequencing assay used to identify
          transcription start sites and active enhancer elements through isolation
          of bromouridine (Bru) labelled RNAs after UV light exposure introduces transcription-blocking
          lesions.
        meaning: OBI:0002143
      OBI:0002144:
        title: extrachromosomal circular DNA sequencing assay
        description: An assay which aims at identifying the endogenous population
          of extrachromosomal circular DNA originating from a subset of genomic loci
          and potentially having profound consequences on the regulatory and coding
          capabilities of these regions. The assay includes creation of a library
          out of the circular DNA molecules and subsequent sequencing using parallelized
          sequencing methods.
        meaning: OBI:0002144
      OBI:0002145:
        title: antigen specific antibodies assay
        description: An analyte assay that measures the presence or amount of antibodies
          to a specified antigen.
        meaning: OBI:0002145
      OBI:0002146:
        title: HIV antibody assay
        description: An antigen specific antibodies assay that is meant to detect
          antibodies that bind to human immunodeficiency virus (HIV) antigens.
        meaning: OBI:0002146
      OBI:0002147:
        title: HIV group O antibody assay
        description: An antigen specific antibodies assay that is meant to detect
          antibodies that bind to human immunodeficiency virus (HIV) group O antigens.
        meaning: OBI:0002147
      OBI:0002148:
        title: surface HBV antibody assay
        description: An antigen specific antibodies assay that is meant to detect
          antibodies that bind to hepatitis B virus (HBV) surface antigens.
        meaning: OBI:0002148
      OBI:0002149:
        title: core HBV antibody assay
        description: An antigen specific antibodies assay that is meant to detect
          antibodies that bind to hepatitis B virus (HBV) core antigens.
        meaning: OBI:0002149
      OBI:0002150:
        title: core HBV IgM antibody assay
        description: An antigen specific antibodies assay that is meant to detectimmunoglobulin
          M (IgM) antibodies that bind to hepatitis B virus (HBV) core antigens.
        meaning: OBI:0002150
      OBI:0002151:
        title: HCV antibody assay
        description: An antigen specific antibodies assay that is meant to detect
          antibodies that bind to Hepacivirus C (HCV) antigens.
        meaning: OBI:0002151
      OBI:0002152:
        title: EBV IgG antibody assay
        description: An antigen specific antibodies assay that is meant to detect
          immunoglobulin G (IgG) antibodies that bind to Epstein-Barr virus (EBV)
          antigens.
        meaning: OBI:0002152
      OBI:0002153:
        title: EBV IgM antibody assay
        description: An antigen specific antibodies assay that is meant to detect
          immunoglobulin M (IgM) antibodies that bind to Epstein-Barr virus (EBV)
          antigens.
        meaning: OBI:0002153
      OBI:0002154:
        title: CMV antibody assay
        description: An antigen specific antibodies assay that is meant to detect
          antibodies that bind to cytomegalovirus (CMV) antigens.
        meaning: OBI:0002154
      OBI:0002155:
        title: venereal disease research laboratory test
        description: An analyte assay that is meant to detect general antibodies that
          react with substances that are produced by cellular damage caused by Treponema
          pallidum indicating a syphilis infection. VDRL tests require a microscope
          and can be done on cerebrospinal fluid as well as blood.
        meaning: OBI:0002155
      OBI:0002156:
        title: rapid plasma reagin test
        description: An analyte assay that is meant to detect with the aid of carbon
          or charcoal particles general antibodies that react with substances that
          are produced by cellular damage caused by Treponema pallidum indicating
          a syphilis infection. RPR tests can be done without a microscope.
        meaning: OBI:0002156
      OBI:0002157:
        title: HBV surface antigen assay
        description: An analyte assay that is meant to detect hepatitis B virus (HBV)
          surface antigens.
        meaning: OBI:0002157
      OBI:0002158:
        title: HIV-1 nucleic acid testing
        description: An analyte assay that is meant to detect human immunodeficiency
          virus (HIV-1) nucleic acids.
        meaning: OBI:0002158
      OBI:0002159:
        title: HCV nucleic acid testing
        description: An analyte assay that is meant to detect hepatitis C virus (HCV)
          nucleic acids.
        meaning: OBI:0002159
      OBI:0002160:
        title: multiplexed indexed T7 ChIP-seq assay
        description: A ChIP-seq assay which leverages T7 promoter amplification to
          allow low sample input and chromatin barcoding and pool-and-split multiplexing
          for high-throughput, quantitative profiling of chromatin states.
        meaning: OBI:0002160
      OBI:0002161:
        title: systematic evolution of ligands by exponential enrichment assay
        description: A binding assay that identifies protein-binding sites on nucleic
          acids by selecting high-affinity target ligands from a randomized pool.
          The process is repeated in rounds, then the bound nucleic acids are separated
          from the unbound nucleic acids and amplified by PCR._
        meaning: OBI:0002161
      OBI:0002162:
        title: footprinting assay
        description: An assay that measures ligand binding and conformational changes
          by the solvent accessibility of the backbone, bases, or side-chain structures
          of macromolecules through their sensitivity to chemical or enzymatic cleavage
          or modification reactions.
        meaning: OBI:0002162
      OBI:0002163:
        title: DNAse footprinting assay
        description: An enzymatic footprinting assay that determines protein-binding
          sites on DNA by identifying bound fragments that are protected from DNAse
          I-catalyzed hydrolysis
        meaning: OBI:0002163
      OBI:0002164:
        title: mammalian 2-hybrid assay
        description: A binding assay that increases the expression of a reporter gene
          in mammalian cells by proteins of interest attached to two portions of the
          transcriptional activator, bringing those portions closer together.
        meaning: OBI:0002164
      OBI:0002165:
        title: protein localization assay
        description: An assay that determines the specific location of a protein.
          Subcellular localization is distinguished from tissue-based localization
          based on the type of microscopy applied.
        meaning: OBI:0002165
      OBI:0002166:
        title: tissue-based protein localization assay
        description: A protein localization assay that determines the specific location
          of a protein in a living tissue sample.
        meaning: OBI:0002166
      OBI:0002167:
        title: subcellular protein localization assay
        description: A protein localization assay that determines the specific subcellular
          location of a protein. The location is visualized through electron microscopy.
        meaning: OBI:0002167
      OBI:0002168:
        title: subcellular protein immunohistochemistry assay
        description: An immunohistochemistry assay that uses antibodies to display
          the specific subcellular location of proteins.
        meaning: OBI:0002168
      OBI:0002169:
        title: ChIP-qPCR assay
        description: A ChIP assay that uses quantitative PCR to determine levels of
          specific DNA in immunoprecipitated samples.
        meaning: OBI:0002169
      OBI:0002170:
        title: genomic SELEX
        description: A systematic evolution of ligands by exponential enrichment assay
          that starts with a library derived from genomic DNA instead of synthetically
          derived random DNA molecules.
        meaning: OBI:0002170
      OBI:0002171:
        title: dot blot assay
        description: An analyte assay that detects molecules in a mixture dotted on
          a membrane using DNA probes or antibodies.
        meaning: OBI:0002171
      OBI:0002172:
        title: Northwestern blot assay
        description: A direct binding assay that detects interactions of labeled RNA
          with immobilized protein on a membrane.
        meaning: OBI:0002172
      OBI:0002173:
        title: Southwestern blot assay
        description: A direct binding assay that detects interactions of labeled DNA
          with immobilized protein on a membrane.
        meaning: OBI:0002173
      OBI:0002174:
        title: immunocytochemistry
        description: An immuno staining assay in which samples of intact cells are
          examined that have had most, if not all, of their surrounding extracellular
          matrix removed
        meaning: OBI:0002174
      OBI:0002175:
        title: ATP bioluminescence assay
        description: An analyte assay that detects ATP concentration through light
          intensity when luciferase catalyzes the oxidation of luciferin in the presence
          of ATP, magnesium ions, and molecular oxygen.
        meaning: OBI:0002175
      OBI:0002176:
        title: electrophysiology assay
        description: An assay that measures the electrical properties of biological
          cells or tissues. Typically, this assay will generate measurements of voltage
          changes or electric current (or other associated variables such as impedence
          or capacitance).
        meaning: OBI:0002176
      OBI:0002177:
        title: patch clamp assay
        description: An intracellular electrophysiology assay where a glass micropipette
          is sealed to the surface of the cell membrane as a recording electrode to
          study ion channel activity. The key distinction of this technique is the
          electrical resistance of the seal between the cell membrane and the pipette
          is of the order 10-100 gigaohms, permitting high-resolution current measurements
          over the cell membrane in several different standard configurations.
        meaning: OBI:0002177
      OBI:0002178:
        title: whole-cell patch clamp assay
        description: A patch-clamp assay where the electrode is left in place on the
          cell, as in cell-attached recordings, but the membrane patch has been perforated,
          providing access from the interior of the pipette to the intracellular space
          of the cell. Measurements made with this technique involve recording currents
          through multiple channels simultaneously, over the membrane of the entire
          cell.
        meaning: OBI:0002178
      OBI:0002179:
        title: cell-attached patch clamp assay
        description: A patch-clamp assay where the electrode is left in place on the
          cell, and the membrane patch has been left intact been perforated. This
          maintains the separation of the interior of the pipette to the intracellular
          space of the cell. Measurements made with this technique involve recording
          currents through multiple channels simultaneously, over the membrane of
          the entire cell.
        meaning: OBI:0002179
      OBI:0002180:
        title: inside-out patch clamp assay
        description: A patch-clamp assay where a patch of the membrane is attached
          to the patch pipette, detached from the rest of the cell, and the cytosolic
          surface of the membrane is exposed to the external media, or bath. This
          provides the experimenter has access to the intracellular surface of the
          membrane via the bath and can manipulate the environment at the intracellular
          surface of single ion channels. For example, channels that are activated
          by intracellular ligands can then be studied through a range of ligand concentrations.
        meaning: OBI:0002180
      OBI:0002181:
        title: outside-out patch clamp assay
        description: A patch-clamp assay where a patch of the membrane is attached
          to the patch pipette. In this configuration, the external surface of the
          cell membrane is exposed as the outside of the membrane patch relative to
          the patch electrode. An outside-out patch starts with a gigaohm seal in
          a whole-cell recording configuration. The electrode is slowly withdrawn
          from the cell, until a fragment of membrane bulges away from the cell, which
          detaches and reforms as a convex membrane on the end of the electrode, with
          the original external surface of the membrane facing outward from the electrode.
          This provides the experimenter with access to the extracellular surface
          of the membrane via the bath and can manipulate the environment at the extracellular
          surface of single ion channels.
        meaning: OBI:0002181
      OBI:0002182:
        title: voltage clamp assay
        description: An cellular electrophysiology assay where the membrane potential
          of a cell is controlled by the experimentalist. This is accomplished through
          a feedback mechanism where any change in membrane potential is countered
          by permitting electrical current to flow into or out of the cell.
        meaning: OBI:0002182
      OBI:0002183:
        title: two electrode voltage clamp assay
        description: The two electrode voltage clamp (TEVC) method utilizes two low-resistance
          pipettes, one sensing voltage and the other injecting current. The microelectrodes
          are filled with conductive solution and inserted into the cell to artificially
          control membrane potential. The membrane acts as a dielectric as well as
          a resistor, while the fluids on either side of the membrane function as
          capacitors.[9] The microelectrodes compare the membrane potential against
          a command voltage, giving an accurate reproduction of the currents flowing
          across the membrane. Current readings can be used to analyze the electrical
          response of the cell to different applications. This technique is mainly
          used in the Oocyte preparation.
        meaning: OBI:0002183
      OBI:0002184:
        title: cut open oocyte voltage clamp assay
        description: The cut-open oocyte Vaseline gap (COVG) voltage-clamp technique
          is designed to solve weaknesses in the two elextrode voltage clamp by maximizing
          the benefits of the Xenopus oocyte expression system by improving on clamp
          speed, signal-to-noise ratio, and ability to effectively perfuse the oocyte.
          In this way, it was possible to combine the most popular transient expression
          system, and the associated benefits of molecular cloning and site-directed
          mutagenesis, with the superior voltage-clamp properties of cut-open cell
          techniques.
        meaning: OBI:0002184
      OBI:0002185:
        title: current clamp assay
        description: The current clamp technique records the membrane potential by
          injecting current into a cell through the recording electrode. Unlike in
          the voltage clamp mode, where the membrane potential is held at a level
          determined by the experimenter, in "current clamp" mode the membrane potential
          is free to vary, and the amplifier records whatever voltage the cell generates
          on its own or as a result of stimulation. This technique is used to study
          how a cell responds when electric current enters a cell; this is important
          for instance for understanding how neurons respond to neurotransmitters
          that act by opening membrane ion channels.
        meaning: OBI:0002185
      OBI:0002186:
        title: electroencephalography
        description: An extracellular electrophysiology assay where electrodes are
          mounted outside the brain (either on the surface of the scalp on onto the
          brain surface itself during surgery) to measure the electrical field over
          the external surface.
        meaning: OBI:0002186
      OBI:0002187:
        title: single-unit recording
        description: An extracellular electrophysiology assay where a single microelectrode
          is placed in close proximity to a single neuron to measure voltage and current
          changes over time. This is the technicque used by Hubel and Wiesel to measure
          firing properties of primary visual cortex neurons in the 1950s in their
          original Nobel-prize winning study. A classic, old technique.
        meaning: OBI:0002187
      OBI:0002188:
        title: multi-unit recording
        description: An extracellular electrophysiology assay where a collection of
          microelectrodes (often in an 'array' configuration) is placed into neural
          tissue to measure the distribution of voltage and current changes for a
          population of cells over time.
        meaning: OBI:0002188
      OBI:0002189:
        title: local field potential recording
        description: An extracellular electrophysiology assay where a microelectrode
          is placed in the extracellular space of brain tissue to measure action potential
          and compared to an electrode either outside or inside that tissue.
        meaning: OBI:0002189
      OBI:0002436:
        title: RNA interactome capture
        description: An assay that identifies RNA binding proteins by cross-linking
          RNA and proteins with UV light, then purifying the bound complexes by oligo(dT)
          capture. Finally, the complexes are analyzed by mass spectrometry.
        meaning: OBI:0002436
      OBI:0002437:
        title: widefield microscopy assay
        description: A fluorescence microscopy technique where the specimen under
          investigation is fully bathed in light, as opposed to confocal microscopy
          in which only a small portion of the specimen is illuminated.
        meaning: OBI:0002437
      OBI:0002438:
        title: nuclear ligation assay
        description: An assay that detects the proximity of chromosomal DNA through
          the use of a ligation reaction in isolated nuclei.
        meaning: OBI:0002438
      OBI:0002439:
        title: chromosome conformation capture assay
        description: A nuclear ligation assay that detects chromosomal interactions
          between any two genomic loci. Chromatin segments are cross-linked, cut by
          restriction enzymes, ligated, and finally analyzed by PCR.
        meaning: OBI:0002439
      OBI:0002440:
        title: Hi-C assay
        description: A chromosome conformation capture assay that detects genome-wide
          chromosomal interactions. High-throughput techniques are used to sequence
          the ligated fragments after cross-linking and cutting with restriction enzymes.
        meaning: OBI:0002440
      OBI:0002441:
        title: physical examination of an organism
        description: An assay that produces a description of the qualities of an organism
          that has not been transformed, through observation and physical, non-invasive
          techniques.
        meaning: OBI:0002441
      OBI:0002442:
        title: hydroxyl-radical footprinting assay
        description: A footprinting assay that uses the reaction of hydroxyl radicals
          with side-chain sites in molecules (proteins, DNA, etc)_ with the resultant
          mass shift demonstrating the site of modification, used to_ to asses the
          accessibility of that site.
        meaning: OBI:0002442
      OBI:0002443:
        title: methidiumpropyl-EDTA-iron(II) footprinting assay
        description: A footprinting assay that determines protein-binding sites on
          DNA by partial cleavage of ligand-protected DNA restriction fragments with
          methidium-propyl-EDTA (MPE). MPE-Fe(II) in the presence of oxygen efficiently
          catalyzes the non-specific clevage of DNA.
        meaning: OBI:0002443
      OBI:0002445:
        title: transcription start site mapping by primer extension assay
        description: A transcription profiling assay in which the transcription start
          site for a gene is determined by identifying the 5' end of mRNA. A radio-labeled
          primer is annealed to a complementary mRNA sequence near the 3' end, then
          cDNA is synthesized until the 5' end is reached.
        meaning: OBI:0002445
      OBI:0002449:
        title: footprinting assay measuring binding of a B cell epitope:antibody complex
        description: A footprinting assay that detects the binding of an antigen with
          an antibody.
        meaning: OBI:0002449
      OBI:0002450:
        title: hydroxyl-radical footprinting assay measuring binding of a B cell epitope:antibody
          complex
        description: A hydroxyl-radical footprinting assay that detects the binding
          of an antigen with an antibody.
        meaning: OBI:0002450
      OBI:0002451:
        title: ELISA measuring epitope specific interferon-alpha production by T cells
        description: An enzyme-linked immunosorbent assay that detects interferon-alpha
          production by T cells.
        meaning: OBI:0002451
      OBI:0002452:
        title: assay measuring epitope specific interferon-alpha production by T cells
        description: A T cell epitope specific cytokine production assay that detects
          interferon-alpha production by T cells.
        meaning: OBI:0002452
      OBI:0002457:
        title: precision nuclear run-on sequencing assay
        description: A transcription profiling by RNA sequencing assay that maps the
          genome-wide distribution of transcriptionally-engaged Pol II at base-pair
          resolution by using biotin-labeled ribonucleotide triphosphate analogs (biotin-NTP)
          for nuclear run-on reactions, allowing the efficient affinity purification
          of nascent RNAs for high throughput sequencing from their 3' ends.
        meaning: OBI:0002457
      OBI:0002458:
        title: chromosome conformation capture-on-chip assay
        description: A nuclear ligation assay which uses cross-linking of proteins
          to proteins and DNA, followed by two rounds of digestion and ligation, inverse
          PCR, and characterization by microarray or DNA sequencing. This enables
          unbiased genome-wide screens for DNA contacts made by single genomic sites
          of interest.
        meaning: OBI:0002458
      OBI:0002459:
        title: genotype phasing by Hi-C assay
        description: A genotyping assay in which carbon-copy chromosome conformation
          is used to detect polymorphism in DNA samples.
        meaning: OBI:0002459
      OBI:0002485:
        title: transcript analysis by single-end sequencing assay
        description: A sequencing assay that incorporates single-end reads and sequencing
          technology to determine transcripts, gene structures, and gene expressions.
        meaning: OBI:0002485
      OBI:0002489:
        title: differential medium assay
        description: An organism detection assay that uses a differential medium to
          achieve its objective.
        meaning: OBI:0002489
      OBI:0002564:
        title: histopathology assay
        description: A histological assay that is intended to check for the presence
          or level of a specific disease.
        meaning: OBI:0002564
      OBI:0002571:
        title: polyA-selected RNA sequencing assay
        description: A transcription profiling by RNA sequencing assay to study transcriptomes
          through the enrichment of polyadenylated transcripts or removal of ribosomal
          RNA prior to high-throughput sequencing.
        meaning: OBI:0002571
      OBI:0002572:
        title: polyA-depleted RNA sequencing assay
        description: A transcription profiling by RNA sequencing assay to study non-polyadenylated
          transcripts, such as, but not exclusive to unspliced and circular isoforms,
          through the depletion of polyadenylated transcripts prior to high-throughput
          sequencing.
        meaning: OBI:0002572
      OBI:0002575:
        title: isoform sequencing
        description: A transcription profiling by RNA sequencing assay for sequencing
          isoforms by enriching a cDNA library for full-length reads spanning entire
          transcript isoforms.
        meaning: OBI:0002575
      OBI:0002597:
        title: chromosome conformation capture sequencing assay
        description: A chromosome conformation capture-on-chip assay quantitates the
          products with multiplexed high-throughput sequencing.
        meaning: OBI:0002597
      OBI:0002621:
        title: reconstitution assay
        description: An assay in which a cellular process is replicated from the bottom-up
          using isolated components in order to observe how the components work together.
        meaning: OBI:0002621
      OBI:0002622:
        title: in vitro transcription reconstitution assay
        description: A reconstitution assay in which RNA synthesis is investigated
          using RNA polymerase II transcription systems replicated in vitro from their
          base components.
        meaning: OBI:0002622
      OBI:0002623:
        title: whole metagenome sequencing assay
        description: A DNA sequencing assay that intends to provide information on
          the DNA sequences of multiple genomes (a metagenome) from different organisms
          present in the same input sample.
        meaning: OBI:0002623
      OBI:0002628:
        title: RNAi knockdown assay
        description: A gene knockdown assay in which RNAi gene knockdown is used to
          disrupt gene transcripts.
        meaning: OBI:0002628
      OBI:0002629:
        title: direct RNA sequencing assay
        description: An assay to study transcription through direct RNA sequence determination,
