          of specific peptide epitopes of circumsporozoite (CS) protein of the most
          important Plasmodium falciparum and two strains (variants 210 and 247) of
          the more widespread Plasmodium vivax using a dipstick wicking test strip.
        meaning: OBI:0002729
      OBI:0002730:
