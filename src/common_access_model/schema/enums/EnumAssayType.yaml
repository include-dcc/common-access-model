        description: A B cell epitope assay that measures the binding of an antibody
          receptor to an epitope using a high throughput multiplexed assay.
        meaning: OBI:0003323
      OBI:0003324:
        title: high throughput multiplexed assay measuring binding of a T cell epitope:MHC:TCR
          complex
        description: A T cell epitope assay that measures the binding of T cell receptor
          to an epitope using a high throughput multiplexed assay.
        meaning: OBI:0003324
      OBI:0003325:
        title: high throughput multiplexed assay measuring binding of a MHC:ligand
          complex
        description: A MHC ligand assay that detects the binding of a ligand to an
          MHC molecule using a high throughput multiplexed assay.
        meaning: OBI:0003325
      OBI:0003326:
        title: high throughput multiplexed assay measuring MHC ligand processing and
          presentation
        description: A MHC ligand assay that determines what ligands are processed
          and loaded onto MHC molecules by eluting ligands and identifying them using
          a high throughput multiplexed assay.
        meaning: OBI:0003326
      OBI:0003368:
        title: detection technique
        description: An assay (A) that is part of another assay (B), where the target
          entities of A and B are disjoint, and the target entity of A is a proxy
          for the target of assay B.
        meaning: OBI:0003368
      OBI:0003372:
        title: assay measuring epitope specific lymphotactin production by T cells
        description: A T cell epitope specific cytokine production assay that detects
          lymphotactin production by T cells.
        meaning: OBI:0003372
      OBI:0003373:
        title: ELISA measuring epitope specific lymphotactin production by T cells
        description: An enzyme-linked immunosorbent assay that detects lymphotactin
          production by T cells.
        meaning: OBI:0003373
      OBI:0003375:
        title: patch-seq assay
        description: An assay that combines electrophysiological, transcriptomic,
          and morphological characterization of individual neurons. In this approach,
          patch-clamp is used to generate an electrophysiological recording of the
          neuron, then the neuron's cytoplasm and/or nucleus is collected and processed
          for RNAseq, and finally the cell is simultaneously filled with a dye that
          allows for subsequent morphological reconstruction.
        meaning: OBI:0003375
      OBI:0003376:
        title: droplet-based single-cell RNA sequencing assay
        description: 'A single-cell transcription profiling by RNA sequencing assay
          that analyzes mRNA transcripts from droplets of individual cells. The process
          involves the following steps: (1) prepare a single-cell suspension from
          a tissue; (2) co-encapsulate each cell with a distinctly barcoded microparticle
          (bead) in a nanoliter-scale droplet; (3) lyse cells after they have been
          isolated in droplets; (4) capture a cell’s mRNAs on its companion microparticle,
          forming STAMPs (single-cell transcriptomes attached to microparticles);
          (5) reverse-transcribe, amplify, and sequence.'
        meaning: OBI:0003376
      OBI:0003377:
        title: single-nucleus chromatin accessibility and mRNA expression sequencing
          2 assay
        description: An assay that uses combinatorial indexing to generate a library
          of cDNA and open chromatin gDNA fragments by tagmenting a single nuclei
          and open chromatin, and encapsulating those in a droplet including both
          an oligo-dT-containing barcoded bead and a splint oligonucleotide, which
          links the tagmented gDNA fragments to the bead which capture both mRNAs
          and open chromatin fragments.
        meaning: OBI:0003377
      OBI:0003378:
        title: switching mechanism at the 5' end of RNA template sequencing assay
        description: A single cell transcription profiling by RNA sequencing assay
          wherein cells are lysed and their recovered RNA is hybridized to an oligo(dT)
          that primes a reverse transcription reaction, the outcome of which are cDNA’s
          that have PCR handles on both ends. The cDNA's are then amplified using
          PCR, and the products are sequenced.
        meaning: OBI:0003378
      OBI:0003379:
        title: switching mechanism at the 5' end of RNA template sequencing 2 assay
        description: A single cell transcription profiling by RNA sequencing assay
          that is a variation on the switching mechanism at the 5' end of RNA template
          sequencing assay (SMARTseq) that allows the generation of full-length cDNA
          and sequencing libraries by using standard reagents.
        meaning: OBI:0003379
      OBI:0003381:
        title: placental blood microbiology assay
        description: A blood microbiology assay that detects microorganisms in a placental
          blood specimen.
        meaning: OBI:0003381
      OBI:0003412:
        title: linked-read sequencing assay
        description: A DNA sequencing assay that uses microfluidics to partition and
          barcode high molecular weight DNA such that short reads derived from fragments
          of the large piece of DNA can be assembled within the context of the high
          molecular weight piece of DNA they are derived from, facilitating the use
          of short read data to sequence and assemble large genomes.
        meaning: OBI:0003412
      OBI:0003418:
