        meaning: OBI:0003017
      OBI:0003018:
        title: hematocrit assay
        description: A cytometry assay that measures the proportion of red blood cells
        meaning: OBI:0003018
      OBI:0003019:
        title: promyelocyte assay
        description: A cytometry assay that measures the abundance and/or characteristics
          of promyelocytes
        meaning: OBI:0003019
      OBI:0003021:
        title: basophil assay
        description: A cytometry assay that measures the abundance and/or characteristics
          of basophils
        meaning: OBI:0003021
      OBI:0003022:
        title: neutrophil assay
        description: A cytometry assay that measures the abundance and/or characteristics
          of neutrophils
        meaning: OBI:0003022
      OBI:0003023:
        title: eosinophil assay
        description: A cytometry assay that measures the abundance and/or characteristics
          of eosinophils
        meaning: OBI:0003023
      OBI:0003024:
        title: lymphocyte assay
        description: A cytometry assay that measures the abundance and/or characteristics
          of lymphocytes
        meaning: OBI:0003024
      OBI:0003025:
        title: monocyte assay
        description: A cytometry assay that measures the abundance and/or characteristics
          of monocytes
        meaning: OBI:0003025
      OBI:0003026:
        title: reticulocyte assay
        description: A cytometry assay that measures the abundance and/or characteristics
          of reticulocytes
        meaning: OBI:0003026
      OBI:0003027:
        title: macrophage assay
        description: A cytometry assay that measures the abundance and/or characteristics
          of macrophages
        meaning: OBI:0003027
      OBI:0003028:
        title: platelet assay
        description: A cytometry assay that measures the abundance and/or characteristics
          of platelets
        meaning: OBI:0003028
      OBI:0003031:
        title: fluorogenic PCR assay
        description: A polymerase chain reaction assay that uses target specific probes
          labeled with fluorogenic chromophores.
        meaning: OBI:0003031
      OBI:0003032:
        title: genotyping by PCR assay
        description: A genotyping assay that uses polymerase chain reaction.
        meaning: OBI:0003032
      OBI:0003033:
        title: cleavage under targets and release using nuclease assay
        description: A type of DNA sequencing assay employing in situ chromatin profiling
          in which antibody-targeted controlled cleavage by micrococcal nuclease releases
          specific protein-DNA complexes into the the supernatant for sequencing.
        meaning: OBI:0003033
      OBI:0003034:
        title: cleavage under targets and tagmentation
        description: A type of DNA sequencing assay employing in situ chromatin profiling
          in which a chromatin protein is bound in situ by a specific antibody, which
          then tethers to a protein A-Tn5 hyperactive transposase fusion protein (pA-Tn5)
          loaded with sequence adapters. Activation of pA-Tn5 results in factor-targeted
          tagmentation, generating fragments ready for PCR enrichment and DNA sequencing.
        meaning: OBI:0003034
      OBI:0003035:
        title: coma severity assay
        description: A physical examination of an organism that has the objective
          to determine the severity of coma in a patient.
        meaning: OBI:0003035
      OBI:0003036:
        title: Plasmodium gametocyte detection assay
        description: An assay that detects Plasmodium gametocytes in a specimen.
        meaning: OBI:0003036
      OBI:0003037:
        title: malaria rapid diagnosis assay
        description: An assay that is quick and easy in the diagnosis of malaria by
          detecting evidence of malaria parasites (antigens) in human blood.
        meaning: OBI:0003037
      OBI:0003038:
        title: parasite detection assay
        description: An assay that detects parasite in a specimen.
        meaning: OBI:0003038
      OBI:0003039:
        title: feces microbiology assay
        description: An organism detection assay that detects microorganisms in a
          feces specimen.
        meaning: OBI:0003039
      OBI:0003040:
        title: blood assay
        description: An assay that has a blood specimen as evaulant.
        meaning: OBI:0003040
      OBI:0003041:
        title: falcivax rapid diagnostic test
        description: A parasite detection assay that can quickly establish the diagnosis
          of P. falciparum or P. vivax malaria infection by detecting the antigens
          in a person's blood.
        meaning: OBI:0003041
      OBI:0003042:
        title: optimal-IT rapid diagnostic test
        description: A parasite detection assay that is rapid, sensitive, and able
          to differentiate between P. falciparum and other malaria parasites.
        meaning: OBI:0003042
      OBI:0003043:
        title: urine assay
        description: An assay that has a urine specimen as evaluant.
        meaning: OBI:0003043
      OBI:0003044:
        title: parasite species identification by PCR assay
        description: A parasite detection by PCR assay that identifies the species
          of parasite.
        meaning: OBI:0003044
      OBI:0003045:
        title: parasite detection by PCR assay
        description: A parasite detection assay that uses PCR.
        meaning: OBI:0003045
      OBI:0003080:
        title: organismal body temperature measurement assay
        description: An assay that detects body temperature of an organism.
        meaning: OBI:0003080
      OBI:0003087:
        title: autofluorescence assay
        description: A fluorescence detection assay in which the light that is naturally
          emitted by a sample is visualized after excitation of the sample with light
          at a suitable wavelength.
        meaning: OBI:0003087
      OBI:0003088:
        title: autofluorescence microscopy assay
        description: An autofluorescence assay in which the light that is naturally
          emitted by a sample is visualized via microscopy after excitation of the
          sample with light at a suitable wavelength.
        meaning: OBI:0003088
      OBI:0003089:
        title: bulk assay for transposase-accessible chromatin using sequencing
        description: An assay for transposase-accessible chromatin using sequencing
          in which the sample that is sequenced is derived from a collection of cells,
          such as a tissue sample or entire cell culture, and therefore provides results
          representative of the aggregate of sample cells.
        meaning: OBI:0003089
      OBI:0003090:
        title: bulk RNA-seq assay
        description: A transcription profiling by RNA sequencing assay in which the
          sample that is sequenced is derived from a collection of cells, such as
          a tissue sample or entire cell culture, and therefore provides results representative
          of the aggregate of sample cells.
        meaning: OBI:0003090
      OBI:0003091:
        title: multiplexed fluorescent antibody imaging assay
        description: An imaging assay in which multiple cycles consisting of fluorescent
          labeling, imaging, and fluorophor deactivation are used to detect multiple
          proteins and their locations in a given sample of tissues or cells.
        meaning: OBI:0003091
      OBI:0003092:
        title: Cell DIVE multiplexed imaging assay
        description: A multiplexed fluorescent antibody imaging assay that involves
          an iterative staining, imaging and dye inactivation workflow for over 60
          biomarkers on a single fixed tissue section.
        meaning: OBI:0003092
      OBI:0003093:
        title: co-detection by indexing assay
        description: A multiplexed fluorescent antibody imaging assay that involves
          a highly multiplexed analysis of up to 40 proteins in a tissue using cyclic
          detection of DNA-indexed antibody panels.
        meaning: OBI:0003093
      OBI:0003094:
        title: fluorescence in-situ hybridization assay
        description: An in-situ hybridization assay in which fluorescently labeled
          molecules are used to localize specific DNA or RNA sequences.
        meaning: OBI:0003094
      OBI:0003095:
        title: decoding amplified targeted transcripts with fluorescence in situ hybridization
          assay
        description: A fluorescence in-situ hybridization assay which involves multiplex
          in situ digital quantification of targeted RNA transcripts in fresh or frozen
          tissue providing an understanding of the spatial organization of different
          cell types.
        meaning: OBI:0003095
      OBI:0003096:
        title: imaging mass cytometry assay
        description: A cytometry time of flight assay in which molecules of interest
          on or in cells are imaged through a system in which samples are labeled
          with multiple different rare-earth tagged antibodies. The sample is then
          ablated with a laser and the labeled material is detected by cytometry time
          of flight mass spectrometry.
        meaning: OBI:0003096
      OBI:0003097:
        title: liquid chromatography mass spectrometry assay
        description: A mass spectrometry assay where a sample mixture is first separated
          by liquid chromatography before being converted into ions which are characterized
          by using mass spectrometry based on their mass-to-charge ratio and relative
          abundance.
        meaning: OBI:0003097
      OBI:0003098:
        title: lightsheet fluorescence microscopy assay
        description: A fluorescence microscopy that involves capturing of photons
          emitted by fluorophores excited with a thin sheet of laser light in a sample
          only in a relatively narrow plane by a detection objective oriented perpendicularly
          to the light sheet and imaged onto a detection device such as a CCD camera.
        meaning: OBI:0003098
      OBI:0003099:
        title: matrix assisted laser desorption ionization imaging mass spectrometry
          assay
        description: A mass spectrometry assay that involves collection of spatially
          resolved mass spectra of a sample during microscopy where a pulse laser
          is used to produce both ionisation and vaporization. The sample is held
          in a matrix (such as dihydrobenzoic acid) to protect it from direct laser
          illumination and to separate the sample molecules. The spectra are used
          to visualise the spatial distribution of biomolecules by their molecular
          masses.
        meaning: OBI:0003099
      OBI:0003100:
        title: multiplexed ion beam imaging assay
        description: A cytometry time of flight assay in which molecules of interest
          on or in cells are imaged through a system in which samples are labeled
          with multiple different rare-earth tagged antibodies. A primary ion beam
          is ued to rasterize sections under vacuum, releasing showers of secondary
          ions detected by cytometry time of flight mass spectrometry.
        meaning: OBI:0003100
      OBI:0003101:
        title: nanospray desorption electrospray ionization assay
        description: A mass spectrometry assay that analyzes organic and biological
          molecules on a substrate by desorption of an analyte into a solvent bridge
          formed between two capillaries and the analysis surface. One capillary supplies
          solvent to create and maintain the bridge, while the second capillary transports
          the dissolved analyte from the bridge to the mass spectrometer. A high voltage
          applied between the inlet of mass spectrometer and the primary capillary
          creates a self-aspirating nanospray.
        meaning: OBI:0003101
      OBI:0003102:
        title: nanodroplet processing in one pot for trace samples assay
        description: A protein expression profiling assay in which proteomics sample
          processing is performed in nanoliter volumes. Flow cytometry or laser microdissection
          is employed to isolate a small population or single cells into a nanoPOTS
          chip. Then, liquid chromatography mass spectrometry is used to measure the
          global protein expression.
        meaning: OBI:0003102
      OBI:0003103:
        title: periodic acid-Schiff staining assay
        description: A histological assay which is used on tissue samples to demonstrate
          the presence of carbohydrates and carbohydrate compounds such as polysaccharides,
          mucin, glycogen, or fungal cell wall components.
        meaning: OBI:0003103
      OBI:0003104:
        title: single cell combinatorial indexing assay for transposase-accessessable
          chromatin using sequencing
        description: An assay for transposase-accessible chromatin that uses sequencing
          which involves single cell combinatorial indexing ('sci-') strategy where
          nucleic acids from each of many cells are uniquely tagged through several
          rounds of split-pool barcoding which enables identification of single cells
          without single cell isolation.
        meaning: OBI:0003104
      OBI:0003105:
        title: single-cell combinatorial indexing RNA sequencing assay
        description: A single-cell transcription profiling by RNA sequencing assay
          that involves single cell combinatorial indexing ('sci-') strategy to profile
          the transcriptomes of single cells or nuclei without single cell isolation.
        meaning: OBI:0003105
      OBI:0003106:
        title: sequential fluorescence in-situ hybridization assay
        description: A fluorescence in-situ hybridization assay that involves ultra-resolution
          imaging of cell activity by targetting thousands of single molecules with
          fluorescent probes which find and hybridize with complementary DNA or RNA
          sequences in the tissue sample, thus enabling identification of those molecules
          directly in single cells with their spatial context preserved.
        meaning: OBI:0003106
      OBI:0003107:
        title: slide-seq assay
        description: A transcription profiling by RNA sequencing assay that involves
          transfer of RNA from tissue sections onto a surface covered in DNA-barcoded
          beads with known positions, allowing the locations of the RNA to be inferred
          by sequencing.
        meaning: OBI:0003107
      OBI:0003108:
        title: single-nucleus chromatin accessibility and mRNA expression sequencing
          assay
        description: An assay that involves joint profiling of accessible chromatin
          and RNA within the same cells which enables direct matching of transcriptional
          regulation to its outputs.
        meaning: OBI:0003108
      OBI:0003110:
        title: gas chromatography mass spectrometry assay
        description: A mass spectrometry assay combining mass spectrometry and gas
          chromatography for the qualitative as well as quantitative determination
          of compounds.
        meaning: OBI:0003110
      OBI:0003111:
        title: SOMAscan assay
        description: An analyte assay that uses aptamers to detect protein analytes
          in serum.
        meaning: OBI:0003111
      OBI:0003112:
        title: Olink assay
        description: A proximity extension assay that uses quantitative polymerase
          chain reaction (qPCR) technology to determine the concentration/presence
          of proteins using a high-multiplex, high-throughput protein biomarker platform.
          The assay utilizes two distinct oligonucleotide-labeled antibodies (‘probes’)
          that bind at different sites for each detected protein. When the two probes
          are in close proximity, a new PCR target sequence is formed by a proximity-dependent
          DNA polymerization event. The resulting sequence is subsequently detected
          and quantified using standard real-time PCR.
        meaning: OBI:0003112
      OBI:0003113:
        title: proximity extension assay
        description: An analyte assay that uses quantitative polymerase chain reaction
          (qPCR) technology to determine the concentration/presence of an analyte
          or analyte complex.
        meaning: OBI:0003113
      OBI:0003115:
        title: antigen detection by cytometric bead array assay
        description: A cytometric bead array assay in which a series of beads are
          coated with antibodies specific to antigens of interest. Antigens of interest
          attach to antibodies on the beads. Fluorescent labeled secondary antibodies
          are used to detect the antigens of interest.
        meaning: OBI:0003115
      OBI:0003116:
        title: antibody detection by cytometric bead array assay
        description: A cytometric bead array assay that detects antigen-specific antibodies.
          In the assay a series of beads are coated with antigens which capture antibodies
          specific to the antigens. Fluorescent labeled secondary antibodies are used
          to detect the antibodies of interest.
        meaning: OBI:0003116
      OBI:0003117:
        title: 3D molecular structure determination assay
        description: An assay that determines the 3-dimensional configuration of a
          molecular entity or molecular complex.
        meaning: OBI:0003117
      OBI:0003118:
        title: electron-microscopy 3D molecular structure determination assay
        description: A 3D molecular structure determination assay that uses electron
          microscopy imaging.
        meaning: OBI:0003118
      OBI:0003122:
        title: 3D cell structure determination assay
        description: A 3D structure determination assay that determines the 3-dimensional
          configuration of a cell.
        meaning: OBI:0003122
      OBI:0003123:
        title: 3D neural cell structure determination assay
        description: A 3D cell structure determination assay that determines the 3-dimensional
          configuration of a neural cell.
        meaning: OBI:0003123
      OBI:0003124:
        title: neuron morphology assay
        description: A 3D neural cell structure determination assay that determines
          the 3-dimensional configuration of a neuron.
        meaning: OBI:0003124
      OBI:0003125:
        title: mosaicism with repeat frameshift genetic sparse labeling
        description: A 3D neural cell structure determination assay where sparse and
          stochastic methods are used to label genetically-defined neurons.
        meaning: OBI:0003125
      OBI:0003126:
        title: neuron morphology reconstruction assay
        description: A neuron morphology assay where the morphology or structure of
          a neuron is represented. Often, this assay is a combination of different
          assays (sparse labelling, fluorescent labeling, fMOST).
        meaning: OBI:0003126
      OBI:0003127:
        title: B cell epitope assay
        description: An immune epitope assay that characterizes the structrue of an
          antibody-epitope complex, or measures the binding of an antibody receptor
          to epitope, or the immune response process resulting from such a binding
          event or the recognition of the epitope.
        meaning: OBI:0003127
      OBI:0003128:
        title: T cell epitope assay
        description: An immune epitope assay that characterizes the structrue of an
          epitope-T cell receptor complex, or measures the binding of a T cell receptor
          to epitope, or the immune response process resulting from such a binding
          event or the recognition of the epitope.
        meaning: OBI:0003128
      OBI:0003145:
        title: assay measuring quantitative binding of a MHC:ligand complex
        description: An assay that detects the binding of a MHC molecule with a ligand,
          and produces a quantitative measurement of the binding as an output.
        meaning: OBI:0003145
      OBI:0003146:
        title: assay measuring quantitative binding of an antigen:antibody complex
        description: An assay that detects the binding of an antigen with an antibody,
          and produces a quantitative measurement of the binding as an output.
        meaning: OBI:0003146
      OBI:0003147:
        title: assay measuring quantitative binding of an epitope:MHC:TCR complex
        description: An assay that detects the binding of a MHC:epitope complex with
          a T cell receptor, and produces a quantitative measurement of the binding
          as an output.
        meaning: OBI:0003147
      OBI:0003148:
        title: albumin concentration assay
        description: An albumin assay that measures the concentration of albumin in
          a specimen.
        meaning: OBI:0003148
      OBI:0003149:
        title: basophil percentage assay
        description: A basophil assay that measures the percentage of basophils in
          a specimen.
        meaning: OBI:0003149
      OBI:0003150:
        title: calcium cation concentration assay
        description: A calcium cation assay that measures the concentration of calcium
          cations in a specimen.
        meaning: OBI:0003150
      OBI:0003151:
        title: chloride concentration assay
        description: A chloride assay that measures the concentration of chloride
          in a specimen.
        meaning: OBI:0003151
      OBI:0003152:
        title: cholesterol concentration assay
        description: A cholesterol assay that measures the concentration of cholesterol
          in a specimen.
        meaning: OBI:0003152
      OBI:0003153:
        title: creatinine concentration assay
        description: A creatinine assay that measures the concentration of creatinine
          in a specimen.
        meaning: OBI:0003153
      OBI:0003154:
        title: eosinophil percentage assay
        description: An eosinophil assay that measures the percentage of eosinophils
          in a specimen.
        meaning: OBI:0003154
      OBI:0003155:
        title: globulin concentration assay
        description: A globulin assay that measures the concentration of globulin
          in a specimen.
        meaning: OBI:0003155
      OBI:0003156:
        title: hemoglobin concentration assay
        description: A hemoglobin assay that measures the amount of hemoglobin in
          a specimen.
        meaning: OBI:0003156
      OBI:0003157:
        title: high-density lipoprotein cholesterol concentration assay
        description: A high-density lipoprotein cholesterol assay that measures the
          concentration of high-density lipoprotein cholesterol in a specimen.
        meaning: OBI:0003157
      OBI:0003158:
        title: iron concentration assay
        description: An iron assay that measures the concentration of iron cation
