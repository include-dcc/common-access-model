          organism, such as insect.
        meaning: OBI:0002732
      OBI:0002733:
        title: blood meal by counter current immunoelectrophoresis assay
        description: A blood meal assay that uses a counter current immunoelectrophoresis
          technique.
        meaning: OBI:0002733
      OBI:0002734:
