        description: An assay that uses digestion of DNA with specific restriction
          enzymes followed by gel electropheresis to detect differences in the sizes
          of the generated fragments that are due to genetic differences (polymorphisms)
          in homologous sequences.
        meaning: OBI:0002693
      OBI:0002694:
        title: DNA fingerprinting assay
        description: An assay to identify a specific individual organism from a DNA
          specimen by looking at unique patterns in their DNA.
        meaning: OBI:0002694
      OBI:0002695:
        title: insecticide resistance assay
        description: An assay that aims to detect the presence and/or frequency of
          resistance to insecticides in an organism or organism population.
        meaning: OBI:0002695
      OBI:0002696:
        title: insecticide resistance by monitoring known mutations assay
        description: An insecticide resistance assay that detects, in a population,
          presence and frequency of mutant alleles for previously characterized mutations
          with insecticide resistance phenotypes.
        meaning: OBI:0002696
      OBI:0002697:
        title: insecticide resistance by detecting enzyme activity assay
        description: An insecticide resistance assay that is based on determination
          the catalytic activity of an enzyme associated with insecticide resistance
          phenotypes.
        meaning: OBI:0002697
      OBI:0002698:
        title: insecticide resistance bioassay
        description: An insecticide resistance assay that is typically conducted to
          measure the effects of a substance on a living organism.
        meaning: OBI:0002698
      OBI:0002699:
        title: insecticide resistance by detecting alpha esterase activity assay
        description: An insecticide resistance by detecting enzyme activity assay
          that measures activity of alpha esterase.
        meaning: OBI:0002699
      OBI:0002700:
        title: insecticide resistance by detecting beta esterase activity assay
        description: An insecticide resistance by detecting enzyme activity assay
          that measures activity of beta esterase.
        meaning: OBI:0002700
      OBI:0002701:
        title: insecticide resistance by detecting acetylcholinesterase activity assay
        description: An insecticide resistance by detecting enzyme activity assay
          that measures activity of acetylcholinesterase.
        meaning: OBI:0002701
      OBI:0002702:
        title: insecticide resistance by detecting glutathione S-transferase activity
          assay
        description: An insecticide resistance by detecting enzyme activity assay
          that measures activity of glutathione S-transferase (GST).
        meaning: OBI:0002702
      OBI:0002703:
        title: insecticide resistance by detecting carboxylic ester hydrolase activity
          assay
        description: An insecticide resistance by detecting enzyme activity assay
          that measures activity of carboxylic ester hydrolase using p-nitrophenyl
          acetate as a substrate.
        meaning: OBI:0002703
      OBI:0002704:
        title: insecticide resistance by detecting mixed-function oxidase assay
        description: An insecticide resistance by detecting enzyme activity assay
          that measures whether mixed-function oxidase activity present.
        meaning: OBI:0002704
      OBI:0002705:
        title: direct insecticide resistance bioassay
        description: An insecticide resistance bioassay without the use of any synergist.
        meaning: OBI:0002705
      OBI:0002706:
        title: topical application insecticide resistance bioassay
        description: An insecticide resistance bioassay by adding insecticide directly
          to the thorax of the insect.
        meaning: OBI:0002706
      OBI:0002707:
        title: direct insecticide resistance diagnostic assay
        description: A direct insecticide resistance assay that at preset insecticide
          dosage scoring mortality to determine resistance of a population.
        meaning: OBI:0002707
      OBI:0002708:
        title: insecticide resistance dose response assay
        description: A direct insecticide resistance assay in which an insect population
          is exposed to a range of insecticide dosage scoring mortality to determine
          resistance.
        meaning: OBI:0002708
      OBI:0002709:
        title: insecticide resistance time response assay
        description: A direct insecticide resistance assay to determine resistance
          as a consequence of the time of exposure to insecticide.
        meaning: OBI:0002709
      OBI:0002710:
        title: Centre for Disease Control and Prevention bottle bioassay
        description: A direct insecticide resistance diagnostic assay performs in
          a glass bottle coated with insecticides for detecting resistance to insecticides
          in vector populations.
        meaning: OBI:0002710
      OBI:0002711:
        title: WHO cone kit diagnostic assay
        description: A direct insecticide resistance diagnostic assay uses WHO cone
          kit.
        meaning: OBI:0002711
      OBI:0002712:
        title: WHO paper kit diagnostic assay
        description: A direct insecticide resistance diagnostic assay uses WHO paper
          kit.
        meaning: OBI:0002712
      OBI:0002713:
        title: WHO larvicide diagnostic assay
        description: A direct insecticide resistance diagnostic assay tests survival
          of larvae in a medium supplemented with insecticide.
        meaning: OBI:0002713
      OBI:0002714:
        title: insecticide resistance dose response by bottle assay
        description: An insecticide resistance dose response assay that performs in
          a glass bottle coated with insecticides.
        meaning: OBI:0002714
      OBI:0002715:
        title: insecticide resistance dose response by survival of larvae assay
        description: An insecticide resistance dose response assay that tests survival
          of larvae in a medium supplemented with insecticide.
        meaning: OBI:0002715
      OBI:0002716:
        title: insecticide resistance dose response by WHO paper kit assay
        description: An insecticide resistance dose response assay using WHO paper
          kit.
        meaning: OBI:0002716
      OBI:0002717:
        title: insecticide resistance time response by bottle assay
        description: An insecticide resistance time response assay that is performed
          in a glass bottle coated with insecticides, with the presence of a synergist.
        meaning: OBI:0002717
      OBI:0002718:
        title: insecticide resistance time response by WHO paper kit assay
        description: An insecticide resistance time response assay using WHO paper
          kit, with the presence of a synergist.
        meaning: OBI:0002718
      OBI:0002719:
        title: insecticide resistance by amplification refractory mutation system
          assay
        description: An insecticide resistance by monitoring known mutations assay
          that detects any mutation involving single base changes or small deletions
          using amplification refractory mutation system (ARMS). The ARMS is based
          on the use of sequence-specific PCR primers that allow amplification of
          test DNA only when the target allele is contained within the sample. Following
          an ARMS reaction the presence or absence of a PCR product is diagnostic
          for the presence or absence of the target allele. It can be used to analyze
          human genomic DNA for one or more mutations.
        meaning: OBI:0002719
      OBI:0002720:
        title: insecticide resistance by primer introduced restriction analysis PCR
          assay
        description: An insecticide resistance by monitoring known mutations assay
          that detects Single Nucleotide Polymorphisms (SNPs) using PCR technique
          and mismatched primers that is close to the mutation of interest and digested
          the PCR productions using restriction enzymes.
        meaning: OBI:0002720
      OBI:0002721:
        title: insecticide resistance by nested polymerase chain reaction assay
        description: An insecticide resistance by monitoring known mutations assay
          that detects gene mutation based on nested polymerase chain reaction technique.
        meaning: OBI:0002721
      OBI:0002722:
        title: insecticide resistance by ligase detection reaction assay
        description: An insecticide resistance assay that is based on monitoring known
          mutations using ligase detection reaction exquisitely discriminate between
          a mismatched and complementary DNA helix.
        meaning: OBI:0002722
      OBI:0002723:
        title: insecticide resistance by ligase detection reaction-fluorescent microsphere
          assay
        description: An insecticide resistance by ligase detection reaction assay
          that uses fluorescently labeled conserved probes in ligase detection reaction.
        meaning: OBI:0002723
      OBI:0002724:
        title: insecticide resistance by PCR amplification of specific alleles assay
        description: An insecticide resistance assay that is based on monitoring known
          mutations by PCR amplification of specific alleles to detect polymorphic
          or mutant alleles.
        meaning: OBI:0002724
      OBI:0002725:
        title: insecticide resistance by fluorogenic PCR assay
        description: An insecticide resistance assay that is based on monitoring known
          mutations by PCR technique that uses target specific probes labeled with
          fluorogenic chromophores to detect gene mutation.
        meaning: OBI:0002725
      OBI:0002726:
        title: insecticide resistance by PCR-RFLP assay
        description: An insecticide resistance by monitoring known mutations assay
          based on restriction fragment length polymorphism assay.
        meaning: OBI:0002726
      OBI:0002727:
        title: insecticide resistance by short interspersed elements PCR assay
        description: An insecticide resistance assay that is based on monitoring known
          mutations by PCR amplification of short interspersed elements (SINEs).
        meaning: OBI:0002727
      OBI:0002728:
        title: pathogen detection assay
        description: An organism detection assay that detects pathogens.
        meaning: OBI:0002728
      OBI:0002729:
