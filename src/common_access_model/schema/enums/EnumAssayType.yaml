        meaning: OBI:0003161
      OBI:0003162:
        title: metamyelocyte percentage assay
        description: A metamyelocyte assay that measures the percentage of metamyelocytes
          in a specimen.
        meaning: OBI:0003162
      OBI:0003163:
        title: methemoglobin percentage assay
        description: A methemoglobin assay that measures the percentage of methemoglobin
          in a specimen.
        meaning: OBI:0003163
      OBI:0003164:
        title: monocyte percentage assay
        description: A monocyte assay that measures the percentage of monocytes in
          a specimen.
        meaning: OBI:0003164
      OBI:0003165:
        title: myelocyte count assay
        description: A myelocyte assay that measures the number of myelocytes in a
          specimen.
        meaning: OBI:0003165
      OBI:0003166:
        title: neutrophil percentage assay
        description: A neutrophil assay that measures the percentage of neutrophils
          in a specimen.
        meaning: OBI:0003166
      OBI:0003167:
        title: phosphate ion concentration assay
        description: A phosphate ion assay that measures the concentration of phosphate
          ions in a specimen.
        meaning: OBI:0003167
      OBI:0003168:
        title: potassium(1+) concentration assay
        description: A potassium(1+) assay that measures the concentration of potassium(1+)
          in a specimen.
        meaning: OBI:0003168
      OBI:0003170:
        title: reticulocyte percentage assay
        description: A reticulocyte assay that measures the percentage of reticulocytes
          in a specimen.
        meaning: OBI:0003170
      OBI:0003171:
        title: sodium(1+) concentration assay
        description: A sodium(1+) assay that measures the concentration of sodium(1+)
          in a specimen.
        meaning: OBI:0003171
      OBI:0003172:
        title: thyroid stimulating hormone concentration assay
        description: A thyroid stimulating hormone assay that measures the concentration
          of thyroid stimulating hormone in a specimen.
        meaning: OBI:0003172
      OBI:0003173:
        title: triglyceride concentration assay
        description: A triglyceride assay that measures the concentration of triglycerides
          in a specimen.
        meaning: OBI:0003173
      OBI:0003174:
        title: 3,3',5'-triiodothyronine concentration assay
        description: A 3,3',5'-triiodothyronine assay that measures the concentration
          of 3,3',5'-triiodothyronine in a specimen.
        meaning: OBI:0003174
      OBI:0003175:
        title: fibrinogen concentration assay
        description: A fibrinogen assay that measures the concentration of fibrinogen
          in a specimen.
        meaning: OBI:0003175
      OBI:0003176:
        title: free thyroxine concentration assay
        description: A thyroxine assay that measures the concentration of free thyroxine
          in a specimen.
        meaning: OBI:0003176
      OBI:0003177:
        title: total thyroxine concentration assay
        description: A thyroxine assay that measures the concentration of total thyroxine
          in a specimen.
        meaning: OBI:0003177
      OBI:0003180:
        title: direct bilirubin concentration assay
        description: A bilirubin IXalpha assay that measures the concentration of
          direct bilirubin in a specimen.
        meaning: OBI:0003180
      OBI:0003181:
        title: indirect bilirubin concentration assay
        description: A bilirubin IXalpha assay that measures the concentration of
          indirect bilirubin in a specimen.
        meaning: OBI:0003181
      OBI:0003182:
        title: total bilirubin concentration assay
        description: A bilirubin IXalpha assay that measures the concentration of
          total bilirubin in a specimen.
        meaning: OBI:0003182
      OBI:0003183:
        title: mean cell hemoglobin assay
        description: A hemoglobin assay that measures the average concentration of
          hemoglobin in a population of erythrocytes.
        meaning: OBI:0003183
      OBI:0003184:
        title: mean cell hemoglobin concentration assay
        description: A hemoglobin assay that measures the concentration of hemoglobin
          in a specimen.
        meaning: OBI:0003184
      OBI:0003185:
        title: mean platelet volume assay
        description: A platelet assay that measures the average volume of platelets
          in a specimen.
        meaning: OBI:0003185
