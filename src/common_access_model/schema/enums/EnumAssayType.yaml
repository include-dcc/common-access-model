        description: A sequencing assay in which a DNA or RNA input molecule is amplified
          by PCR and the product sequenced.
        meaning: OBI:0002767
      OBI:0002768:
        title: whole virome sequencing assay
        description: A whole metagenome sequencing assay that intends to provide information
          on multiple genome sequences from different viruses present in the same
          input sample.
        meaning: OBI:0002768
      OBI:0002773:
        title: single-value binding of antibody with reporter to antigen assay
        description: An assay that detects the linking of antigens and antibodies
          via special signaling mechanisms, such as EIA, ELISA, chemiluminescence,
          etc. that produces one measure (quantitative or qualitative) of the analyte
          of interest
        meaning: OBI:0002773
      OBI:0002946:
        title: fluorescence imaging-based apoptosis assay
        description: A type of cytometry assay in which fluorescent dyes are used
          to label and detect proteins or structures associated with molecular processes
          of apoptosis.
        meaning: OBI:0002946
      OBI:0002947:
        title: fluorescence imaging-based cell proliferation assay
        description: A type of cell proliferation assay in which fluorescent dyes
          are ued to label and detect proteins or structures that can be used to count
          cells.
        meaning: OBI:0002947
      OBI:0002948:
        title: fluorescence imaging-based cell cycle state assay
        description: A type of cytometry assay in which fluorescent dyes are used
          to label and detect proteins or structures associated with particular cell
          cycle states.
        meaning: OBI:0002948
      OBI:0002949:
        title: fluorescence imaging-based cell viability assay
        description: A type of cytometry assay in which fluorescent dyes are used
          to label and detect proteins or structures associated with cell viability.
        meaning: OBI:0002949
      OBI:0002950:
        title: fluorescence imaging-based drug synergy assay
        description: A type of cytometry assay in which fluorescent dyes are used
          to label and detect proteins or structures to determine if drugs applied
          to cells in combination have a greater effect together than the sum of their
          separate effects.
        meaning: OBI:0002950
      OBI:0002951:
        title: fluorescence imaging-based cell morphology assay
        description: A type of cytometry assay in which fluorescent dyes are used
          to label and detect proteins or structures in order to determine cell morphology.
        meaning: OBI:0002951
      OBI:0002952:
        title: fluorescence imaging multiplex cytological profiling
        description: A type of cytometry assay in which fluorescent dyes are used
          to stain seven major cellular components followed by automatic image capture
          and analysis which extracts shape, texture, and intensity parameters.
        meaning: OBI:0002952
      OBI:0002953:
        title: protein state assay
        description: A type of assay that measures the quantity and/or identity of
          proteins in their modficied and unmodified states where modifications include
          phosphorylation, methylation, acetylation, etc.
        meaning: OBI:0002953
      OBI:0002954:
        title: fluorescence imaging-based protein phosphorylation state assay
        description: A type of protein state assay that employs high-throughput microscopy
          to measure levels of proteins in different phosphorylation states.
        meaning: OBI:0002954
      OBI:0002955:
        title: mass spectrometry-based protein state assay
        description: A type of protein state assay that employs mass spectrometry
          to measure levels of proteins in different phosphorylation states.
        meaning: OBI:0002955
      OBI:0002956:
        title: targeted, drug-modulated, mass spectrometry-based protein phoshporylation-state
          assay
        description: A type of mass spectrometry protein state assay that measures
          levels of a targeted set of proteins in different phosphorylation states
          in response to drug perturbations.
        meaning: OBI:0002956
      OBI:0002957:
        title: reverse phase protein array profiling assay
        description: A type of protein state assay where tissue or cell samples are
          lysed and then spotted onto a slide which is probed with antibodies specific
          to proteins with and without post-translational modifications.
        meaning: OBI:0002957
      OBI:0002958:
        title: SWATH-MS protein profiling assay
        description: A type of mass spectrometry assay using a data-independent acquisition
          method to identify target peptides.
        meaning: OBI:0002958
      OBI:0002959:
        title: tandem mass tag mass spectrometry assay
        description: A type of tandem mass spectrometry where isotopomer labels are
          employed for accurate quantification and identification of specific proteins.
        meaning: OBI:0002959
      OBI:0002960:
        title: fluorescence imaging-based reporter gene assay
        description: A type of reporter gene assay that employs fluorescence imaging
          to detect a reporter gene's expression.
        meaning: OBI:0002960
      OBI:0002961:
        title: global chromatin profiling by mass spectrometry assay
        description: A type of epigenetic modification assay that employs targeted
          quantitative mass spectrometry to profile modifications of the core histones
          of chromatin.
        meaning: OBI:0002961
      OBI:0002962:
        title: kinase inhibitor assay
        description: A type of assay that identifies compounds that inhibit the activity
          of kinases.
        meaning: OBI:0002962
      OBI:0002963:
        title: KINOMEscan assay
        description: A type of proprietary kinase inhibitor assay that and employs
          a panel of kinases against which one can test compounds for their selectivity
          and potency in interactions with kinases, without the need to add ATP to
          the reactions.
        meaning: OBI:0002963
      OBI:0002964:
        title: KiNativ assay
        description: A type of proprietary in situ kinase inhibitor assay that employs
          biotinylated acyl phosphates of ATP and ADP.
        meaning: OBI:0002964
      OBI:0002965:
        title: landmark transcript profiling assay
        description: A type of transcription profiling assay in which a set of landmark
          transcripts that have been determined to provide a comprehensive profile
          of cell activity, plus numerous steady-state controls, are assayed via ligation-mediated
          amplification followed by capture on fluorescently labeled microspheres
          followed by detection of fluorescence.
        meaning: OBI:0002965
      OBI:0002966:
        title: microenvironment microarray assay
        description: A type of cytometry assay where cells are incubated for three
          days with a standardized set of extracellular matrix proteins in combination
          with various ligands creating varying microenvironment perterbations for
          the cells. Immunofluorescent imaging of cells is used to measure features
          such as morphology, metabolism, cell cycle, and nuclear activity.
        meaning: OBI:0002966
      OBI:0002967:
        title: microwestern meso-scale quantitative western blot assay
        description: A western blot assay that provides a high-throughput, sensitive,
          and quantitative measurement of proteins from numerous samples via an array
          of small western blots on a single sheet of nitrocellulose.
        meaning: OBI:0002967
      OBI:0002968:
        title: positive/negative ion switching metabolite profiling assay
        description: A type of metabolic profiling assay which employs a hybrid dual
          quadrupole linear ion trap mass spectrometer for steady-state profiling
          of endogenous polar metabolites from organic extractions from biological
          samples.
        meaning: OBI:0002968
      OBI:0002969:
        title: cyclic immunofluoroescence assay
        description: A type of microscopy assay resulting in highly multiplexed immunofluorescence
          imaging through sequential rounds of imaging followed by fluorophore inactivation.
        meaning: OBI:0002969
      OBI:0002970:
        title: multiplex bead-based protein state immunoassay
        description: A type of protein state assay in which antibodies attached to
          different colored beads and fluorescent reporter dye labels are used in
          a multiplexed mixture to assay for proteins in specific states.
        meaning: OBI:0002970
      OBI:0002984:
        title: capture Hi-C assay
        description: A Hi-C assay in which a selection step is performed on ligated
          fragments in order to enrich for ligation products containing specific regions
          of interest.
        meaning: OBI:0002984
      OBI:0002985:
        title: magnetic resonance imaging assay
        description: An imaging assay in which nuclear magnetic resonance is used
          to produce information about the interior structure and composition of an
          input material entity.
        meaning: OBI:0002985
      OBI:0002986:
        title: computed tomography imaging assay
        description: An imaging assay that uses a series of X-ray images to produce
          information about the interior structure and composition of an input material
          entity.
        meaning: OBI:0002986
      OBI:0002987:
        title: positron emission tomography imaging assay
        description: An imaging assay in which positron-emitting radionuclides are
          used to visualize functional processes of an input material entity.
        meaning: OBI:0002987
      OBI:0002990:
        title: T cell receptor repertoire sequencing assay
        description: A sequencing assay that determines the sequences of DNA or RNA
          molecules that encode the repertoire of T cell receptors within an input
          sample.
        meaning: OBI:0002990
      OBI:0002991:
        title: B cell receptor repertoire sequencing assay
        description: A sequencing assay that determines the sequence of a DNA or RNA
          molecules that encode the repertoire of B cell receptors within an input
          sample.
        meaning: OBI:0002991
      OBI:0003009:
        title: ferritin assay
        description: An assay that measures ferritin
        meaning: OBI:0003009
