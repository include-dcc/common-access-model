        description: An efficacy of B cell epitope intervention experiment that uses
          a epitope protection experiment based on reduction of fertility.
        meaning: OBI:0001692
      OBI:0001693:
        title: in vivo assay measuring B cell epitope specific tolerance induction
        description: An efficacy of B cell epitope intervention experiment that uses
          a tolerance induction intervention experiment.
        meaning: OBI:0001693
      OBI:0001694:
        title: in vivo assay measuring B cell epitope specific induction of hypersensitivity
        description: An efficacy of B cell epitope intervention experiment that detects
          a hypersensitivity response by monitoring skin reactions.
        meaning: OBI:0001694
      OBI:0001695:
        title: assay measuring epitope specific immune complex formation
        description: A B cell epitope specific activation of additional immune response
          assay that detects agglutination in vitro.
        meaning: OBI:0001695
      OBI:0001696:
        title: in vivo assay measuring B cell epitope specific protection based on
          survival
        description: An in vivo assay measuring B cell epitope specific protection
          from other challenge using survival.
        meaning: OBI:0001696
      OBI:0001697:
        title: in vivo assay measuring B cell epitope specific treatment of disease
        description: An efficacy of B cell epitope intervention experiment that detects
          a decrease in disease.
        meaning: OBI:0001697
      OBI:0001698:
        title: assay measuring B cell epitope specific in vivo activity
        description: A B cell epitope dependent biological activity determination
          assay that uses an in vivo intervention experiment.
        meaning: OBI:0001698
      OBI:0001699:
        title: antibody cross-blocking assay
        description: A competitive inhibition of binding assay in which two antibodies
          that are known to bind the same antigen are tested for the ability of one
          antibody to inhibit binding of the other antibody to the antigen, thereby
          determining if they have overlapping binding sites.
        meaning: OBI:0001699
      OBI:0001700:
        title: immunoprecipitation assay
        description: An analyte assay in which an input material is mixed with antibodies
          and bound antigen:antibody complexes are separated out using immunoprecipitation.
          Either the antibody has known specificy, and the antigen mixture is tested
          for the presence of a specific antigen, or the antigen solution is well
          defined and the antibody solution is tested for the presence of antigen
          specific antibodies.
        meaning: OBI:0001700
      OBI:0001701:
        title: antigen inhibition assay measuring binding of a B cell epitope:antibody
          complex
        description: A B cell epitope qualitative binding to antibody assay that measures
          the ability of an antigen to inhibit antibody binding to a known ligand.
        meaning: OBI:0001701
      OBI:0001703:
        title: assay measuring qualitative binding of a B cell epitope:antibody complex
        description: An assay that detects the binding of an antigen with an antibody,
          and produces a qualitative measurement of the binding as an output.
        meaning: OBI:0001703
      OBI:0001704:
        title: assay measuring epitope specific activation of additional immune response
          in vitro
        description: A B cell epitope dependent biological activity determination
          assay that detects secondary in vitro activity.
        meaning: OBI:0001704
      OBI:0001705:
        title: assay measuring epitope specific antigen inhibition of antibody activity
        description: A B cell epitope dependent biological activity determination
          assay that detects inhibition of the antibody's activity by the antigen.
        meaning: OBI:0001705
      OBI:0001706:
