        description: A pathogen detection assay that is based on Rapid Analyte Measurement
          Platform (RAMP) technology to quantify immunologically active substances.
        meaning: OBI:0002730
      OBI:0002731:
        title: pathogen detection by loop-mediated isothermal amplification assay
        description: A pathogen detection assay that is based on loop-mediated isothermal
          amplification.
        meaning: OBI:0002731
      OBI:0002732:
