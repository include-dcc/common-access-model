          a KD value.
        meaning: OBI:0001667
      OBI:0001668:
        title: split-ubiquitin assay
        description: A binding assay that screens membrane soluble proteins by fusion
          of two integral membrane proteins (bait and prey) to two different ubiquitin
          moieties. One moiety is also fused to a transcription factor (TF) that can
          be cleaved off by ubiquitin specific proteases. Upon bait and prey interaction,
          Nub and Cub-moieties assemble, reconstituting the split-ubiquitin. The reconstituted
          split-ubiquitin molecule is recognized by ubiquitin specific proteases,
          which cleave off the reporter protein, allowing it to induce the transcription
          of reporter genes.
        meaning: OBI:0001668
      OBI:0001669:
        title: far-western blot assay
        description: An assay that measures protein-protein interactions by separating
          target proteins on an SDS-PAGE gel, transfering them to a solid substrate,
          hybridizing with a protein probe and visualizing bound proteins using a
          probe-directed antibody. This is a adaptation on the western blot assay.
        meaning: OBI:0001669
      OBI:0001670:
        title: RNA protection assay
        description: An assay that determines the presence and estimates abundance
          of transcript species by first creating an homo or heteroduplex by adding
          a specific, complementary sequence to the sequence of interest and then
          exposing the mixture of ribonuclease, which will degrade only single stranded
          molecules. A detection step will reveal if the sample contained a sequence
          of interest.
        meaning: OBI:0001670
      OBI:0001671:
        title: electrophoretic mobility shift assay
        description: An assay that measures information about Protein-DNA or Protein-RNA
          interactions using gel electrophoresis and relying on the fact the molecular
          interactions will cause the heterodimer to be retarded on the gel when compared
          to controls corresponding to protein extract alone and protein extract +
          neutral nucleic acid.
        meaning: OBI:0001671
      OBI:0001672:
        title: gene knock-down assay
        description: An assay which transiently disrupts gene transcripts by expressing
          antisense RNA constructs or delivering RNA interfering molecules in cells.
        meaning: OBI:0001672
      OBI:0001673:
        title: nano-cap analysis of gene expression assay
        description: A transcription profiling by RNA sequencing assay that is performed
          using a very low amount (nanogram scale) of mRNA samples using Cap analysis
          gene expression (CAGE).
        meaning: OBI:0001673
      OBI:0001674:
        title: cap analysis of gene expression assay
        description: A transcription profiling by RNA sequencing assay which measures
          RNA transcript abundances in biological samples by extracting 5' ends of
          capped transcripts, RTPCR and sequence those. Copy numbers of CAGE tags
          provide a way of quantification and provide a measure of expression of the
          transcriptome
        meaning: OBI:0001674
      OBI:0001675:
        title: ELISA measuring epitope specific interleukin-17A production by T cells
        description: An enzyme-linked immunosorbent assay that detects interleukin-17A
          production by T cells.
        meaning: OBI:0001675
      OBI:0001676:
        title: detection of specific nucleic acids with complementary probes assay
          measuring epitope specific interleukin-7 production by T cells
        description: A detection of specific nucleic acid polymers with complementary
          probes that detects interleukin-7 production by T cells.
        meaning: OBI:0001676
      OBI:0001679:
        title: yeast 2-hybrid assay
        description: An assay that detects protein protein interactions and protein
          DNA interactions by testing for physical interactions (such as binding)
          between two proteins or a single protein and a DNA molecule, respectively.
          The premise behind the test is the activation of downstream reporter gene(s)
          by the binding of a transcription factor onto an upstream activating sequence
          (UAS). For two-hybrid screening, the transcription factor is split into
          two separate fragments, called the binding domain (BD) and activating domain
          (AD). The BD is the domain responsible for binding to the UAS and the AD
          is the domain responsible for the activation of transcription. The Y2H is
          thus a protein-fragment complementation assay.
        meaning: OBI:0001679
      OBI:0001680:
        title: Sos-recruitment assay
        description: A binding assay that detects interacting proteins for a targeted
          domain where mammalian guanyl nucleotide exchange factor (GEF) Sos is recruited
          to the Saccharomyces cerevisiae plasma membrane harboring a temperature-sensitive
          Ras GEF, Cdc25-2, allowing growth at the nonpermissive temperature using
          the Sos recruitment system, a kind of yeast 2 hybrid system.
        meaning: OBI:0001680
      OBI:0001681:
        title: yeast one-hybrid assay
        description: An assay that determines protein DNA interactions using a single
          fusion protein in which the activating domain is linked directly to the
          binding domain.
        meaning: OBI:0001681
      OBI:0001682:
        title: bacterial one-hybrid assay
        description: An assay that identifies the sequence-specific target site of
          a DNA-binding domain. In this system, a given transcription factor (TF)
          is expressed as a fusion to a subunit of RNA polymerase. In parallel, a
          library of randomized oligonucleotides representing potential TF target
          sequences, is cloned into a separate vector containing the selectable genes
          HIS3 and URA3. If the DNA-binding domain (bait) binds a potential DNA target
          site (prey) in vivo, it will recruit RNA polymerase to the promoter and
          activate transcription of the reporter genes in that clone. The two reporter
          genes, HIS3 and URA3, allow for positive and negative selections, respectively.
          At the end of the process, positive clones are sequenced and examined with
          motif-finding tools in order to resolve the favoured DNA target sequence
        meaning: OBI:0001682
      OBI:0001683:
        title: chromosome organization assay by fluorescence in-situ hybridization
        description: An in-situ hybridization assay that uses fluorescence to detect
          chromosomal integrity
        meaning: OBI:0001683
      OBI:0001684:
        title: methylation-specific polymerase chain reaction assay
        description: An assay that uses initial modification of DNA by sodium bisulfite,
          converting all unmethylated, but not methylated, cytosines to uracil, and
          subsequent amplification with primers specific for methylated versus unmethylated
          DNA.
        meaning: OBI:0001684
      OBI:0001685:
        title: amplification of intermethylated sites assay
        description: An assay that estimates genome-wide DNA methylation and measures
          methylation of DNA sequences. AIMS is based on the differential enzymatic
          digestion of genomic DNA with methylation-sensitive and methylation-insensitive
          isoschizomers followed by restrained PCR amplification of methylated sequences.
        meaning: OBI:0001685
      OBI:0001686:
        title: in-situ hybridization assay
        description: An assay that localizes a specific DNA or RNA sequence within
          a portion or section of tissue using artificially induced nucleic hybridization.
        meaning: OBI:0001686
      OBI:0001689:
        title: cytochalasin-induced inhibition of actin polymerization assay
        description: 'An assay which uses compound cytochalasin (CHEBI: 23528) to
          block actin polymerization-dependent cell motility (GO:0070358) and actin
          filament polymerization (GO:0030041).'
        meaning: OBI:0001689
      OBI:0001692:
