        description: A B cell epitope binding constant determination assay that measures
          the dissociation constant KD.
        meaning: OBI:0001708
      OBI:0001709:
        title: assay measuring a binding constant of a B cell epitope:antibody complex
        description: A B cell epitope recognition assay that quantitavely characterizes
          the binding of an antibody / BCR with a ligand by determining a binding
          constant.
        meaning: OBI:0001709
      OBI:0001710:
        title: in vivo assay measuring B cell epitope specific protection from challenge
        description: An efficacy of B cell epitope intervention experiment that uses
          a epitope protection experiment.
