        description: An organism detection assay that is based on genetic crossings
          between specimens collected in the field to determine whether fertile progeny
          is produced.
        meaning: OBI:0002736
      OBI:0002737:
        title: organism detection by cytological chromosome examination assay
        description: An organism detection assay that is based on analysis of polytene
          chromosomes through cytological examination of the banding pattern of the
          species.
        meaning: OBI:0002737
      OBI:0002738:
        title: organism detection by isoenzyme electrophoresis assay
        description: An organism detection assay that is based on electrophoresis
          to determine the isozymes that are present in a specific population to determine
          the species.
        meaning: OBI:0002738
      OBI:0002739:
        title: organism detection by morphological examination assay
        description: An organism detection assay that is based on examination of morphology
          and the use of specific taxonomic keys to determine the species of the specimen.
        meaning: OBI:0002739
      OBI:0002740:
        title: organism detection by PCR assay
        description: An organism detection assay that is based on PCR.
        meaning: OBI:0002740
      OBI:0002741:
        title: organism detection by specific DNA hybridization assay
        description: An organism detection assay that is based on DNA hybrdization.
        meaning: OBI:0002741
      OBI:0002742:
