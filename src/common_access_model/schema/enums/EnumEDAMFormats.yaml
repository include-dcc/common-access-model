      edam:format_3701:
        title: Sequin format
        description: A five-column, tab-delimited table of feature locations and qualifiers
          for importing annotation into an existing Sequin submission (an NCBI tool
          for submitting and updating GenBank entries).
        meaning: edam:format_3701
      edam:format_3702:
        title: MSF
        description: Proprietary mass-spectrometry format of Thermo Scientific's ProteomeDiscoverer
          software.
        meaning: edam:format_3702
      edam:format_3706:
        title: Biodiversity data format
        description: Data format for biodiversity data.
        meaning: edam:format_3706
      edam:format_3708:
        title: ABCD format
        description: Exchange format of the Access to Biological Collections Data
          (ABCD) Schema; a standard for the access to and exchange of data about specimens
          and observations (primary biodiversity data).
        meaning: edam:format_3708
      edam:format_3709:
        title: GCT/Res format
        description: Tab-delimited text files of GenePattern that contain a column
          for each sample, a row for each gene, and an expression value for each gene
          in each sample.
        meaning: edam:format_3709
      edam:format_3710:
        title: WIFF format
        description: Mass spectrum file format from QSTAR and QTRAP instruments (ABI/Sciex).
        meaning: edam:format_3710
      edam:format_3711:
        title: X!Tandem XML
        description: Output format used by X! series search engines that is based
          on the XML language BIOML.
        meaning: edam:format_3711
      edam:format_3712:
        title: Thermo RAW
        description: Proprietary file format for mass spectrometry data from Thermo
          Scientific.
        meaning: edam:format_3712
      edam:format_3713:
        title: Mascot .dat file
        description: '"Raw" result file from Mascot database search.'
        meaning: edam:format_3713
      edam:format_3714:
        title: MaxQuant APL peaklist format
        description: Format of peak list files from Andromeda search engine (MaxQuant)
          that consist of arbitrarily many spectra.
        meaning: edam:format_3714
      edam:format_3725:
        title: SBOL
        description: Synthetic Biology Open Language (SBOL) is an XML format for the
          specification and exchange of biological design information in synthetic
          biology.
        meaning: edam:format_3725
      edam:format_3726:
        title: PMML
        description: PMML uses XML to represent mining models. The structure of the
          models is described by an XML Schema.
        meaning: edam:format_3726
      edam:format_3727:
        title: OME-TIFF
        description: Image file format used by the Open Microscopy Environment (OME).
        meaning: edam:format_3727
      edam:format_3728:
        title: LocARNA PP
        description: The LocARNA PP format combines sequence or alignment information
          and (respectively, single or consensus) ensemble probabilities into an PP
          2.0 record.
        meaning: edam:format_3728
      edam:format_3729:
        title: dbGaP format
        description: Input format used by the Database of Genotypes and Phenotypes
          (dbGaP).
        meaning: edam:format_3729
      edam:format_3746:
        title: BIOM format
        description: The BIological Observation Matrix (BIOM) is a format for representing
          biological sample by observation contingency tables in broad areas of comparative
          omics. The primary use of this format is to represent OTU tables and metagenome
          tables.
        meaning: edam:format_3746
      edam:format_3747:
        title: protXML
        description: A format for storage, exchange, and processing of protein identifications
          created from ms/ms-derived peptide sequence data.
        meaning: edam:format_3747
      edam:format_3748:
        title: Linked data format
        description: A linked data format enables publishing structured data as linked
          data (Linked Data), so that the data can be interlinked and become more
          useful through semantic queries.
        meaning: edam:format_3748
      edam:format_3749:
        title: JSON-LD
        description: JSON-LD, or JavaScript Object Notation for Linked Data, is a
          method of encoding Linked Data using JSON.
        meaning: edam:format_3749
      edam:format_3750:
        title: YAML
        description: YAML (YAML Ain't Markup Language) is a human-readable tree-structured
          data serialisation language.
        meaning: edam:format_3750
      edam:format_3751:
        title: DSV
        description: Tabular data represented as values in a text file delimited by
          some character.
        meaning: edam:format_3751
      edam:format_3752:
        title: CSV
        description: Tabular data represented as comma-separated values in a text
          file.
        meaning: edam:format_3752
      edam:format_3758:
        title: SEQUEST .out file
        description: '"Raw" result file from SEQUEST database search.'
        meaning: edam:format_3758
      edam:format_3764:
        title: idXML
        description: XML file format for files containing information about peptide
          identifications from mass spectrometry data analysis carried out with OpenMS.
        meaning: edam:format_3764
      edam:format_3765:
        title: KNIME datatable format
        description: Data table formatted such that it can be passed/streamed within
          the KNIME platform.
        meaning: edam:format_3765
      edam:format_3770:
        title: UniProtKB XML
        description: UniProtKB XML sequence features format is an XML format available
          for downloading UniProt entries.
        meaning: edam:format_3770
      edam:format_3771:
        title: UniProtKB RDF
        description: UniProtKB RDF sequence features format is an RDF format available
          for downloading UniProt entries (in RDF/XML).
        meaning: edam:format_3771
      edam:format_3772:
        title: BioJSON (BioXSD)
        description: BioJSON is a BioXSD-schema-based JSON format of sequence-based
          data and some other common data - sequence records, alignments, feature
          records, references to resources, and more - optimised for integrative bioinformatics,
          web applications and APIs, and object-oriented programming.
        meaning: edam:format_3772
      edam:format_3773:
        title: BioYAML
        description: BioYAML is a BioXSD-schema-based YAML format of sequence-based
          data and some other common data - sequence records, alignments, feature
          records, references to resources, and more - optimised for integrative bioinformatics,
          web APIs, human readability and editing, and object-oriented programming.
        meaning: edam:format_3773
      edam:format_3774:
        title: BioJSON (Jalview)
        description: BioJSON is a JSON format of single multiple sequence alignments,
          with their annotations, features, and custom visualisation and application
          settings for the Jalview workbench.
        meaning: edam:format_3774
      edam:format_3775:
        title: GSuite
        description: GSuite is a tabular format for collections of genome or sequence
          feature tracks, suitable for integrative multi-track analysis. GSuite contains
          links to genome/sequence tracks, with additional metadata.
        meaning: edam:format_3775
      edam:format_3776:
        title: BTrack
        description: BTrack is an HDF5-based binary format for genome or sequence
          feature tracks and their collections, suitable for integrative multi-track
          analysis. BTrack is a binary, compressed alternative to the GTrack and GSuite
          formats.
        meaning: edam:format_3776
      edam:format_3777:
        title: MCPD
        description: The FAO/Bioversity/IPGRI Multi-Crop Passport Descriptors (MCPD)
          is an international standard format for exchange of germplasm information.
        meaning: edam:format_3777
      edam:format_3780:
        title: Annotated text format
        description: Data format of an annotated text, e.g. with recognised entities,
          concepts, and relations.
        meaning: edam:format_3780
      edam:format_3781:
        title: PubAnnotation format
        description: JSON format of annotated scientific text used by PubAnnotations
          and other tools.
        meaning: edam:format_3781
      edam:format_3782:
        title: BioC
        description: BioC is a standardised XML format for sharing and integrating
          text data and annotations.
        meaning: edam:format_3782
      edam:format_3783:
        title: PubTator format
        description: Native textual export format of annotated scientific text from
          PubTator.
        meaning: edam:format_3783
      edam:format_3784:
        title: Open Annotation format
        description: A format of text annotation using the linked-data Open Annotation
          Data Model, serialised typically in RDF or JSON-LD.
        meaning: edam:format_3784
      edam:format_3785:
        title: BioNLP Shared Task format
        description: A family of similar formats of text annotation, used by BRAT
          and other tools, known as BioNLP Shared Task format (BioNLP 2009 Shared
          Task on Event Extraction, BioNLP Shared Task 2011, BioNLP Shared Task 2013),
          BRAT format, BRAT standoff format, and similar.
        meaning: edam:format_3785
      edam:format_3787:
        title: Query language
        description: A query language (format) for structured database queries.
        meaning: edam:format_3787
      edam:format_3788:
        title: SQL
        description: SQL (Structured Query Language) is the de-facto standard query
          language (format of queries) for querying and manipulating data in relational
          databases.
        meaning: edam:format_3788
      edam:format_3789:
        title: XQuery
        description: XQuery (XML Query) is a query language (format of queries) for
          querying and manipulating structured and unstructured data, usually in the
          form of XML, text, and with vendor-specific extensions for other data formats
          (JSON, binary, etc.).
        meaning: edam:format_3789
      edam:format_3790:
        title: SPARQL
        description: SPARQL (SPARQL Protocol and RDF Query Language) is a semantic
          query language for querying and manipulating data stored in Resource Description
          Framework (RDF) format.
        meaning: edam:format_3790
      edam:format_3804:
        title: xsd
        description: XML format for XML Schema.
        meaning: edam:format_3804
      edam:format_3811:
        title: XMFA
        description: XMFA format stands for eXtended Multi-FastA format and is used
          to store collinear sub-alignments that constitute a single genome alignment.
        meaning: edam:format_3811
      edam:format_3812:
        title: GEN
        description: The GEN file format contains genetic data and describes SNPs.
        meaning: edam:format_3812
      edam:format_3813:
        title: SAMPLE file format
        description: The SAMPLE file format contains information about each individual
          i.e. individual IDs, covariates, phenotypes and missing data proportions,
          from a GWAS study.
        meaning: edam:format_3813
      edam:format_3814:
        title: SDF
        description: SDF is one of a family of chemical-data file formats developed
          by MDL Information Systems; it is intended especially for structural information.
        meaning: edam:format_3814
      edam:format_3815:
        title: Molfile
        description: An MDL Molfile is a file format for holding information about
          the atoms, bonds, connectivity and coordinates of a molecule.
        meaning: edam:format_3815
      edam:format_3816:
        title: Mol2
        description: Complete, portable representation of a SYBYL molecule. ASCII
          file which contains all the information needed to reconstruct a SYBYL molecule.
        meaning: edam:format_3816
      edam:format_3817:
        title: latex
        description: format for the LaTeX document preparation system.
        meaning: edam:format_3817
      edam:format_3818:
        title: ELAND format
        description: Tab-delimited text file format used by Eland - the read-mapping
          program distributed by Illumina with its sequencing analysis pipeline -
          which maps short Solexa sequence reads to the human reference genome.
        meaning: edam:format_3818
      edam:format_3819:
        title: Relaxed PHYLIP Interleaved
        description: Phylip multiple alignment sequence format, less stringent than
          PHYLIP format.
        meaning: edam:format_3819
      edam:format_3820:
        title: Relaxed PHYLIP Sequential
        description: Phylip multiple alignment sequence format, less stringent than
          PHYLIP sequential format (format_1998).
        meaning: edam:format_3820
      edam:format_3821:
        title: VisML
        description: Default XML format of VisANT, containing all the network information.
        meaning: edam:format_3821
      edam:format_3822:
        title: GML
        description: GML (Graph Modeling Language) is a text file format supporting
          network data with a very easy syntax. It is used by Graphlet, Pajek, yEd,
          LEDA and NetworkX.
        meaning: edam:format_3822
      edam:format_3823:
        title: FASTG
        description: FASTG is a format for faithfully representing genome assemblies
          in the face of allelic polymorphism and assembly uncertainty.
        meaning: edam:format_3823
      edam:format_3824:
        title: NMR data format
        description: Data format for raw data from a nuclear magnetic resonance (NMR)
          spectroscopy experiment.
        meaning: edam:format_3824
      edam:format_3825:
        title: nmrML
        description: nmrML is an MSI supported XML-based open access format for metabolomics
          NMR raw and processed spectral data. It is accompanies by an nmrCV (controlled
          vocabulary) to allow ontology-based annotations.
        meaning: edam:format_3825
      edam:format_3826:
        title: proBAM
        description: . proBAM is an adaptation of BAM (format_2572), which was extended
          to meet specific requirements entailed by proteomics data.
        meaning: edam:format_3826
      edam:format_3827:
        title: proBED
        description: . proBED is an adaptation of BED (format_3003), which was extended
          to meet specific requirements entailed by proteomics data.
        meaning: edam:format_3827
      edam:format_3828:
        title: Raw microarray data format
        description: Data format for raw microarray data.
        meaning: edam:format_3828
      edam:format_3829:
        title: GPR
        description: GenePix Results (GPR) text file format developed by Axon Instruments
          that is used to save GenePix Results data.
        meaning: edam:format_3829
      edam:format_3830:
        title: ARB
        description: Binary format used by the ARB software suite.
        meaning: edam:format_3830
      edam:format_3832:
        title: consensusXML
        description: OpenMS format for grouping features in one map or across several
          maps.
        meaning: edam:format_3832
      edam:format_3833:
        title: featureXML
        description: OpenMS format for quantitation results (LC/MS features).
        meaning: edam:format_3833
      edam:format_3834:
        title: mzData
        description: Now deprecated data format of the HUPO Proteomics Standards Initiative.
          Replaced by mzML (format_3244).
        meaning: edam:format_3834
      edam:format_3835:
        title: TIDE TXT
        description: Format supported by the Tide tool for identifying peptides from
          tandem mass spectra.
        meaning: edam:format_3835
      edam:format_3836:
        title: BLAST XML v2 results format
        description: XML format as produced by the NCBI Blast package v2.
        meaning: edam:format_3836
      edam:format_3838:
        title: pptx
        description: Microsoft Powerpoint format.
        meaning: edam:format_3838
      edam:format_3839:
        title: ibd
        description: ibd is a data format for mass spectrometry imaging data.
        meaning: edam:format_3839
      edam:format_3841:
        title: NLP format
        description: Data format used in Natural Language Processing.
        meaning: edam:format_3841
      edam:format_3843:
        title: BEAST
        description: XML input file format for BEAST Software (Bayesian Evolutionary
          Analysis Sampling Trees).
        meaning: edam:format_3843
      edam:format_3844:
        title: Chado-XML
        description: Chado-XML format is a direct mapping of the Chado relational
          schema into XML.
        meaning: edam:format_3844
      edam:format_3845:
        title: HSAML
        description: 'An alignment format generated by PRANK/PRANKSTER consisting
          of four elements: newick, nodes, selection and model.'
        meaning: edam:format_3845
      edam:format_3846:
        title: InterProScan XML
        description: Output xml file from the InterProScan sequence analysis application.
        meaning: edam:format_3846
      edam:format_3847:
        title: KGML
        description: The KEGG Markup Language (KGML) is an exchange format of the
          KEGG pathway maps, which is converted from internally used KGML+ (KGML+SVG)
          format.
        meaning: edam:format_3847
      edam:format_3848:
        title: PubMed XML
        description: XML format for collected entries from bibliographic databases
          MEDLINE and PubMed.
        meaning: edam:format_3848
      edam:format_3849:
        title: MSAML
        description: A set of XML compliant markup components for describing multiple
          sequence alignments.
        meaning: edam:format_3849
      edam:format_3850:
        title: OrthoXML
        description: OrthoXML is designed broadly to allow the storage and comparison
          of orthology data from any ortholog database. It establishes a structure
          for describing orthology relationships while still allowing flexibility
          for database-specific information to be encapsulated in the same format.
        meaning: edam:format_3850
      edam:format_3851:
        title: PSDML
        description: Tree structure of Protein Sequence Database Markup Language generated
          using Matra software.
        meaning: edam:format_3851
      edam:format_3852:
        title: SeqXML
        description: SeqXML is an XML Schema to describe biological sequences, developed
          by the Stockholm Bioinformatics Centre.
        meaning: edam:format_3852
      edam:format_3853:
        title: UniParc XML
        description: XML format for the UniParc database.
        meaning: edam:format_3853
      edam:format_3854:
        title: UniRef XML
        description: XML format for the UniRef reference clusters.
        meaning: edam:format_3854
      edam:format_3857:
        title: CWL
        description: Common Workflow Language (CWL) format for description of command-line
          tools and workflows.
        meaning: edam:format_3857
      edam:format_3858:
        title: Waters RAW
        description: Proprietary file format for mass spectrometry data from Waters.
        meaning: edam:format_3858
      edam:format_3859:
        title: JCAMP-DX
        description: A standardized file format for data exchange in mass spectrometry,
          initially developed for infrared spectrometry.
        meaning: edam:format_3859
      edam:format_3862:
        title: NLP annotation format
        description: An NLP format used for annotated textual documents.
        meaning: edam:format_3862
      edam:format_3863:
        title: NLP corpus format
        description: NLP format used by a specific type of corpus (collection of texts).
        meaning: edam:format_3863
      edam:format_3864:
        title: mirGFF3
        description: mirGFF3 is a common format for microRNA data resulting from small-RNA
          RNA-Seq workflows.
        meaning: edam:format_3864
      edam:format_3865:
        title: RNA annotation format
        description: A "placeholder" concept for formats of annotated RNA data, including
          e.g. microRNA and RNA-Seq data.
        meaning: edam:format_3865
      edam:format_3866:
        title: Trajectory format
        description: File format to store trajectory information for a 3D structure
          .
        meaning: edam:format_3866
      edam:format_3867:
        title: Trajectory format (binary)
        description: Binary file format to store trajectory information for a 3D structure
          .
        meaning: edam:format_3867
      edam:format_3868:
        title: Trajectory format (text)
        description: Textual file format to store trajectory information for a 3D
          structure .
        meaning: edam:format_3868
      edam:format_3873:
        title: HDF
        description: HDF is the name of a set of file formats and libraries designed
          to store and organize large amounts of numerical data, originally developed
          at the National Center for Supercomputing Applications at the University
          of Illinois.
        meaning: edam:format_3873
      edam:format_3874:
        title: PCAzip
        description: PCAZip format is a binary compressed file to store atom coordinates
          based on Essential Dynamics (ED) and Principal Component Analysis (PCA).
        meaning: edam:format_3874
      edam:format_3875:
        title: XTC
        description: Portable binary format for trajectories produced by GROMACS package.
        meaning: edam:format_3875
      edam:format_3876:
        title: TNG
        description: Trajectory Next Generation (TNG) is a format for storage of molecular
          simulation data. It is designed and implemented by the GROMACS development
          group, and it is called to be the substitute of the XTC format.
        meaning: edam:format_3876
      edam:format_3877:
        title: XYZ
        description: The XYZ chemical file format is widely supported by many programs,
          although many slightly different XYZ file formats coexist (Tinker XYZ, UniChem
          XYZ, etc.). Basic information stored for each atom in the system are x,
          y and z coordinates and atom element/atomic number.
        meaning: edam:format_3877
      edam:format_3878:
        title: mdcrd
        description: AMBER trajectory (also called mdcrd), with 10 coordinates per
          line and format F8.3 (fixed point notation with field width 8 and 3 decimal
          places).
        meaning: edam:format_3878
      edam:format_3879:
        title: Topology format
        description: Format of topology files; containing the static information of
          a structure molecular system that is needed for a molecular simulation.
        meaning: edam:format_3879
      edam:format_3880:
        title: GROMACS top
        description: GROMACS MD package top textual files define an entire structure
          system topology, either directly, or by including itp files.
        meaning: edam:format_3880
      edam:format_3881:
        title: AMBER top
        description: AMBER Prmtop file (version 7) is a structure topology text file
          divided in several sections designed to be parsed easily using simple Fortran
          code. Each section contains particular topology information, such as atom
          name, charge, mass, angles, dihedrals, etc.
        meaning: edam:format_3881
      edam:format_3882:
        title: PSF
        description: 'X-Plor Protein Structure Files (PSF) are structure topology
          files used by NAMD and CHARMM molecular simulations programs. PSF files
          contain six main sections of interest: atoms, bonds, angles, dihedrals,
          improper dihedrals (force terms used to maintain planarity) and cross-terms.'
        meaning: edam:format_3882
      edam:format_3883:
        title: GROMACS itp
        description: GROMACS itp files (include topology) contain structure topology
          information, and are typically included in GROMACS topology files (GROMACS
          top). Itp files are used to define individual (or multiple) components of
          a topology as a separate file. This is particularly useful if there is a
          molecule that is used frequently, and also reduces the size of the system
          topology file, splitting it in different parts.
        meaning: edam:format_3883
      edam:format_3884:
        title: FF parameter format
        description: Format of force field parameter files, which store the set of
          parameters (charges, masses, radii, bond lengths, bond dihedrals, etc.)
          that are essential for the proper description and simulation of a molecular
          system.
        meaning: edam:format_3884
      edam:format_3885:
        title: BinPos
        description: Scripps Research Institute BinPos format is a binary formatted
          file to store atom coordinates.
        meaning: edam:format_3885
      edam:format_3886:
        title: RST
        description: AMBER coordinate/restart file with 6 coordinates per line and
          decimal format F12.7 (fixed point notation with field width 12 and 7 decimal
          places).
        meaning: edam:format_3886
      edam:format_3887:
        title: CHARMM rtf
        description: Format of CHARMM Residue Topology Files (RTF), which define groups
          by including the atoms, the properties of the group, and bond and charge
          information.
        meaning: edam:format_3887
      edam:format_3888:
        title: AMBER frcmod
        description: AMBER frcmod (Force field Modification) is a file format to store
          any modification to the standard force field needed for a particular molecule
          to be properly represented in the simulation.
        meaning: edam:format_3888
      edam:format_3889:
        title: AMBER off
        description: AMBER Object File Format library files (OFF library files) store
          residue libraries (forcefield residue parameters).
        meaning: edam:format_3889
      edam:format_3906:
        title: NMReDATA
        description: 'MReData is a text based data standard for processed NMR data.
          It is relying on SDF molecule data and allows to store assignments of NMR
          peaks to molecule features. The NMR-extracted data (or "NMReDATA") includes:
          Chemical shift,scalar coupling, 2D correlation, assignment, etc.'
        meaning: edam:format_3906
      edam:format_3909:
        title: BpForms
        description: BpForms is a string format for concretely representing the primary
          structures of biopolymers, including DNA, RNA, and proteins that include
          non-canonical nucleic and amino acids. See https://www.bpforms.org for more
          information.
        meaning: edam:format_3909
      edam:format_3910:
        title: trr
        description: Format of trr files that contain the trajectory of a simulation
          experiment used by GROMACS.
        meaning: edam:format_3910
      edam:format_3911:
        title: msh
        description: Mash sketch is a format for sequence / sequence checksum information.
          To make a sketch, each k-mer in a sequence is hashed, which creates a pseudo-random
          identifier. By sorting these hashes, a small subset from the top of the
          sorted list can represent the entire sequence.
        meaning: edam:format_3911
      edam:format_3913:
        title: Loom
        description: The Loom file format is based on HDF5, a standard for storing
          large numerical datasets. The Loom format is designed to efficiently hold
          large omics datasets. Typically, such data takes the form of a large matrix
          of numbers, along with metadata for the rows and columns.
        meaning: edam:format_3913
      edam:format_3915:
        title: Zarr
        description: The Zarr format is an implementation of chunked, compressed,
          N-dimensional arrays for storing data.
        meaning: edam:format_3915
      edam:format_3916:
        title: MTX
        description: The Matrix Market matrix (MTX) format stores numerical or pattern
          matrices in a dense (array format) or sparse (coordinate format) representation.
        meaning: edam:format_3916
      edam:format_3951:
        title: BcForms
        description: BcForms is a format for abstractly describing the molecular structure
          (atoms and bonds) of macromolecular complexes as a collection of subunits
          and crosslinks. Each subunit can be described with BpForms (http://edamontology.org/format_3909)
          or SMILES (http://edamontology.org/data_2301). BcForms uses an ontology
          of crosslinks to abstract the chemical details of crosslinks from the descriptions
          of complexes (see https://bpforms.org/crosslink.html).
        meaning: edam:format_3951
      edam:format_3956:
        title: N-Quads
        description: N-Quads is a line-based, plain text format for encoding an RDF
          dataset. It includes information about the graph each triple belongs to.
        meaning: edam:format_3956
      edam:format_3969:
        title: Vega
        description: Vega is a visualization grammar, a declarative language for creating,
          saving, and sharing interactive visualization designs. With Vega, you can
          describe the visual appearance and interactive behavior of a visualization
          in a JSON format, and generate web-based views using Canvas or SVG.
        meaning: edam:format_3969
      edam:format_3970:
        title: Vega-lite
        description: Vega-Lite is a high-level grammar of interactive graphics. It
          provides a concise JSON syntax for rapidly generating visualizations to
          support analysis. Vega-Lite specifications can be compiled to Vega specifications.
        meaning: edam:format_3970
      edam:format_3971:
        title: NeuroML
        description: A model description language for computational neuroscience.
        meaning: edam:format_3971
      edam:format_3972:
        title: BNGL
        description: BioNetGen is a format for the specification and simulation of
          rule-based models of biochemical systems, including signal transduction,
          metabolic, and genetic regulatory networks.
        meaning: edam:format_3972
      edam:format_3973:
        title: Docker image
        description: A Docker image is a file, comprised of multiple layers, that
          is used to execute code in a Docker container. An image is essentially built
          from the instructions for a complete and executable version of an application,
          which relies on the host OS kernel.
        meaning: edam:format_3973
      edam:format_3975:
        title: GFA 1
        description: Graphical Fragment Assembly captures sequence graphs as the product
          of an assembly, a representation of variation in genomes, splice graphs
          in genes, or even overlap between reads from long-read sequencing technology.
        meaning: edam:format_3975
      edam:format_3976:
        title: GFA 2
        description: Graphical Fragment Assembly captures sequence graphs as the product
          of an assembly, a representation of variation in genomes, splice graphs
          in genes, or even overlap between reads from long-read sequencing technology.
          GFA2 is an update of GFA1 which is not compatible with GFA1.
        meaning: edam:format_3976
      edam:format_3977:
        title: ObjTables
        description: ObjTables is a toolkit for creating reusable datasets that are
          both human and machine-readable, combining the ease of spreadsheets (e.g.,
          Excel workbooks) with the rigor of schemas (classes, their attributes, the
          type of each attribute, and the possible relationships between instances
          of classes). ObjTables consists of a format for describing schemas for spreadsheets,
          numerous data types for science, a syntax for indicating the class and attribute
          represented by each table and column in a workbook, and software for using
          schemas to rigorously validate, merge, split, compare, and revision datasets.
        meaning: edam:format_3977
      edam:format_3978:
        title: CONTIG
        description: The CONTIG format used for output of the SOAPdenovo alignment
          program. It contains contig sequences generated without using mate pair
          information.
        meaning: edam:format_3978
      edam:format_3979:
        title: WEGO
        description: WEGO native format used by the Web Gene Ontology Annotation Plot
          application.   Tab-delimited format with gene names and others GO IDs (columns)
          with one annotation record per line.
        meaning: edam:format_3979
      edam:format_3980:
        title: RPKM
        description: Tab-delimited format for gene expression levels table, calculated
          as Reads Per Kilobase per Million (RPKM) mapped reads.
        meaning: edam:format_3980
      edam:format_3981:
        title: TAR format
        description: TAR archive file format generated by the Unix-based utility tar.
        meaning: edam:format_3981
      edam:format_3982:
        title: CHAIN
        description: The CHAIN format describes a pairwise alignment that allow gaps
          in both sequences simultaneously and is used by the UCSC Genome Browser.
        meaning: edam:format_3982
      edam:format_3983:
        title: NET
        description: The NET file format is used to describe the data that underlie
          the net alignment annotations in the UCSC Genome Browser.
        meaning: edam:format_3983
      edam:format_3984:
        title: QMAP
        description: Format of QMAP files generated for methylation data from an internal
          BGI pipeline.
        meaning: edam:format_3984
      edam:format_3985:
        title: gxformat2
        description: An emerging format for high-level Galaxy workflow description.
        meaning: edam:format_3985
      edam:format_3986:
        title: WMV
        description: The proprietary native video format of various Microsoft programs
          such as Windows Media Player.
        meaning: edam:format_3986
      edam:format_3987:
        title: ZIP format
        description: ZIP is an archive file format that supports lossless data compression.
        meaning: edam:format_3987
      edam:format_3988:
        title: LSM
        description: Zeiss' proprietary image format based on TIFF.
        meaning: edam:format_3988
      edam:format_3989:
        title: GZIP format
        description: GNU zip compressed file format common to Unix-based operating
          systems.
        meaning: edam:format_3989
      edam:format_3990:
        title: AVI
        description: Audio Video Interleaved (AVI) format is a multimedia container
          format for AVI files, that allows synchronous audio-with-video playback.
        meaning: edam:format_3990
      edam:format_3991:
        title: TrackDB
        description: A declaration file format for UCSC browsers track dataset display
          characteristics.
        meaning: edam:format_3991
      edam:format_3992:
        title: CIGAR format
        description: Compact Idiosyncratic Gapped Alignment Report format is a compressed
          (run-length encoded) pairwise alignment format. It is useful for representing
          long (e.g. genomic) pairwise alignments.
        meaning: edam:format_3992
      edam:format_3993:
        title: Stereolithography format
        description: STL is a file format native to the stereolithography CAD software
          created by 3D Systems. The format is used to save and share surface-rendered
          3D images and also for 3D printing.
        meaning: edam:format_3993
      edam:format_3994:
        title: U3D
        description: U3D (Universal 3D) is a compressed file format and data structure
          for 3D computer graphics. It contains 3D model information such as triangle
          meshes, lighting, shading, motion data, lines and points with color and
          structure.
        meaning: edam:format_3994
      edam:format_3995:
        title: Texture file format
        description: Bitmap image format used for storing textures.
        meaning: edam:format_3995
      edam:format_3996:
        title: Python script
        description: Format for scripts writtenin Python - a widely used high-level
          programming language for general-purpose programming.
        meaning: edam:format_3996
      edam:format_3997:
        title: MPEG-4
        description: A digital multimedia container format most commonly used to store
          video and audio.
        meaning: edam:format_3997
      edam:format_3998:
        title: Perl script
        description: Format for scripts written in Perl - a family of high-level,
          general-purpose, interpreted, dynamic programming languages.
        meaning: edam:format_3998
      edam:format_3999:
        title: R script
        description: Format for scripts written in the R language - an open source
          programming language and software environment for statistical computing
          and graphics that is supported by the R Foundation for Statistical Computing.
        meaning: edam:format_3999
      edam:format_4000:
        title: R markdown
        description: A file format for making dynamic documents (R Markdown scripts)
          with the R language.
        meaning: edam:format_4000
      edam:format_4002:
        title: pickle
        description: Format used by Python pickle module for serializing and de-serializing
          a Python object structure.
        meaning: edam:format_4002
      edam:format_4003:
        title: NumPy format
        description: The standard binary file format used by NumPy - a fundamental
          package for scientific computing with Python - for persisting a single arbitrary
          NumPy array on disk. The format stores all of the shape and dtype information
          necessary to reconstruct the array correctly.
        meaning: edam:format_4003
      edam:format_4004:
        title: SimTools repertoire file format
        description: Format of repertoire (archive) files that can be read by SimToolbox
          (a MATLAB toolbox for structured illumination fluorescence microscopy) or
          alternatively extracted with zip file archiver software.
        meaning: edam:format_4004
      edam:format_4005:
        title: Configuration file format
        description: A configuration file used by various programs to store settings
          that are specific to their respective software.
        meaning: edam:format_4005
      edam:format_4006:
        title: Zstandard format
        description: Format used by the Zstandard real-time compression algorithm.
        meaning: edam:format_4006
      edam:format_4007:
        title: MATLAB script
        description: The file format for MATLAB scripts or functions.
        meaning: edam:format_4007
      edam:format_4015:
        title: PEtab
        description: A data format for specifying parameter estimation problems in
          systems biology.
        meaning: edam:format_4015
      edam:format_4018:
        title: gVCF
        description: Genomic Variant Call Format (gVCF) is a version of VCF that includes
          not only the positions that are variant when compared to a reference genome,
          but also the non-variant positions as ranges, including metrics of confidence
          that the positions in the range are actually non-variant e.g. minimum read-depth
          and genotype quality.
        meaning: edam:format_4018
      edam:format_4023:
        title: cml
        description: Chemical Markup Language (CML) is an XML-based format for encoding
          detailed information about a wide range of chemical concepts.
        meaning: edam:format_4023
      edam:format_4024:
        title: cif
        description: Crystallographic Information File (CIF) is a data exchange standard
          file format for Crystallographic Information and related Structural Science
          data.
        meaning: edam:format_4024
      edam:format_4025:
        title: BioSimulators format for the specifications of biosimulation tools
        description: Format for describing the capabilities of a biosimulation tool
          including the modeling frameworks, simulation algorithms, and modeling formats
          that it supports, as well as metadata such as a list of the interfaces,
          programming languages, and operating systems supported by the tool; a link
          to download the tool; a list of the authors of the tool; and the license
          to the tool.
        meaning: edam:format_4025
      edam:format_4026:
        title: BioSimulators standard for command-line interfaces for biosimulation
          tools
        description: Outlines the syntax and semantics of the input and output arguments
          for command-line interfaces for biosimulation tools.
        meaning: edam:format_4026
      edam:format_4035:
        title: PQR
        description: Data format derived from the standard PDB format, which enables
          user to incorporate parameters for charge and radius to the existing PDB
          data file.
        meaning: edam:format_4035
      edam:format_4036:
        title: PDBQT
        description: Data format used in AutoDock 4 for storing atomic coordinates,
          partial atomic charges and AutoDock atom types for both receptors and ligands.
        meaning: edam:format_4036
      edam:format_4039:
        title: MSP
        description: MSP is a data format for mass spectrometry data.
        meaning: edam:format_4039
      edam:format_4041:
        title: maDMP
        description: maDMP stands for machine-actionable data management plan, a standard
          for DMPs developed by the Research Data Alliance (RDA).
        meaning: edam:format_4041
      edam:format_4048:
        title: Nextflow
        description: Nextflow is a workflow system for creating scalable, portable,
          and reproducible workflows.
        meaning: edam:format_4048
      edam:format_4049:
        title: Snakemake
        description: The Snakemake workflow management system is a tool to create
          reproducible and scalable data analyses.
        meaning: edam:format_4049
      edam:format_4050:
        title: SDRF
        description: Sample and Data Relationship File for a proteomics experiment.
        meaning: edam:format_4050
      edam:format_4058:
        title: mzTab-M
        description: mzTab-M is a light-weight, tab-delimited format for mass spectrometry-based
          chemical profiling data, including metabolomics.
        meaning: edam:format_4058
      edam:format_4059:
        title: mzTab-L
        description: mzTab-L is a light-weight, tab-delimited format for mass spectrometry-based
          lipidomics data. It is a compatible version of mzTab-M, with additional
          rules and information standard (reporting guidelines).
        meaning: edam:format_4059
      edam:format_4066:
        title: ISA-Tab Investigation file
        description: ISA-Tab Investigation file (i_Investigation.txt) contains metadata
          describing the overall goals, means, and context of an investigation/experiment,
          including references to associated Study and Assay files.
        meaning: edam:format_4066
      edam:format_4067:
        title: ISA-Tab Study file
        description: ISA-Tab Study file (s_*.txt) contains sample metadata describing
          the subjects under study, their sources, characteristics, sampling methodology,
          and any treatments or manipulations applied.
        meaning: edam:format_4067
      edam:format_4068:
        title: ISA-Tab Assay file
        description: ISA-Tab Assay file (a_*.txt) contains assay metadata describing
          test steps and analytical measurements performed on the sample material,
          including measurement types, technology used, and references to raw and
          derived data files.
        meaning: edam:format_4068
      edam:format_4069:
        title: ISA-JSON
        description: ISA-JSON stands for Investigation / Study / Assay (ISA) JavaScript
          Object Notation (JSON) format, and it is comprised of metadata describing
          observational or experimental scientific studies.
        meaning: edam:format_4069
      edam:format_4070:
        title: mwTab
        description: mwTab is a tab-delimited text format developed by the Metabolomics
          Workbench to facilitate programmatic processing of metabolomics data and
          metadata suitable for submission to the repository.
        meaning: edam:format_4070
      edam:format_4071:
        title: MHD
        description: MHD (MetabolomicsHub Common Data Model) is a JSON-based format
          providing a standardised, FAIR-compliant data model for the exchange, discovery,
          and reuse of metabolomics dataset metadata across international repositories.
        meaning: edam:format_4071
      edam:format_4072:
        title: MHD announcement
        description: The MHD announcement file is a JSON-based format used to notify
          MetabolomicsHub of new or updated dataset submissions, serving as a manifest
          or notification file within the MHD data flow.
        meaning: edam:format_4072
      edam:format_4073:
        title: MetaboLights MAF
        description: MetaboLights MAF (Metabolite Annotation File) is a tab-separated
          file format used to report metabolites identified or annotated in a metabolomics
          study, including compound identifiers, chemical structure representations,
          mass-to-charge ratios, retention times, and per-sample quantitative measurements.
        meaning: edam:format_4073
